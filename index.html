<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Freshora Online Store</title>

<link rel="stylesheet" href="style.css">

<!-- Simple modern font -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Inter', sans-serif;
  margin: 0;
  background: #0f172a;
  color: white;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 20px;
  background: #111827;
  position: sticky;
  top: 0;
}

header h1 {
  font-size: 18px;
}

header a {
  color: #00ff99;
  text-decoration: none;
  font-weight: bold;
}

#products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px;
  padding: 15px;
}

.card {
  background: #1f2937;
  border-radius: 12px;
  padding: 10px;
  text-align: center;
  transition: 0.2s;
}

.card:hover {
  transform: scale(1.03);
}

.card img {
  width: 100%;
  height: 140px;
  object-fit: cover;
  border-radius: 10px;
}

.card h3 {
  font-size: 14px;
  margin: 8px 0 4px;
}

.card p {
  font-size: 13px;
  color: #00ff99;
}

button {
  background: #00ff99;
  border: none;
  padding: 6px 10px;
  margin-top: 6px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  background: #00cc77;
}
</style>

</head>

<body>

<header>
  <h1>Freshora Online Store</h1>
  <a href="login.html">Admin Login</a>
</header>

<div id="products"></div>

<!-- Firebase App -->
<script type="module" src="app.js"></script>

<!-- 🔥 ERUDA (MOBILE CONSOLE DEBUG TOOL) -->
<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>
  eruda.init();
  console.log("Freshora Loaded 🚀");
</script>

</body>
</html>
