<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Freshora Store</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">

  <div class="logo"
       ondblclick="window.location='login.html'">
    Freshora
  </div>

  <input id="searchInput" placeholder="Search products...">

  <div class="header-actions">

    <button onclick="toggleDarkMode()" class="icon-btn">
      🌙
    </button>

    <button class="cart-btn" onclick="toggleCart()">
      🛒 <span id="cartCount">0</span>
    </button>

  </div>

</header>

<!-- CATEGORY -->
<div class="category-bar" id="categoryBar">

  <button class="cat-btn active" onclick="filterCategory('all')">All</button>
  <button class="cat-btn" onclick="filterCategory('Grocery')">Grocery</button>
  <button class="cat-btn" onclick="filterCategory('Drinks')">Drinks</button>
  <button class="cat-btn" onclick="filterCategory('Snacks')">Snacks</button>
  <button class="cat-btn" onclick="filterCategory('Beauty')">Beauty</button>

</div>

<!-- PRODUCTS -->
<div id="products"></div>

<!-- FLOATING CART -->
<div class="floating-cart" onclick="toggleCart()">
  🛒 <span id="floatingCartCount">0</span>
</div>

<!-- CART DRAWER -->
<div id="cartDrawer" class="cart-drawer">

  <div class="cart-header">
    <h2>Your Cart</h2>
    <button onclick="toggleCart()">✕</button>
  </div>

  <div id="cartItems"></div>

  <div class="sticky-checkout">

    <h3 id="cartTotal">Total: Rs 0</h3>

    <button class="checkout-btn" onclick="checkout()">
      Checkout
    </button>

    <button onclick="clearCart()">
      Clear Cart
    </button>

  </div>

</div>

<!-- MODAL -->
<div id="productModal" class="modal">

  <div class="modal-content">

    <span class="close" onclick="closeModal()">×</span>

    <img id="modalImage">

    <div class="modal-details">

      <h2 id="modalName"></h2>
      <p id="modalPrice"></p>

      <div class="rating">⭐⭐⭐⭐⭐</div>

      <button id="modalAddBtn">Add to Cart</button>

    </div>

  </div>

</div>

<!-- MOBILE NAV -->
<div class="mobile-nav">

  <a href="#">🏠 Home</a>
  <a href="javascript:void(0)" onclick="toggleCart()">🛒 Cart</a>

</div>

<script type="module" src="app.js"></script>

</body>
</html>
