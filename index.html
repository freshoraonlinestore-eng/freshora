<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Freshora Store</title>

<link rel="stylesheet"
      href="style.css">

</head>

<body>

<!-- =========================
     HEADER
========================= -->
<header class="header">

  <!-- SECRET ADMIN ACCESS -->
  <div class="logo"
       ondblclick="window.location='login.html'">

    Freshora

  </div>

  <!-- SEARCH -->
  <input
    id="searchInput"
    placeholder="Search products..."
  >

  <!-- ACTIONS -->
  <div class="header-actions">

    <!-- DARK MODE -->
    <button class="icon-btn"
            onclick="toggleDarkMode()">

      🌙

    </button>

    <!-- CART -->
    <button class="cart-btn"
            onclick="toggleCart()">

      🛒
      <span id="cartCount">
        0
      </span>

    </button>

  </div>

</header>

<!-- =========================
     CATEGORY FILTER
========================= -->
<div class="category-bar">

  <button class="cat-btn active">
    All
  </button>

  <button class="cat-btn">
    Grocery
  </button>

  <button class="cat-btn">
    Drinks
  </button>

  <button class="cat-btn">
    Snacks
  </button>

  <button class="cat-btn">
    Beauty
  </button>

</div>

<!-- =========================
     PRODUCTS
========================= -->
<div id="products">

  <!-- SKELETON -->
  <div class="skeleton"></div>
  <div class="skeleton"></div>
  <div class="skeleton"></div>
  <div class="skeleton"></div>

</div>

<!-- =========================
     FLOATING CART
========================= -->
<div class="floating-cart"
     onclick="toggleCart()">

  🛒

  <span id="floatingCartCount">
    0
  </span>

</div>

<!-- =========================
     CART DRAWER
========================= -->
<div id="cartDrawer"
     class="cart-drawer">

  <!-- CART HEADER -->
  <div class="cart-header">

    <h2>
      Your Cart
    </h2>

    <button onclick="toggleCart()">
      ✕
    </button>

  </div>

  <!-- ITEMS -->
  <div id="cartItems"></div>

  <!-- CHECKOUT -->
  <div class="sticky-checkout">

    <h3 id="cartTotal">
      Total: Rs 0
    </h3>

    <button
      onclick="checkout()"
      class="checkout-btn">

      Checkout

    </button>

    <button onclick="clearCart()">
      Clear Cart
    </button>

  </div>

</div>

<!-- =========================
     PRODUCT MODAL
========================= -->
<div id="productModal"
     class="modal">

  <div class="modal-content">

    <span class="close"
          onclick="closeModal()">

      &times;

    </span>

    <img id="modalImage">

    <div class="modal-details">

      <h2 id="modalName"></h2>

      <p id="modalPrice"></p>

      <div class="rating">
        ⭐⭐⭐⭐⭐
      </div>

      <div class="stock">
        In Stock
      </div>

      <button id="modalAddBtn">
        Add to Cart
      </button>

    </div>

  </div>

</div>

<!-- =========================
     MOBILE NAV
========================= -->
<div class="mobile-nav">

  <a href="#">
    🏠 Home
  </a>

  <a href="javascript:void(0)"
     onclick="toggleCart()">

    🛒 Cart

  </a>

</div>

<!-- =========================
     APP
========================= -->
<script type="module"
        src="app.js"></script>

</body>
</html>
