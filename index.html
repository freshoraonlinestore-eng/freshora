<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Freshora Store</title>

<link rel="stylesheet"
      href="style.css">

</head>

<body>

<!-- =========================
     HEADER
========================= -->
<header class="header">

  <!-- LOGO -->
  <div class="logo">
    Freshora
  </div>

  <!-- SEARCH -->
  <input
    id="searchInput"
    placeholder="Search products..."
  >

  <!-- HEADER ACTIONS -->
  <div class="header-actions">

    <!-- DARK MODE -->
    <button onclick="toggleDarkMode()">
      🌙
    </button>

    <!-- ADMIN -->
    <a href="login.html">
      Admin
    </a>

  </div>

</header>

<!-- =========================
     CATEGORY FILTER
========================= -->
<div class="category-bar">

  <button class="cat-btn active">
    All
  </button>

  <button class="cat-btn">
    Grocery
  </button>

  <button class="cat-btn">
    Drinks
  </button>

  <button class="cat-btn">
    Snacks
  </button>

  <button class="cat-btn">
    Beauty
  </button>

</div>

<!-- =========================
     PRODUCTS
========================= -->
<div id="products">

  <!-- SKELETON -->
  <div class="skeleton"></div>
  <div class="skeleton"></div>
  <div class="skeleton"></div>
  <div class="skeleton"></div>

</div>

<!-- =========================
     FLOATING CART
========================= -->
<div class="floating-cart"
     onclick="toggleCart()">

  🛒

  <span id="floatingCartCount">
    0
  </span>

</div>

<!-- =========================
     CART DRAWER
========================= -->
<div id="cartDrawer"
     class="cart-drawer">

  <!-- CART HEADER -->
  <div class="cart-header">

    <h2>
      Shopping Cart
    </h2>

    <button onclick="toggleCart()">
      ✕
    </button>

  </div>

  <!-- CART ITEMS -->
  <div id="cartItems"></div>

  <!-- CHECKOUT -->
  <div class="sticky-checkout">

    <div class="checkout-top">

      <span>
        Total
      </span>

      <h3 id="cartTotal">
        Rs 0
      </h3>

    </div>

    <button
      onclick="checkout()"
      class="checkout-btn">

      Proceed to Checkout

    </button>

    <button
      class="clear-btn"
      onclick="clearCart()">

      Clear Cart

    </button>

  </div>

</div>

<!-- =========================
     PRODUCT MODAL
========================= -->
<div id="productModal"
     class="modal">

  <div class="modal-content">

    <!-- CLOSE -->
    <span class="close"
          onclick="closeModal()">

      &times;

    </span>

    <!-- IMAGE -->
    <img id="modalImage">

    <!-- CONTENT -->
    <div class="modal-body">

      <!-- TITLE -->
      <h2 id="modalName"></h2>

      <!-- RATING -->
      <div class="rating">
        ⭐ 4.9 (120 Reviews)
      </div>

      <!-- PRICE -->
      <div class="price-box">

        <span id="modalPrice"></span>

        <span class="old-price">
          Rs 5990
        </span>

      </div>

      <!-- STOCK -->
      <div class="stock">
        ✔ In Stock
      </div>

      <!-- DESCRIPTION -->
      <p class="modal-desc">

        Premium quality Freshora product.
        Fast delivery available islandwide.

      </p>

      <!-- BUTTON -->
      <button id="modalAddBtn">
        Add to Cart
      </button>

    </div>

  </div>

</div>

<!-- =========================
     MOBILE NAV
========================= -->
<div class="mobile-nav">

  <a href="#">
    🏠
    <span>Home</span>
  </a>

  <a href="javascript:void(0)"
     onclick="toggleCart()">

    🛒
    <span>Cart</span>

  </a>

  <a href="login.html">

    ⚙
    <span>Admin</span>

  </a>

</div>

<!-- =========================
     APP JS
========================= -->
<script type="module"
        src="app.js"></script>

</body>
</html>
