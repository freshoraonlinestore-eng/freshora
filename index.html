<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Freshora Store</title>

<link rel="stylesheet"
      href="style.css">

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet">

</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header class="header">

  <div class="logo"
       ondblclick="window.location='login.html'">

    Freshora

  </div>

  <div class="header-search">

    <input id="searchInput"
           type="text"
           placeholder="Search products...">

  </div>

</header>

<!-- =========================
     FILTER / CATEGORY
========================= -->

<section class="filter-section">

  <div class="filter-top">

    <h2>
      Browse Categories
    </h2>

  </div>

  <div class="category-grid">

    <button class="filter-card active"
            onclick="filterCategory('all')">

      All Products

    </button>

    <button class="filter-card"
            onclick="filterCategory('Grocery')">

      Grocery

    </button>

    <button class="filter-card"
            onclick="filterCategory('Drinks')">

      Drinks

    </button>

    <button class="filter-card"
            onclick="filterCategory('Snacks')">

      Snacks

    </button>

    <button class="filter-card"
            onclick="filterCategory('Beauty')">

      Beauty

    </button>

  </div>

</section>

<!-- =========================
     PRODUCTS
========================= -->

<main id="products"></main>

<!-- =========================
     FLOATING CART
========================= -->

<div class="floating-cart"
     onclick="toggleCart()">

  <span id="floatingCartCount">
    0
  </span>

</div>

<!-- =========================
     CART DRAWER
========================= -->

<div id="cartDrawer"
     class="cart-drawer">

  <div class="cart-header">

    <div>

      <h2>
        Shopping Cart
      </h2>

      <p>
        Your selected products
      </p>

    </div>

    <button onclick="toggleCart()">

      ✕

    </button>

  </div>

  <div id="cartItems"></div>

  <div class="sticky-checkout">

    <div class="checkout-total-box">

      <span>Total</span>

      <h3 id="cartTotal">
        Rs 0
      </h3>

    </div>

    <button class="checkout-btn"
            onclick="checkout()">

      Checkout via WhatsApp

    </button>

    <button class="clear-cart-btn"
            onclick="clearCart()">

      Clear Cart

    </button>

  </div>

</div>

<!-- =========================
     PRODUCT MODAL
========================= -->

<div id="productModal"
     class="modal">

  <div class="modal-content">

    <span class="close"
          onclick="closeModal()">

      ×

    </span>

    <img id="modalImage">

    <div class="modal-details">

      <div class="modal-top">

        <h2 id="modalName"></h2>

        <!-- PRODUCT RATING -->
        <div class="product-rating">

          <span>★★★★★</span>

          <small>
            4.9 Rating
          </small>

        </div>

      </div>

      <p id="modalPrice"></p>

      <button id="modalAddBtn">

        Add to Cart

      </button>

    </div>

  </div>

</div>

<!-- =========================
     SOCIAL MEDIA
========================= -->

<footer class="footer">

  <h3>
    Follow Freshora
  </h3>

  <div class="social-links">

    <a href="#">
      Facebook
    </a>

    <a href="#">
      Instagram
    </a>

    <a href="#">
      TikTok
    </a>

    <a href="#">
      WhatsApp
    </a>

  </div>

  <p class="footer-copy">

    © 2026 Freshora Store

  </p>

</footer>

<!-- =========================
     OVERLAY
========================= -->

<div class="overlay"
     onclick="toggleCart()">

</div>

<!-- =========================
     SCRIPT
========================= -->

<script type="module"
        src="app.js"></script>

</body>
</html>
