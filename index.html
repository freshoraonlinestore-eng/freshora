<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <title>Freshora Online Store</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css?v=1.0" />

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

</head>

<body>

<!-- ================= HEADER ================= -->
<header class="header">
    <div class="logo">
        <h1>Freshora</h1>
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search products...">
        <i class="fa fa-search"></i>
    </div>

    <div class="header-icons">
        <button id="wishlistBtn">
            <i class="fa fa-heart"></i>
            <span id="wishlistCount">0</span>
        </button>

        <button id="cartBtn">
            <i class="fa fa-shopping-cart"></i>
            <span id="cartCount">0</span>
        </button>
    </div>
</header>

<!-- ================= CATEGORY FILTER ================= -->
<section class="categories">
    <button class="cat-btn active" data-category="all">All</button>
    <button class="cat-btn" data-category="vegetables">Vegetables</button>
    <button class="cat-btn" data-category="fruits">Fruits</button>
    <button class="cat-btn" data-category="dairy">Dairy</button>
    <button class="cat-btn" data-category="meat">Meat</button>
</section>

<!-- ================= MAIN PRODUCT SECTION ================= -->
<main>

    <section id="productContainer" class="product-grid">
        <!-- JS will load products here -->
    </section>

</main>

<!-- ================= PRODUCT MODAL ================= -->
<div id="productModal" class="modal hidden">
    <div class="modal-content">

        <span class="closeBtn" id="closeModal">&times;</span>

        <div id="modalBody">
            <!-- JS inject product details -->
        </div>

    </div>
</div>

<!-- ================= CART SIDEBAR ================= -->
<aside id="cartSidebar" class="sidebar hidden">
    <h2>Your Cart</h2>
    <div id="cartItems"></div>

    <div class="cart-footer">
        <p>Total: <span id="cartTotal">LKR 0.00</span></p>
        <button id="checkoutBtn">Checkout via WhatsApp</button>
    </div>
</aside>

<!-- ================= WISHLIST SIDEBAR ================= -->
<aside id="wishlistSidebar" class="sidebar hidden">
    <h2>Wishlist</h2>
    <div id="wishlistItems"></div>
</aside>

<!-- ================= DELIVERY INFO ================= -->
<section class="delivery-info">
    <h3>Delivery Information</h3>
    <p>🚚 Fast delivery within Sri Lanka</p>
    <p>💰 Cash on Delivery Available</p>
</section>

<!-- ================= FOOTER ================= -->
<footer>
    <p>© 2026 Freshora Online Store. All Rights Reserved.</p>

    <div class="social">
        <a href="#"><i class="fab fa-facebook"></i></a>
        <a href="#"><i class="fab fa-instagram"></i></a>
        <a href="#"><i class="fab fa-whatsapp"></i></a>
    </div>
</footer>

<!-- ================= SCRIPTS ================= -->
<script type="module" src="app.js"></script>

</body>
</html>
