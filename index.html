<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Freshora Online Store</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<!-- TOP BANNER -->
<div class="top-banner">
  <p>Free Delivery Above Rs 5000 • Cash On Delivery • Fresh Daily Products</p>
</div>

<!-- LOADING -->
<div id="loadingScreen" class="loading-screen">
  <div class="loader"></div>
</div>

<!-- OVERLAY -->
<div id="overlay" class="overlay" onclick="toggleCart()"></div>

<!-- HEADER -->
<header class="header">

  <div class="logo-area" ondblclick="window.location='login.html'">
    <img src="logo.png" class="logo-img" />
    <div class="logo-text">Freshora</div>
  </div>

  <div class="search-box">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input id="searchInput" placeholder="Search products..." />
  </div>

  <button id="darkModeBtn" class="icon-btn" onclick="toggleDarkMode()">
    <i class="fa-solid fa-moon"></i>
  </button>

</header>

<!-- HERO -->
<section class="hero">
  <div class="hero-content">
    <span class="hero-badge">Fresh Daily Products</span>

    <h1>Premium Grocery & Lifestyle Store</h1>

    <p>Freshora delivers groceries, drinks, snacks & beauty products.</p>

    <div class="hero-buttons">
      <button class="hero-btn">Shop Now</button>
      <button class="hero-outline-btn">Explore</button>
    </div>
  </div>
</section>

<!-- CATEGORY -->
<section class="category-slider">
  <button class="category-chip active">All</button>
  <button class="category-chip">Grocery</button>
  <button class="category-chip">Drinks</button>
  <button class="category-chip">Snacks</button>
  <button class="category-chip">Beauty</button>
</section>

<!-- FILTERS -->
<section class="advanced-search">
  <div class="filter-grid">

    <select id="categoryFilter">
      <option value="all">All Categories</option>
      <option value="Grocery">Grocery</option>
      <option value="Drinks">Drinks</option>
      <option value="Snacks">Snacks</option>
      <option value="Beauty">Beauty</option>
    </select>

    <select id="priceFilter">
      <option value="all">All Prices</option>
      <option value="500">Under Rs 500</option>
      <option value="1000">Under Rs 1000</option>
      <option value="2000">Under Rs 2000</option>
    </select>

    <select id="discountFilter">
      <option value="all">All Discounts</option>
      <option value="10">10%+</option>
      <option value="20">20%+</option>
      <option value="30">30%+</option>
    </select>

  </div>
</section>

<!-- PRODUCTS -->
<section id="products" class="products-grid"></section>

<!-- FLOATING CART -->
<button class="floating-cart" onclick="toggleCart()">
  <i class="fa-solid fa-cart-shopping"></i>
  <span id="floatingCartCount">0</span>
</button>

<!-- ================= CART DRAWER (FIXED) ================= -->
<div id="cartDrawer" class="cart-drawer">

  <div class="cart-header">
    <h3>Your Cart</h3>
    <button class="close-cart" onclick="toggleCart()">✕</button>
  </div>

  <div id="cartItems"></div>

  <div class="sticky-checkout">

    <div id="cartTotal">Total: Rs 0</div>

    <div class="checkout-form">
      <input id="cusName" placeholder="Your Name">
      <input id="cusPhone" placeholder="Phone">
      <textarea id="cusAddress" placeholder="Address"></textarea>
    </div>

    <div class="checkout-actions">
      <button class="checkout-btn" onclick="checkout()">
        Checkout WhatsApp
      </button>

      <button class="clear-btn" onclick="clearCart()">
        Clear Cart
      </button>
    </div>

  </div>

</div>

<!-- ================= PRODUCT MODAL (FIXED) ================= -->
<div id="productModal" class="modal" onclick="closeModal()">

  <div class="modal-content" onclick="event.stopPropagation()">

    <button class="close" onclick="closeModal()">✕</button>

    <div class="main-image-wrapper">
      <img id="modalImage" />
    </div>

    <div id="imageGallery" class="image-gallery"></div>

    <div class="modal-details">

      <h2 id="modalName"></h2>
      <p id="modalPrice"></p>

      <div class="rating-box">
        ⭐ <span id="modalRatingText"></span>
      </div>

      <button id="modalAddBtn">Add to Cart</button>

      <div class="review-form">
        <select id="reviewRating">
          <option value="5">5 ⭐</option>
          <option value="4">4 ⭐</option>
          <option value="3">3 ⭐</option>
          <option value="2">2 ⭐</option>
          <option value="1">1 ⭐</option>
        </select>

        <textarea id="reviewText" placeholder="Write review..."></textarea>

        <button id="reviewSubmitBtn">Submit Review</button>
      </div>

      <div id="reviewList"></div>

    </div>

  </div>

</div>

<!-- ================= BOTTOM NAV ================= -->
<nav class="bottom-nav">

  <button class="bottom-nav-item active">
    <i class="fa-solid fa-house"></i>
    <span>Home</span>
  </button>

  <button class="bottom-nav-item">
    <i class="fa-solid fa-layer-group"></i>
    <span>Categories</span>
  </button>

  <button class="bottom-nav-item" onclick="toggleCart()">
    <i class="fa-solid fa-cart-shopping"></i>
    <span>Cart</span>
  </button>

  <button class="bottom-nav-item">
    <i class="fa-solid fa-heart"></i>
    <span>Wishlist</span>
  </button>

</nav>

<script type="module" src="app.js?v=6"></script>

</body>
</html>
