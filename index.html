<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Freshora Store Pro</title>

<link rel="stylesheet" href="style.css?v=30">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<!-- TOP BAR -->
<div class="top-bar">
  🛍️ Fresh Products | 🚚 Island Wide Delivery | 💰 LKR Pricing
</div>

<!-- HEADER -->
<header class="header">

<div class="logo">Freshora</div>

<input type="text" id="searchInput" placeholder="Search products...">

<div class="header-icons">

<button id="wishlistBtn">❤️</button>
<button id="cartBtn">🛒<span id="cartCount">0</span></button>

</div>

</header>

<!-- CATEGORY -->
<div class="categories" id="categoryBar"></div>

<!-- PRODUCT GRID -->
<div class="product-grid" id="productGrid"></div>

<!-- DELIVERY INFO -->
<section class="delivery-info">
<h3>🚚 Delivery Information</h3>
<p>Fast delivery within 24-48 hours across Sri Lanka</p>
</section>

<!-- SOCIAL -->
<div class="social">
<a href="#">Facebook</a>
<a href="#">Instagram</a>
<a href="#">WhatsApp</a>
</div>

<!-- CART PANEL -->
<div class="cart-panel" id="cartPanel"></div>

<!-- PRODUCT MODAL -->
<div class="modal" id="productModal">

<div class="modal-content">

<span id="closeModal">✖</span>

<img id="modalImg">

<h2 id="modalTitle"></h2>

<p id="modalPrice"></p>

<p id="modalDesc"></p>

<div class="rating">
⭐ ⭐ ⭐ ⭐ ⭐
</div>

<textarea id="reviewBox" placeholder="Write review..."></textarea>

<button id="submitReview">Submit Review</button>

<button id="whatsappOrder">Order via WhatsApp</button>

</div>

</div>

<script type="module" src="app.js"></script>

</body>
</html>
