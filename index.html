<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Freshora Store</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<div class="top-banner">
  <p>Free Delivery Above Rs 5000 • Cash On Delivery • Fresh Daily Products</p>
</div>

<div id="loadingScreen" class="loading-screen">
  <div class="loader"></div>
</div>

<div id="overlay" class="overlay" onclick="toggleCart()"></div>

<header class="header">

  <div class="logo-area">
    <img src="logo.png" class="logo-img">
    <div class="logo-text">Freshora</div>
  </div>

  <div class="search-box">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input id="searchInput" placeholder="Search products...">
  </div>

  <button id="darkModeBtn" class="icon-btn" onclick="toggleDarkMode()">
    <i class="fa-solid fa-moon"></i>
  </button>

</header>

<section class="hero">
  <div class="hero-content">
    <span class="hero-badge">Fresh Daily Products</span>
    <h1>Premium Grocery Store</h1>
    <p>Fresh products delivered to your home</p>
  </div>
</section>

<section class="category-slider">
  <button class="category-chip active">All</button>
  <button class="category-chip">Grocery</button>
  <button class="category-chip">Drinks</button>
  <button class="category-chip">Snacks</button>
  <button class="category-chip">Beauty</button>
</section>

<section class="advanced-search">
  <div class="filter-grid">

    <select id="categoryFilter">
      <option value="all">All Categories</option>
      <option value="Grocery">Grocery</option>
      <option value="Drinks">Drinks</option>
      <option value="Snacks">Snacks</option>
      <option value="Beauty">Beauty</option>
    </select>

    <select id="priceFilter">
      <option value="all">All Prices</option>
      <option value="500">Under 500</option>
      <option value="1000">Under 1000</option>
    </select>

    <select id="discountFilter">
      <option value="all">All Discounts</option>
      <option value="10">10%</option>
      <option value="20">20%</option>
    </select>

  </div>
</section>

<section id="products" class="products-grid"></section>

<button class="floating-cart" onclick="toggleCart()">
  <i class="fa-solid fa-cart-shopping"></i>
  <span id="floatingCartCount">0</span>
</button>

<!-- CART -->
<div id="cartDrawer" class="cart-drawer">

  <div class="cart-header">
    <h3>Cart</h3>
    <button onclick="toggleCart()">✕</button>
  </div>

  <div id="cartItems"></div>

  <div class="sticky-checkout">

    <div id="cartTotal">Total: Rs 0</div>

    <input id="cusName" placeholder="Name">
    <input id="cusPhone" placeholder="Phone">
    <textarea id="cusAddress" placeholder="Address"></textarea>

    <button onclick="checkout()" class="checkout-btn">
      Checkout
    </button>

    <button onclick="clearCart()" class="clear-btn">
      Clear
    </button>

  </div>

</div>

<!-- MODAL -->
<div id="productModal" class="modal" onclick="closeModal()">

  <div class="modal-content" onclick="event.stopPropagation()">

    <button class="close" onclick="closeModal()">✕</button>

    <img id="modalImage" />

    <div id="imageGallery" class="image-gallery"></div>

    <h2 id="modalName"></h2>
    <p id="modalPrice"></p>

    <button id="modalAddBtn">Add to Cart</button>

    <div class="review-form">
      <select id="reviewRating">
        <option value="5">5</option>
        <option value="4">4</option>
        <option value="3">3</option>
      </select>

      <textarea id="reviewText"></textarea>

      <button id="reviewSubmitBtn">Submit</button>
    </div>

    <div id="reviewList"></div>

  </div>

</div>

<script type="module" src="app.js"></script>

</body>
</html>
