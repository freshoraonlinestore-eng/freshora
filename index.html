<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Freshora Store</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- HEADER -->
<header>

  <h1>Freshora Online Store</h1>

  <input id="searchInput" placeholder="Search products..." />

  <div class="header-actions">

    <a href="javascript:void(0)" onclick="toggleCart()">
      🛒 Cart (<span id="cartCount">0</span>)
    </a>

    <a href="login.html">Admin</a>

  </div>

</header>

<!-- PRODUCTS -->
<div id="products"></div>

<!-- FLOATING MOBILE CART -->
<div class="floating-cart" onclick="toggleCart()">
  🛒 <span id="floatingCartCount">0</span>
</div>

<!-- CART DRAWER -->
<div id="cartDrawer" class="cart-drawer">

  <h2>🛒 Your Cart</h2>

  <div id="cartItems"></div>

  <div class="sticky-checkout">

    <h3 id="cartTotal">Total: Rs 0</h3>

    <button onclick="checkout()" class="checkout-btn">
      Checkout WhatsApp
    </button>

    <button onclick="clearCart()">
      Clear Cart
    </button>

  </div>

</div>

<!-- PRODUCT POPUP -->
<div id="productModal" class="modal">

  <div class="modal-content">

    <span class="close" onclick="closeModal()">&times;</span>

    <img id="modalImage">

    <h2 id="modalName"></h2>

    <p id="modalPrice"></p>

    <button id="modalAddBtn">
      Add to Cart
    </button>

  </div>

</div>

<script type="module" src="app.js"></script>

</body>
</html>
