<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Freshora Store</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- HEADER -->
<header class="header">

  <div class="logo">
    Freshora
  </div>

  <input
    id="searchInput"
    placeholder="Search products..."
  >

  <div class="header-actions">

    <button onclick="toggleDarkMode()">
      🌙
    </button>

    <a href="javascript:void(0)"
       onclick="toggleCart()">

      🛒 <span id="cartCount">0</span>

    </a>

    <a href="login.html">
      Admin
    </a>

  </div>

</header>

<!-- PRODUCTS -->
<div id="products"></div>

<!-- FLOATING CART -->
<div class="floating-cart"
     onclick="toggleCart()">

  🛒 <span id="floatingCartCount">0</span>

</div>

<!-- CART DRAWER -->
<div id="cartDrawer"
     class="cart-drawer">

  <div class="cart-header">

    <h2>Your Cart</h2>

    <button onclick="toggleCart()">
      ✕
    </button>

  </div>

  <div id="cartItems"></div>

  <div class="sticky-checkout">

    <h3 id="cartTotal">
      Total: Rs 0
    </h3>

    <button
      onclick="checkout()"
      class="checkout-btn">

      Checkout

    </button>

    <button onclick="clearCart()">
      Clear Cart
    </button>

  </div>

</div>

<!-- PRODUCT MODAL -->
<div id="productModal"
     class="modal">

  <div class="modal-content">

    <span class="close"
          onclick="closeModal()">

      &times;

    </span>

    <img id="modalImage">

    <h2 id="modalName"></h2>

    <p id="modalPrice"></p>

    <button id="modalAddBtn">
      Add to Cart
    </button>

  </div>

</div>

<script type="module"
        src="app.js"></script>

</body>
</html>
