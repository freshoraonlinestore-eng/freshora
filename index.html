<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Freshora Online Store</title>

  <link rel="stylesheet" href="style.css" />

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  />

</head>

<body>

<!-- LOADING SCREEN -->

<div id="loadingScreen" class="loading-screen">
  <div class="loader"></div>
</div>

<!-- OVERLAY -->

<div
  id="overlay"
  class="overlay"
  onclick="toggleCart()"
></div>

<!-- TOP SOCIAL BAR -->

<div class="top-social-bar">

  <div class="social-links">

    <a
      href="https://facebook.com"
      target="_blank"
    >
      <i class="fab fa-facebook-f"></i>
    </a>

    <a
      href="https://instagram.com"
      target="_blank"
    >
      <i class="fab fa-instagram"></i>
    </a>

    <a
      href="https://tiktok.com"
      target="_blank"
    >
      <i class="fab fa-tiktok"></i>
    </a>

    <a
      href="https://wa.me/94752425790"
      target="_blank"
    >
      <i class="fab fa-whatsapp"></i>
    </a>

  </div>

</div>

<!-- HEADER -->

<header class="header">

  <!-- LOGO -->

  <div
    class="logo"
    ondblclick="window.location='login.html'"
  >
    Freshora
  </div>

  <!-- SEARCH -->

  <div class="header-center">

    <div class="search-box">

      <i class="fa-solid fa-magnifying-glass"></i>

      <input
        type="text"
        id="searchInput"
        placeholder="Search products..."
        autocomplete="off"
      />

    </div>

  </div>

  <!-- RIGHT -->

  <div class="header-right">

    <button
      type="button"
      id="darkModeBtn"
      class="icon-btn"
      onclick="toggleDarkMode()"
      aria-label="Toggle Dark Mode"
    >
      🌙
    </button>

  </div>

</header>

<!-- HERO SECTION -->

<section class="hero-section">

  <div class="hero-content">

    <span class="hero-badge">
      Freshora Premium Store
    </span>

    <h1>
      Fresh Products <br>
      Delivered Fast
    </h1>

    <p>
      Grocery, Drinks, Snacks &
      Beauty products at the best prices.
    </p>

    <button
      onclick="window.scrollTo({
        top:700,
        behavior:'smooth'
      })"
    >
      Shop Now
    </button>

  </div>

</section>

<!-- CATEGORY CHIPS -->

<section class="category-chips">

  <button onclick="setCategory('all')">
    All
  </button>

  <button onclick="setCategory('Grocery')">
    Grocery
  </button>

  <button onclick="setCategory('Drinks')">
    Drinks
  </button>

  <button onclick="setCategory('Snacks')">
    Snacks
  </button>

  <button onclick="setCategory('Beauty')">
    Beauty
  </button>

</section>

<!-- FILTERS -->

<section class="advanced-search">

  <div class="filter-grid">

    <select id="categoryFilter">

      <option value="all">
        All Categories
      </option>

      <option value="Grocery">
        Grocery
      </option>

      <option value="Drinks">
        Drinks
      </option>

      <option value="Snacks">
        Snacks
      </option>

      <option value="Beauty">
        Beauty
      </option>

    </select>

    <select id="priceFilter">

      <option value="all">
        All Prices
      </option>

      <option value="500">
        Under Rs 500
      </option>

      <option value="1000">
        Under Rs 1000
      </option>

      <option value="2000">
        Under Rs 2000
      </option>

    </select>

    <select id="discountFilter">

      <option value="all">
        All Discounts
      </option>

      <option value="10">
        10%+ Discount
      </option>

      <option value="20">
        20%+ Discount
      </option>

      <option value="30">
        30%+ Discount
      </option>

    </select>

  </div>

</section>

<!-- PRODUCTS -->

<section
  id="products"
  class="products-grid"
></section>

<!-- FLOATING CART -->

<div
  class="floating-cart"
  onclick="toggleCart()"
>

  <i class="fa-solid fa-cart-shopping"></i>

  <span id="floatingCartCount">
    0
  </span>

</div>

<!-- CART DRAWER -->

<div
  id="cartDrawer"
  class="cart-drawer"
>

  <!-- CART HEADER -->

  <div class="cart-header">

    <h2>Your Cart</h2>

    <button
      class="close-cart"
      onclick="toggleCart()"
    >
      ✕
    </button>

  </div>

  <!-- CART ITEMS -->

  <div id="cartItems"></div>

  <!-- CHECKOUT FORM -->

  <div class="checkout-form">

    <input
      type="text"
      id="cusName"
      placeholder="Your Name"
    />

    <input
      type="tel"
      id="cusPhone"
      placeholder="Phone Number"
    />

    <textarea
      id="cusAddress"
      placeholder="Delivery Address"
      rows="3"
    ></textarea>

  </div>

  <!-- STICKY FOOTER -->

  <div class="sticky-checkout">

    <h3 id="cartTotal">
      Total: Rs 0
    </h3>

    <div class="checkout-actions">

      <button
        class="checkout-btn"
        onclick="checkout()"
      >

        <i class="fab fa-whatsapp"></i>

        Order via WhatsApp

      </button>

      <button
        class="clear-btn"
        onclick="clearCart()"
      >
        Clear Cart
      </button>

    </div>

  </div>

</div>

<!-- PRODUCT MODAL -->

<div
  id="productModal"
  class="modal"
>

  <div class="modal-content">

    <span
      class="close"
      onclick="closeModal()"
    >
      &times;
    </span>

    <img
      id="modalImage"
      src="placeholder.png"
      alt="Product"
      onerror="this.src='placeholder.png'"
    />

    <div class="modal-details">

      <h2 id="modalName"></h2>

      <p id="modalPrice"></p>

      <div class="rating-box">
        ⭐⭐⭐⭐⭐
      </div>

      <button id="modalAddBtn">
        Add to Cart
      </button>

    </div>

  </div>

</div>

<!-- TOAST -->

<div id="toast" class="toast">
  Added To Cart
</div>

<!-- APP -->

<script
  type="module"
  src="app.js"
></script>

</body>
</html>
