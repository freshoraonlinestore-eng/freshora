<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Freshora Store</title>

  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>

<body>

<!-- LOADING -->
<div id="loadingScreen" class="loading-screen">
  <div class="loader"></div>
</div>

<!-- OVERLAY -->
<div id="overlay" class="overlay" onclick="toggleCart()"></div>

<!-- TOP BAR -->
<div class="top-social-bar">
  <div class="social-links">
    <a href="#"><i class="fab fa-facebook"></i></a>
    <a href="#"><i class="fab fa-instagram"></i></a>
    <a href="#"><i class="fab fa-tiktok"></i></a>
    <a href="https://wa.me/94752425790"><i class="fab fa-whatsapp"></i></a>
  </div>
</div>

<!-- HEADER -->
<header class="header">
  <div class="logo">Freshora</div>

  <div class="header-center">
    <input type="text" id="searchInput" placeholder="Search products..."/>
  </div>

  <div class="header-right">
    <button id="darkModeBtn" class="icon-btn" onclick="toggleDarkMode()">
      <i class="fa-solid fa-moon"></i>
    </button>
  </div>
</header>

<!-- FILTERS -->
<section class="filters">
  <select id="categoryFilter">
    <option value="all">All</option>
    <option value="Grocery">Grocery</option>
    <option value="Drinks">Drinks</option>
    <option value="Snacks">Snacks</option>
    <option value="Beauty">Beauty</option>
  </select>

  <select id="priceFilter">
    <option value="all">Price</option>
    <option value="500">Under 500</option>
    <option value="1000">Under 1000</option>
    <option value="2000">Under 2000</option>
  </select>
</section>

<!-- PRODUCTS -->
<section id="products" class="products-grid"></section>

<!-- CART FLOAT -->
<div class="floating-cart" onclick="toggleCart()">
  <i class="fa-solid fa-cart-shopping"></i>
  <span id="floatingCartCount">0</span>
</div>

<!-- CART DRAWER -->
<div id="cartDrawer" class="cart-drawer">

  <div class="cart-header">
    <h2>Your Cart</h2>
    <button onclick="toggleCart()">✕</button>
  </div>

  <div id="cartItems"></div>

  <div class="checkout-form">
    <input id="cusName" placeholder="Name"/>
    <input id="cusPhone" placeholder="Phone"/>
    <textarea id="cusAddress" placeholder="Address"></textarea>
  </div>

  <div class="cart-actions">
    <button class="clear-btn" onclick="clearCart()">Clear Cart</button>
    <button class="checkout-btn" onclick="checkout()">Order via WhatsApp</button>
  </div>

  <h3 id="cartTotal">Total: Rs 0</h3>
</div>

<script type="module" src="app.js"></script>

</body>
</html>
