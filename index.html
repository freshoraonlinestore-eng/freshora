<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Freshora Online Store</title>

  <link rel="stylesheet" href="style.css?v=5" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body>

<!-- TOP BANNER -->
<div class="top-banner">
  <p>Free Delivery Above Rs 5000 • Cash On Delivery • Fresh Daily Products</p>
</div>

<!-- LOADING -->
<div id="loadingScreen" class="loading-screen">
  <div class="loader"></div>
</div>

<!-- HEADER -->
<header class="header">

  <div class="logo-area" ondblclick="window.location='login.html'">
    <img src="logo.png" class="logo-img" alt="logo" />
    <div class="logo-text">Freshora</div>
  </div>

  <div class="search-box">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input type="text" id="searchInput" placeholder="Search products..." />
  </div>

  <button id="darkModeBtn" class="icon-btn" onclick="toggleDarkMode()">
    <i class="fa-solid fa-moon"></i>
  </button>

</header>

<!-- FILTERS -->
<section class="advanced-search">
  <div class="filter-grid">

    <select id="categoryFilter">
      <option value="all">All Categories</option>
      <option value="Grocery">Grocery</option>
      <option value="Drinks">Drinks</option>
      <option value="Snacks">Snacks</option>
      <option value="Beauty">Beauty</option>
    </select>

    <select id="priceFilter">
      <option value="all">All Prices</option>
      <option value="500">Under Rs 500</option>
      <option value="1000">Under Rs 1000</option>
      <option value="2000">Under Rs 2000</option>
    </select>

    <select id="discountFilter">
      <option value="all">All Discounts</option>
      <option value="10">10%+</option>
      <option value="20">20%+</option>
      <option value="30">30%+</option>
    </select>

  </div>
</section>

<!-- PRODUCTS -->
<section id="products" class="products-grid"></section>

<!-- FLOAT CART -->
<button class="floating-cart" onclick="toggleCart()">
  <i class="fa-solid fa-cart-shopping"></i>
  <span id="floatingCartCount">0</span>
</button>

<!-- CART DRAWER -->
<div id="cartDrawer" class="cart-drawer">

  <div class="cart-header">
    <h2>Your Cart</h2>
    <button onclick="toggleCart()">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>

  <div id="cartItems"></div>

  <div class="checkout-form">
    <input type="text" id="cusName" placeholder="Your Name" />
    <input type="tel" id="cusPhone" placeholder="Phone Number" />
    <textarea id="cusAddress" placeholder="Delivery Address"></textarea>
  </div>

  <div class="sticky-checkout">
    <h3 id="cartTotal">Total: Rs 0</h3>

    <div class="checkout-actions">
      <button class="checkout-btn" onclick="checkout()">
        Order Now
      </button>

      <button class="clear-btn" onclick="clearCart()">
        Clear Cart
      </button>
    </div>
  </div>

</div>

<!-- PRODUCT MODAL -->
<div id="productModal" class="modal">

  <div class="modal-content">

    <button class="close" onclick="closeModal()">
      <i class="fa-solid fa-xmark"></i>
    </button>

    <img id="modalImage" src="" />

    <h2 id="modalName"></h2>
    <p id="modalPrice"></p>

    <!-- STAR RATING INPUT -->
    <div class="star-rating" id="starRating">
      <i class="fa-regular fa-star" data-value="1"></i>
      <i class="fa-regular fa-star" data-value="2"></i>
      <i class="fa-regular fa-star" data-value="3"></i>
      <i class="fa-regular fa-star" data-value="4"></i>
      <i class="fa-regular fa-star" data-value="5"></i>
    </div>

    <input type="hidden" id="reviewRating" value="5" />

    <textarea id="reviewText" placeholder="Write your review..."></textarea>

    <button id="reviewSubmitBtn">Submit Review</button>

    <div id="reviewList"></div>

    <button id="modalAddBtn">Add to Cart</button>

  </div>

</div>

<!-- FIREBASE APP -->
<script type="module" src="app.js?v=5"></script>

</body>
</html>
