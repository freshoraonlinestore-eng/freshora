<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Freshora Online Store</title>

  <!-- CACHE PREVENT HEADERS -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <link rel="stylesheet" href="style.css?v=auto" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body>

<div class="top-banner">
  <p>Free Delivery Above Rs 5000 • Cash On Delivery • Fresh Daily Products</p>
</div>

<div id="loadingScreen" class="loading-screen">
  <div class="loader"></div>
</div>

<div id="overlay" onclick="toggleCart()"></div>

<header class="header">

  <div class="logo-area" ondblclick="window.location='login.html'">
    <img src="logo.png" class="logo-img" />
    <div class="logo-text">Freshora</div>
  </div>

  <div class="search-box">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input type="text" id="searchInput" placeholder="Search products..." />
  </div>

  <button class="icon-btn" id="darkModeBtn" onclick="toggleDarkMode()">
    <i class="fa-solid fa-moon"></i>
  </button>

</header>

<section class="advanced-search">
  <div class="filter-grid">

    <select id="categoryFilter">
      <option value="all">All Categories</option>
      <option value="Grocery">Grocery</option>
      <option value="Drinks">Drinks</option>
      <option value="Snacks">Snacks</option>
      <option value="Beauty">Beauty</option>
    </select>

    <select id="priceFilter">
      <option value="all">All Prices</option>
      <option value="500">Under Rs 500</option>
      <option value="1000">Under Rs 1000</option>
      <option value="2000">Under Rs 2000</option>
    </select>

    <select id="discountFilter">
      <option value="all">All Discounts</option>
      <option value="10">10%+</option>
      <option value="20">20%+</option>
      <option value="30">30%+</option>
    </select>

  </div>
</section>

<section id="products" class="products-grid"></section>

<button class="floating-cart" onclick="toggleCart()">
  <i class="fa-solid fa-cart-shopping"></i>
  <span id="floatingCartCount">0</span>
</button>

<div id="cartDrawer" class="cart-drawer">
  <div class="cart-header">
    <h2>Your Cart</h2>
    <button class="close" onclick="toggleCart()">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>

  <div id="cartItems" class="cart-items"></div>

  <div class="checkout-form">
    <input type="text" id="cusName" placeholder="Your Name" />
    <input type="tel" id="cusPhone" placeholder="Phone Number" />
    <textarea id="cusAddress" placeholder="Delivery Address"></textarea>
  </div>

  <div class="sticky-checkout">
    <h3 id="cartTotal">Total: Rs 0</h3>

    <div class="checkout-actions">
      <button class="checkout-btn" onclick="checkout()">Order</button>
      <button class="clear-btn" onclick="clearCart()">Clear</button>
    </div>
  </div>
</div>

<div id="productModal" class="modal">
  <div class="modal-content">
    <button class="close" onclick="closeModal()">
      <i class="fa-solid fa-xmark"></i>
    </button>

    <img id="modalImage" />
    <h2 id="modalName"></h2>
    <p id="modalPrice"></p>

    <button id="modalAddBtn">Add to Cart</button>
  </div>
</div>

<!-- SW REGISTER -->
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js")
      .then(() => console.log("Service Worker Active"))
      .catch(err => console.log(err));
  }
</script>

<script type="module" src="app.js?v=auto"></script>

</body>
</html>
