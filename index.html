<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Freshora Online Store V2</title>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css?v=2">

  <!-- FONT AWESOME -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<!-- ================= HEADER ================= -->
<header class="header">
  <div class="logo">
    <i class="fa-solid fa-bag-shopping"></i> Freshora
  </div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search products...">
    <i class="fa fa-search"></i>
  </div>

  <div class="header-icons">
    <button id="wishlistBtn"><i class="fa fa-heart"></i><span id="wishCount">0</span></button>
    <button id="cartBtn"><i class="fa fa-cart-shopping"></i><span id="cartCount">0</span></button>
  </div>
</header>

<!-- ================= CATEGORY BAR ================= -->
<nav class="category-bar">
  <button onclick="filterCategory('all')">All</button>
  <button onclick="filterCategory('fruits')">Fruits</button>
  <button onclick="filterCategory('vegetables')">Vegetables</button>
  <button onclick="filterCategory('drinks')">Drinks</button>
  <button onclick="filterCategory('snacks')">Snacks</button>
</nav>

<!-- ================= HERO ================= -->
<section class="hero">
  <h1>Fresh Grocery Delivered</h1>
  <p>Best quality products at lowest price</p>
  <button onclick="scrollToProducts()">Shop Now</button>
</section>

<!-- ================= PRODUCTS ================= -->
<main>

  <section id="productsSection">
    <h2 class="section-title">Products</h2>
    <div id="productGrid" class="product-grid">
      <!-- JS Inject Products Here -->
    </div>
  </section>

</main>

<!-- ================= PRODUCT MODAL ================= -->
<div id="productModal" class="modal hidden">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>

    <img id="modalImg" src="">
    <h2 id="modalTitle"></h2>
    <p id="modalPrice"></p>
    <p id="modalDesc"></p>

    <button onclick="addToCartFromModal()">Add to Cart</button>
    <button onclick="buyNowWhatsApp()">Order via WhatsApp</button>
  </div>
</div>

<!-- ================= CART SIDEBAR ================= -->
<div id="cartSidebar" class="sidebar hidden">
  <h3>Cart</h3>
  <div id="cartItems"></div>
  <h4>Total: LKR <span id="cartTotal">0</span></h4>

  <button onclick="checkoutWhatsApp()">Checkout WhatsApp</button>
  <button onclick="closeCart()">Close</button>
</div>

<!-- ================= WISHLIST SIDEBAR ================= -->
<div id="wishSidebar" class="sidebar hidden">
  <h3>Wishlist</h3>
  <div id="wishItems"></div>
  <button onclick="closeWish()">Close</button>
</div>

<!-- ================= FOOTER ================= -->
<footer>
  <p>© 2026 Freshora Online Store</p>
  <div class="social">
    <i class="fab fa-facebook"></i>
    <i class="fab fa-instagram"></i>
    <i class="fab fa-whatsapp"></i>
  </div>
</footer>

<!-- ================= SCRIPT ================= -->
<script type="module" src="app.js?v=2"></script>

<script>
function scrollToProducts(){
  document.getElementById("productsSection").scrollIntoView({behavior:"smooth"});
}
</script>

</body>
</html>
