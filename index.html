<body>

<!-- TOP BANNER -->
<div class="top-banner">
  <p>Free Delivery Above Rs 5000 • Cash On Delivery • Fresh Daily Products</p>
</div>

<!-- LOADING -->
<div id="loadingScreen" class="loading-screen">
  <div class="loader"></div>
</div>

<!-- OVERLAY -->
<div id="overlay" class="overlay" onclick="toggleCart()"></div>

<!-- HEADER -->
<header class="header">

  <div class="logo-area" ondblclick="window.location='login.html'">
    <img src="logo.png" class="logo-img" alt="Freshora Logo" />
    <div class="logo-text">Freshora</div>
  </div>

  <div class="search-box">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input
      type="text"
      id="searchInput"
      placeholder="Search products..."
      autocomplete="off"
    />
  </div>

  <button id="darkModeBtn" class="icon-btn" onclick="toggleDarkMode()">
    <i class="fa-solid fa-moon"></i>
  </button>

</header>

<!-- HERO -->
<section class="hero">

  <div class="hero-content">

    <span class="hero-badge">
      Fresh Daily Products
    </span>

    <h1>
      Premium Grocery &
      Lifestyle Store
    </h1>

    <p>
      Freshora delivers fresh groceries,
      drinks, snacks & beauty products
      directly to your doorstep.
    </p>

    <div class="hero-buttons">
      <button class="hero-btn">
        Shop Now
      </button>

      <button class="hero-outline-btn">
        Explore
      </button>
    </div>

  </div>

</section>

<!-- CATEGORY SLIDER -->
<section class="category-slider">

  <button class="category-chip active">
    All
  </button>

  <button class="category-chip">
    Grocery
  </button>

  <button class="category-chip">
    Drinks
  </button>

  <button class="category-chip">
    Snacks
  </button>

  <button class="category-chip">
    Beauty
  </button>

</section>

<!-- FILTERS -->
<section class="advanced-search">

  <div class="filter-grid">

    <select id="categoryFilter">
      <option value="all">All Categories</option>
      <option value="Grocery">Grocery</option>
      <option value="Drinks">Drinks</option>
      <option value="Snacks">Snacks</option>
      <option value="Beauty">Beauty</option>
    </select>

    <select id="priceFilter">
      <option value="all">All Prices</option>
      <option value="500">Under Rs 500</option>
      <option value="1000">Under Rs 1000</option>
      <option value="2000">Under Rs 2000</option>
    </select>

    <select id="discountFilter">
      <option value="all">All Discounts</option>
      <option value="10">10%+ Discount</option>
      <option value="20">20%+ Discount</option>
      <option value="30">30%+ Discount</option>
    </select>

  </div>

</section>

<!-- SECTION TITLE -->
<div class="section-header">
  <h2>Popular Products</h2>
  <span>Fresh picks for you</span>
</div>

<!-- PRODUCTS -->
<section id="products" class="products-grid"></section>

<!-- FLOATING CART -->
<button class="floating-cart" onclick="toggleCart()">
  <i class="fa-solid fa-cart-shopping"></i>
  <span id="floatingCartCount">0</span>
</button>

<!-- MOBILE BOTTOM NAV -->
<nav class="bottom-nav">

  <button class="bottom-nav-item active">
    <i class="fa-solid fa-house"></i>
    <span>Home</span>
  </button>

  <button class="bottom-nav-item">
    <i class="fa-solid fa-layer-group"></i>
    <span>Categories</span>
  </button>

  <button class="bottom-nav-item" onclick="toggleCart()">
    <i class="fa-solid fa-cart-shopping"></i>
    <span>Cart</span>
  </button>

  <button class="bottom-nav-item">
    <i class="fa-solid fa-heart"></i>
    <span>Wishlist</span>
  </button>

</nav>

<script type="module" src="app.js?v=6"></script>

</body>
