<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Freshora Stylish Store</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<header class="header">
  <div class="logo-area">
    <img src="logo.png" class="logo-img" alt="logo">
    <div class="logo-text">Freshora</div>
  </div>
  <div class="search-box">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input id="searchInput" placeholder="Search products...">
  </div>
  <button id="cartBtn" class="floating-cart-icon"><i class="fa-solid fa-cart-shopping"></i></button>
</header>

<section id="products" class="products-grid"></section>

<div id="cartDrawer" class="cart-drawer">
  <div class="cart-header"><h3>Cart</h3><button id="closeCart">✕</button></div>
  <div id="cartItems"></div>
  <div class="sticky-checkout">
    <div id="cartTotal">Total: Rs 0</div>
    <button id="checkoutBtn" class="add-cart-btn">Checkout</button>
  </div>
</div>

<div id="productModal" class="modal">
  <div class="modal-content">
    <button id="closeModal" class="close">✕</button>
    <img id="modalImage" />
    <div id="imageGallery" class="image-gallery"></div>
    <h2 id="modalName"></h2>
    <p id="modalPrice"></p>
    <div class="ratings">⭐⭐⭐⭐⭐ (0 reviews)</div>
    <button id="modalAddBtn" class="add-cart-btn">Add to Cart</button>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
