<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Freshora Online Store</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css?v=21" />

    <!-- FONT AWESOME -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body>

    <!-- TOP BANNER -->
    <div class="top-banner">
        Free Delivery Above Rs 5000 • Cash On Delivery • Fresh Daily Products
    </div>

    <!-- HEADER -->
    <header class="header">

        <div class="logo-area" ondblclick="window.location='login.html'">
            <img src="logo.png" class="logo-img" alt="Freshora Logo" />
            <div class="logo-text">Freshora</div>
        </div>

        <!-- SEARCH -->
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input
                type="text"
                id="searchInput"
                placeholder="Search products..."
                autocomplete="off"
            />
        </div>

        <!-- DARK MODE -->
        <button
            id="darkModeBtn"
            class="icon-btn"
            type="button"
            onclick="toggleDarkMode()"
            aria-label="Toggle Dark Mode">
            <i class="fa-solid fa-moon"></i>
        </button>

    </header>

    <!-- =========================
         FEATURED SECTION (PHASE 1)
    ========================== -->
    <section id="featuredSection" style="padding:10px 16px;">
        <h3><i class="fa-solid fa-star"></i> Featured Products</h3>
        <div id="featuredGrid" class="products-grid"></div>
    </section>

    <!-- =========================
         TRENDING SECTION (PHASE 1)
    ========================== -->
    <section id="trendingSection" style="padding:10px 16px;">
        <h3><i class="fa-solid fa-fire"></i> Trending Now</h3>
        <div id="trendingGrid" class="products-grid"></div>
    </section>

    <!-- FILTERS -->
    <section class="advanced-search">

        <div class="filter-grid">

            <select id="categoryFilter">
                <option value="all">All Categories</option>
            </select>

            <select id="priceFilter">
                <option value="all">All Prices</option>
            </select>

            <select id="discountFilter">
                <option value="all">All Discounts</option>
            </select>

        </div>

    </section>

    <!-- PRODUCTS -->
    <main id="products" class="products-grid"></main>

    <!-- NO RESULTS UI (PHASE 1) -->
    <div id="noResults" style="display:none;text-align:center;padding:30px;color:var(--muted);">
        <i class="fa-solid fa-face-frown" style="font-size:30px;"></i>
        <p>No products found</p>
    </div>

    <!-- RECENTLY VIEWED (PHASE 1 PLACEHOLDER) -->
    <section id="recentlyViewedSection" style="padding:10px 16px;">
        <h3><i class="fa-solid fa-clock"></i> Recently Viewed</h3>
        <div id="recentlyViewedGrid" class="products-grid"></div>
    </section>

    <!-- FLOATING CART -->
    <button class="floating-cart" type="button" onclick="toggleCart()" aria-label="Open Cart">
        <i class="fa-solid fa-cart-shopping"></i>
        <span id="floatingCartCount">0</span>
    </button>

    <!-- CART DRAWER -->
    <div id="cartDrawer" class="cart-drawer">

        <div class="cart-header">
            <h2>Your Cart</h2>

            <button class="icon-btn" type="button" onclick="toggleCart()">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div id="cartItems"></div>

        <div class="sticky-checkout">

            <h3 id="cartTotal">Total: Rs 0</h3>

            <div class="checkout-form">

                <input type="text" id="cusName" placeholder="Your Name" />
                <input type="tel" id="cusPhone" placeholder="Phone Number" />
                <textarea id="cusAddress" placeholder="Delivery Address"></textarea>

            </div>

            <div class="checkout-actions">

                <button class="checkout-btn" type="button" onclick="checkout()">
                    Order Now
                </button>

                <button class="clear-btn" type="button" onclick="clearCart()">
                    Clear Cart
                </button>

            </div>

        </div>

    </div>

    <!-- PRODUCT MODAL -->
    <div id="productModal" class="modal">

        <div class="modal-content">

            <button type="button" class="close" onclick="closeModal()">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <div id="galleryContainer" class="gallery-container"></div>

            <h2 id="modalName"></h2>

            <p id="modalPrice" style="font-weight:bold;font-size:18px;"></p>

            <p id="modalDesc" style="color:var(--muted);font-size:14px;"></p>

            <!-- RATING -->
            <div class="rating-ui">
                <span>Rate:</span>

                <div class="stars-display" id="starRating">
                    <i class="fa-regular fa-star" data-value="1"></i>
                    <i class="fa-regular fa-star" data-value="2"></i>
                    <i class="fa-regular fa-star" data-value="3"></i>
                    <i class="fa-regular fa-star" data-value="4"></i>
                    <i class="fa-regular fa-star" data-value="5"></i>
                </div>
            </div>

            <textarea id="reviewText" placeholder="Write your review..."></textarea>

            <button id="reviewSubmitBtn" class="checkout-btn">
                Submit Review
            </button>

            <div id="reviewList"></div>

            <button
                id="modalAddBtn"
                type="button"
                style="margin-top:15px;width:100%;padding:12px;border:none;border-radius:10px;background:var(--primary);color:#fff;cursor:pointer;">
                Add to Cart
            </button>

        </div>

    </div>

    <!-- LOADING -->
    <div id="loadingScreen" class="loading-screen">
        <div class="loader"></div>
    </div>

    <!-- TOAST -->
    <div id="toast" class="toast"></div>

    <!-- SOCIAL LINKS -->
    <div class="social-links">

        <a href="https://facebook.com/" target="_blank" class="social-btn">
            <i class="fa-brands fa-facebook-f"></i>
        </a>

        <a href="https://instagram.com/" target="_blank" class="social-btn">
            <i class="fa-brands fa-instagram"></i>
        </a>

        <a href="https://tiktok.com/" target="_blank" class="social-btn">
            <i class="fa-brands fa-tiktok"></i>
        </a>

        <a href="https://wa.me/94752425790" target="_blank" class="social-btn whatsapp">
            <i class="fa-brands fa-whatsapp"></i>
        </a>

    </div>

    <!-- JS -->
    <script type="module" src="app.js?v=21"></script>

</body>
</html>
