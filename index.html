<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Freshora Ultra Store</title>

<link rel="stylesheet" href="style.css?v=20"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>

<body>

<div class="top-banner">
  Free Delivery Above Rs 5000 • Cash On Delivery • Fresh Daily Products
</div>

<div id="loadingScreen" class="loading-screen">
  <div class="loader"></div>
</div>

<div id="overlay" class="overlay" onclick="toggleCart()"></div>

<header class="header">
  <div class="logo-area" ondblclick="window.location='login.html'">
    <img src="logo.png" class="logo-img"/>
    <div class="logo-text">Freshora</div>
  </div>

  <div class="search-box">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input id="searchInput" placeholder="Search products..."/>
  </div>

  <button class="icon-btn" id="darkModeBtn" onclick="toggleDarkMode()">
    <i class="fa-solid fa-moon"></i>
  </button>
</header>

<section class="filters">
  <select id="categoryFilter">
    <option value="all">All</option>
    <option>Grocery</option>
    <option>Drinks</option>
    <option>Snacks</option>
    <option>Beauty</option>
  </select>

  <select id="priceFilter">
    <option value="all">Price</option>
    <option value="500">Under 500</option>
    <option value="1000">Under 1000</option>
  </select>

  <select id="discountFilter">
    <option value="all">Discount</option>
    <option value="10">10%+</option>
    <option value="20">20%+</option>
  </select>
</section>

<section id="products" class="products"></section>

<button class="floating-cart" onclick="toggleCart()">
<i class="fa-solid fa-cart-shopping"></i>
<span id="floatingCartCount">0</span>
</button>

<!-- CART -->
<div id="cartDrawer" class="cart">
  <div class="cart-header">
    <h3>Your Cart</h3>
    <button onclick="toggleCart()">✕</button>
  </div>

  <div id="cartItems"></div>

  <div class="cart-footer">
    <h3 id="cartTotal">Total: Rs 0</h3>

    <button class="checkout-btn" onclick="checkout()">
      WhatsApp Order
    </button>

    <button class="clear-btn" onclick="clearCart()">
      Clear Cart
    </button>
  </div>
</div>

<!-- MODAL -->
<div id="productModal" class="modal">
  <div class="modal-box">

    <button class="close" onclick="closeModal()">✕</button>

    <img id="modalImage"/>

    <h2 id="modalName"></h2>
    <p id="modalPrice"></p>

    <div id="reviewList"></div>

    <textarea id="reviewText"></textarea>
    <select id="reviewRating">
      <option value="5">⭐⭐⭐⭐⭐</option>
      <option value="4">⭐⭐⭐⭐</option>
      <option value="3">⭐⭐⭐</option>
    </select>

    <button id="reviewSubmitBtn">Submit</button>

    <button id="modalAddBtn" class="add-btn">
      Add to Cart
    </button>

  </div>
</div>

<!-- MOBILE NAV -->
<nav class="bottom-nav">
  <button><i class="fa fa-home"></i></button>
  <button><i class="fa fa-heart"></i></button>
  <button onclick="toggleCart()"><i class="fa fa-cart-shopping"></i></button>
  <button><i class="fa fa-user"></i></button>
</nav>

<script type="module" src="app.js?v=20"></script>

</body>
</html>
