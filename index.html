<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Freshora Online Store</title>

  <link rel="stylesheet" href="style.css?v=6" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body>

<!-- TOP BANNER -->
<div class="top-banner">
  <p>Free Delivery Above Rs 5000 • Cash On Delivery • Fresh Daily Products</p>
</div>

<!-- LOADING -->
<div id="loadingScreen" class="loading-screen">
  <div class="loader"></div>
</div>

<!-- OVERLAY -->
<div id="overlay" class="overlay" onclick="toggleCart()"></div>

<!-- HEADER -->
<header class="header">

  <div class="logo-area" ondblclick="window.location='login.html'">
    <img src="logo.png" class="logo-img" alt="Freshora Logo" />
    <div class="logo-text">Freshora</div>
  </div>

  <div class="search-box">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input
      type="text"
      id="searchInput"
      placeholder="Search products..."
      autocomplete="off"
      oninput="handleSearch(this.value)"
    />
  </div>

  <button id="darkModeBtn" class="icon-btn" onclick="toggleDarkMode()">
    <i class="fa-solid fa-moon"></i>
  </button>

</header>

<!-- HERO -->
<section class="hero">

  <div class="hero-content">

    <span class="hero-badge">Fresh Daily Products</span>

    <h1>Premium Grocery & Lifestyle Store</h1>

    <p>
      Freshora delivers fresh groceries,
      drinks, snacks & beauty products
      directly to your doorstep.
    </p>

    <div class="hero-buttons">
      <button class="hero-btn" onclick="scrollToProducts()">
        Shop Now
      </button>

      <button class="hero-outline-btn" onclick="resetFilters()">
        Explore
      </button>
    </div>

  </div>

</section>

<!-- CATEGORY SLIDER -->
<section class="category-slider">

  <button class="category-chip active"
    onclick="filterCategory('all')"
    data-category="all">
    All
  </button>

  <button class="category-chip"
    onclick="filterCategory('Grocery')"
    data-category="Grocery">
    Grocery
  </button>

  <button class="category-chip"
    onclick="filterCategory('Drinks')"
    data-category="Drinks">
    Drinks
  </button>

  <button class="category-chip"
    onclick="filterCategory('Snacks')"
    data-category="Snacks">
    Snacks
  </button>

  <button class="category-chip"
    onclick="filterCategory('Beauty')"
    data-category="Beauty">
    Beauty
  </button>

</section>

<!-- FILTERS -->
<section class="advanced-search">

  <div class="filter-grid">

    <select id="categoryFilter" onchange="filterCategory(this.value)">
      <option value="all">All Categories</option>
      <option value="Grocery">Grocery</option>
      <option value="Drinks">Drinks</option>
      <option value="Snacks">Snacks</option>
      <option value="Beauty">Beauty</option>
    </select>

    <select id="priceFilter" onchange="filterProducts()">
      <option value="all">All Prices</option>
      <option value="500">Under Rs 500</option>
      <option value="1000">Under Rs 1000</option>
      <option value="2000">Under Rs 2000</option>
    </select>

    <select id="discountFilter" onchange="filterProducts()">
      <option value="all">All Discounts</option>
      <option value="10">10%+ Discount</option>
      <option value="20">20%+ Discount</option>
      <option value="30">30%+ Discount</option>
    </select>

  </div>

</section>

<!-- SECTION TITLE -->
<div class="section-header" id="productsSection">
  <h2>Popular Products</h2>
  <span>Fresh picks for you</span>
</div>

<!-- PRODUCTS -->
<section id="products" class="products-grid"></section>

<!-- FLOATING CART -->
<button class="floating-cart" onclick="toggleCart()">
  <i class="fa-solid fa-cart-shopping"></i>
  <span id="floatingCartCount">0</span>
</button>

<!-- MOBILE BOTTOM NAV -->
<nav class="bottom-nav">

  <button class="bottom-nav-item active" onclick="scrollToTop()">
    <i class="fa-solid fa-house"></i>
    <span>Home</span>
  </button>

  <button class="bottom-nav-item" onclick="scrollToProducts()">
    <i class="fa-solid fa-layer-group"></i>
    <span>Products</span>
  </button>

  <button class="bottom-nav-item" onclick="toggleCart()">
    <i class="fa-solid fa-cart-shopping"></i>
    <span>Cart</span>
  </button>

  <button class="bottom-nav-item" onclick="openWishlist()">
    <i class="fa-solid fa-heart"></i>
    <span>Wishlist</span>
  </button>

</nav>

<script type="module" src="app.js?v=7"></script>

<!-- =========================
LOCAL STORAGE INIT + HOOKS
========================= -->

<script>
/* =========================
BASIC UI HELPERS
========================= */

function scrollToProducts(){
  document.getElementById("productsSection")
  .scrollIntoView({behavior:"smooth"});
}

function scrollToTop(){
  window.scrollTo({top:0, behavior:"smooth"});
}

function resetFilters(){
  document.getElementById("categoryFilter").value = "all";
  document.getElementById("priceFilter").value = "all";
  document.getElementById("discountFilter").value = "all";

  if(typeof filterProducts === "function"){
    filterProducts();
  }
}

/* =========================
LOCAL STORAGE CART INIT
========================= */

let cart = JSON.parse(localStorage.getItem("freshora_cart")) || [];

function saveCart(){
  localStorage.setItem("freshora_cart", JSON.stringify(cart));
  updateCartUI();
}

/* =========================
WISHLIST SYSTEM
========================= */

let wishlist = JSON.parse(localStorage.getItem("freshora_wishlist")) || [];

function saveWishlist(){
  localStorage.setItem("freshora_wishlist", JSON.stringify(wishlist));
}

/* =========================
SEARCH HOOK
========================= */

function handleSearch(value){
  if(typeof filterProducts === "function"){
    filterProducts(value);
  }
}

/* =========================
CATEGORY FILTER HOOK
========================= */

function filterCategory(cat){
  document.querySelectorAll(".category-chip")
  .forEach(btn=>{
    btn.classList.remove("active");
    if(btn.dataset.category === cat){
      btn.classList.add("active");
    }
  });

  if(typeof filterProducts === "function"){
    filterProducts();
  }
}

/* =========================
WISHLIST OPEN (placeholder)
========================= */

function openWishlist(){
  alert("Wishlist feature ready (connect UI in app.js)");
}

/* =========================
CART UI UPDATE HOOK
========================= */

function updateCartUI(){
  let count = cart.reduce((a,b)=>a+b.qty,0);

  document.getElementById("floatingCartCount").innerText = count;
}
</script>

</body>
</html>
