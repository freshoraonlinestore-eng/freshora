<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Freshora Admin Dashboard V4</title>

<!-- CSS -->
<link rel="stylesheet" href="admin.css?v=10">

<!-- Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>
    <div style="position:fixed;bottom:10px;right:10px;background:black;color:white;padding:8px;z-index:9999">
HTML OK
</div>

<!-- =========================
ADMIN WRAPPER
========================= -->
<div class="admin-container">

    <h2>🟢 Freshora Admin Dashboard</h2>

    <button onclick="logout()" class="logout-btn">
        Logout
    </button>

    <hr>

    <!-- =========================
    ADD / UPDATE PRODUCT
    ========================== -->
    <section>

        <h3>📦 Add / Update Product</h3>

        <div class="form-grid">

            <input id="pname" placeholder="Product Name">
            <input id="pprice" type="number" placeholder="Price">
            <input id="pdiscount" type="number" placeholder="Discount %">
            <input id="pcategory" placeholder="Category">

            <textarea id="pdesc" placeholder="Description"></textarea>

            <input id="pimageFile" type="file">

        </div>

        <button onclick="uploadAndAddProduct()" class="primary-btn">
            Save Product
        </button>

    </section>

    <hr>

    <!-- =========================
    ANALYTICS
    ========================== -->
    <section>

        <h3>📊 Analytics Dashboard</h3>

        <div class="analytics-box">

            <div class="stats">

                <div>
                    <h4>Products</h4>
                    <span id="totalProducts">0</span>
                </div>

                <div>
                    <h4>Orders</h4>
                    <span id="totalOrders">0</span>
                </div>

                <div>
                    <h4>Revenue</h4>
                    <span id="totalRevenue">0</span>
                </div>

            </div>

            <canvas id="analyticsChart"></canvas>

        </div>

    </section>

    <hr>

    <!-- =========================
    PRODUCTS LIST
    ========================== -->
    <section>

        <h3>🛍 Products</h3>

        <div id="productList" class="list-box"></div>

    </section>

    <hr>

    <!-- =========================
    ORDERS LIST
    ========================== -->
    <section>

        <h3>📦 Orders</h3>

        <div id="orderList" class="list-box"></div>

    </section>

</div>

<!-- =========================
SCRIPT
========================= -->
<script type="module" src="admin.js"></script>

</body>
</html>
