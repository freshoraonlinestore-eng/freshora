<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Freshora Admin V4</title>

<!-- CSS -->
<link rel="stylesheet" href="admin.css?v=3">

<!-- Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<!-- Chart.js (IMPORTANT for analytics) -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<div class="admin-container">

    <h2>🟢 Freshora Admin V4 Dashboard</h2>

    <button onclick="logout()">Logout</button>

    <hr>

    <!-- =========================
    ADD PRODUCT
    ========================== -->
    <h3>📦 Add / Update Product</h3>

    <input id="pname" placeholder="Product Name">
    <input id="pprice" placeholder="Price">
    <input id="pdiscount" placeholder="Discount %">
    <input id="pcategory" placeholder="Category">
    <textarea id="pdesc" placeholder="Description"></textarea>

    <!-- IMAGE OPTIONS -->
    <input id="pimageFile" type="file">

    <button onclick="uploadAndAddProduct()">
        Save Product
    </button>

    <hr>

    <!-- =========================
    ANALYTICS
    ========================== -->
    <h3>📊 Analytics Dashboard</h3>

    <div class="analytics-box">

        <p>Products: <span id="totalProducts">0</span></p>
        <p>Orders: <span id="totalOrders">0</span></p>
        <p>Revenue: <span id="totalRevenue">0</span></p>

        <canvas id="analyticsChart"></canvas>

    </div>

    <hr>

    <!-- =========================
    PRODUCTS
    ========================== -->
    <h3>🛍 Products</h3>
    <div id="productList"></div>

    <hr>

    <!-- =========================
    ORDERS
    ========================== -->
    <h3>📦 Orders</h3>
    <div id="orderList"></div>

</div>

<!-- ADMIN SCRIPT -->
<script type="module" src="admin.js?v=4"></script>

</body>
</html>
