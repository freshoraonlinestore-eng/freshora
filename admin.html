<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Freshora Admin Pro</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>

<div class="admin-container">

<h2>🟢 Freshora Admin PRO</h2>

<button onclick="logout()">Logout</button>

<hr>

<h3>Add Product</h3>

<input id="pname" placeholder="Product Name">
<input id="pprice" placeholder="Price">
<input id="pdiscount" placeholder="Discount %">
<input id="pcategory" placeholder="Category">
<textarea id="pdesc" placeholder="Description"></textarea>

<input type="file" id="pimageFile">

<button onclick="uploadAndAddProduct()">Upload & Add Product</button>

<hr>

<h3>Products</h3>
<div id="productList"></div>

<hr>

<h3>Orders</h3>
<div id="orderList"></div>

</div>

<script type="module" src="admin.js"></script>

</body>
</html>
