<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Freshora Admin PRO Dashboard</title>

    <link rel="stylesheet" href="admin.css?v=7">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<div class="admin-container">

    <h2><i class="fas fa-user-shield"></i> Freshora Admin PRO Dashboard</h2>

    <div style="text-align:center;">
        <button onclick="logout()" style="background:red;color:white;padding:10px 15px;border:none;border-radius:8px;">
            Logout
        </button>
    </div>

    <!-- ===================== STATS ===================== -->
    <h3><i class="fas fa-chart-line"></i> Intelligence Reports</h3>

    <div class="admin-card">
        <p>Products: <span id="totalProducts">0</span></p>
        <p>Total Stock: <span id="totalStock">0</span></p>
        <p style="color:red;">Low Stock: <span id="lowStock">0</span></p>
    </div>

    <!-- ===================== DELIVERY ===================== -->
    <h3><i class="fas fa-truck"></i> Delivery Fees</h3>

    <div class="admin-card">
        <select id="districtSelect">
            <option value="">Select District</option>
            <option value="Colombo">Colombo</option>
        </select>

        <input id="deliveryCost" type="number" placeholder="Delivery Cost">

        <button onclick="saveDeliveryFee()">Save</button>
    </div>

    <!-- ===================== PRODUCT ADD ===================== -->
    <h3><i class="fas fa-box"></i> Add / Edit Product</h3>

    <div class="admin-card">

        <input id="pname" placeholder="Product Name">
        <input id="pprice" type="number" placeholder="Price">
        <input id="pdiscount" type="number" placeholder="Discount %">
        <input id="pstock" type="number" placeholder="Stock">

        <textarea id="pdesc" placeholder="Description"></textarea>

        <!-- CATEGORY -->
        <select id="pcategorySelect">
            <option value="Other">Other</option>
        </select>

        <!-- ================= IMAGE UPLOAD (3 IMAGES FIX) ================= -->
        <input id="pimageFile" type="file" multiple accept="image/*">

        <!-- PREVIEW -->
        <div id="previewContainer"
             style="display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;"></div>

        <!-- PROGRESS BAR -->
        <div style="width:100%;background:#eee;height:8px;border-radius:10px;margin-top:10px;">
            <div id="uploadProgress"
                 style="width:0%;height:8px;background:green;border-radius:10px;"></div>
        </div>

        <small id="uploadStatus"></small>

        <!-- ACTION BUTTONS -->
        <div style="margin-top:10px;display:flex;gap:10px;flex-wrap:wrap;">
            <button onclick="uploadAndAddProduct()" style="background:green;color:white;">
                Add Product
            </button>

            <button onclick="updateSelected()" style="background:orange;color:white;">
                Update Selected
            </button>

            <button onclick="clearForm()">
                Clear
            </button>
        </div>

    </div>

    <!-- ===================== CATEGORY ===================== -->
    <h3><i class="fas fa-tags"></i> Categories</h3>

    <div class="admin-card">
        <input id="catName" placeholder="Category Name">
        <button onclick="addCategory()">Add</button>
    </div>

    <div id="activeCategoryList"></div>

    <!-- ===================== ORDERS ===================== -->
    <h3><i class="fas fa-shopping-cart"></i> Live Orders</h3>

    <div class="admin-card" style="overflow:auto;">
        <table style="width:100%;">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Phone</th>
                    <th>District</th>
                    <th>Total</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="orderList">
                <tr>
                    <td colspan="7" style="text-align:center;">No Orders</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- ===================== PRODUCTS TABLE ===================== -->
    <h3><i class="fas fa-list"></i> Products</h3>

    <input id="adminSearch" placeholder="Search products...">

    <div class="admin-card" style="overflow:auto;">
        <table style="width:100%;">
            <thead>
                <tr>
                    <th>Img</th>
                    <th>Name</th>
                    <th>Price</th>
                    <th>Discount</th>
                    <th>Final</th>
                    <th>Category</th>
                    <th>Stock</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="productListBody"></tbody>
        </table>
    </div>

    <!-- ===================== DELIVERY LIST ===================== -->
    <h3>Delivery Fees</h3>
    <div id="deliveryList"></div>

    <!-- ===================== CHART ===================== -->
    <h3>Analytics</h3>
    <canvas id="analyticsChart"></canvas>

</div>

<!-- ===================== SCRIPT ===================== -->
<script type="module" src="admin.js?v=7"></script>

</body>
</html>
