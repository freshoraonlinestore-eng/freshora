<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freshora Admin PRO Control Dashboard</title>
    <link rel="stylesheet" href="admin.css?v=6">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="admin-container">
    <h2>Freshora Admin PRO Control Dashboard</h2>
    <div style="text-align: center;">
        <button onclick="logout()" style="background: var(--danger); color: white;">Logout</button>
    </div>

    <h3>📊 Intelligence Reports</h3>
    <div class="admin-card">
        <p>Products: <span id="totalProducts">0</span></p>
        <p>Total Stock: 0</p>
        <p style="color: var(--danger);">Low Stock Items: 1</p>
        <p>Total Revenue: <span id="totalRevenue">Rs 0</span></p>
        <div style="display: grid; gap: 10px;">
            <button onclick="downloadInventory()">Download Product Inventory</button>
            <button onclick="downloadSales()">Download Sales/Orders Report</button>
            <button onclick="downloadReviews()">Download Customer Reviews</button>
        </div>
    </div>

    <h3>🚚 Manage Delivery Fees</h3>
    <div class="admin-card">
        <select id="districtSelect">
            <option>Select District</option>
            <option>Colombo</option>
        </select>
        <input id="deliveryCost" placeholder="Delivery Cost (LKR)">
        <button onclick="saveDeliveryFee()" style="background: var(--primary); color: white;">Save Delivery Fee</button>
    </div>

    <h3>📦 Manage Products</h3>
    <div class="admin-card">
        <input id="pname" placeholder="Product Name">
        <input id="pprice" placeholder="Price (LKR)">
        <input id="pdiscount" placeholder="Discount %">
        <input id="pstock" placeholder="Stock Qty">
        <textarea id="pdesc" placeholder="Product Description..."></textarea>
        <input id="pimageFile" type="file">
        <select id="pcategorySelect">
            <option>Other</option>
        </select>
        <button onclick="uploadAndAddProduct()" style="background: var(--primary); color: white;">Add New Product</button>
        <button onclick="updateSelected()" style="background: orange; color: white;">Update Selected</button>
        <button onclick="clearForm()">Clear Form</button>
    </div>

    <h3>🏷 Categories</h3>
    <div class="admin-card">
        <input id="catName" placeholder="Category Name">
        <button onclick="addCategory()" style="background: var(--primary); color: white;">Add</button>
        <button onclick="updateCategory()" style="background: orange; color: white;">Update</button>
    </div>

    <h3>🛍 Live Incoming Orders</h3>
    <div id="orderList"></div>

    <h3>📋 Products List</h3>
    <input id="adminSearch" placeholder="Live search by name or category...">
    <div id="productList"></div>

    <hr>
    <canvas id="analyticsChart"></canvas>
</div>

<script type="module" src="admin.js?v=6"></script>
</body>
</html>
