<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Freshora Admin V2</title>
<link rel="stylesheet" href="admin.css?v=4">
</head>
<body>

<div class="admin-container">

<h2>🟢 Freshora Admin V2</h2>

<button onclick="logout()">Logout</button>

<hr>

<h3>Add / Edit Product</h3>

<input id="searchBox" placeholder="Search products..." oninput="searchProducts()">

<input id="pname" placeholder="Product Name">
<input id="pprice" placeholder="Price">
<input id="pdiscount" placeholder="Discount %">
<input id="pcategory" placeholder="Category">
<textarea id="pdesc" placeholder="Description"></textarea>

<input type="file" id="pimageFile">

<button onclick="uploadOrUpdateProduct()">Save Product</button>

<hr>

<h3>Products</h3>
<div id="productList"></div>

<hr>

<h3>Orders</h3>
<div id="orderList"></div>

</div>

<script type="module" src="admin.js?v=4"></script>
</body>
</html>
