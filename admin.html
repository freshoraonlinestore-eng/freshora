<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freshora Admin PRO Control Dashboard</title>
    <link rel="stylesheet" href="admin.css?v=7">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<div class="admin-container">
    <h2><i class="fas fa-user-shield"></i> Freshora Admin PRO</h2>
    <div style="text-align: center; margin-bottom: 20px;">
        <button onclick="logout()" style="background: var(--danger, #ff4d4d); color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;">Logout</button>
    </div>

    <h3><i class="fas fa-chart-line"></i> Intelligence Reports</h3>
    <div class="admin-card">
        <p>Products: <span id="totalProducts">0</span> | Stock: <span id="totalStock">0</span></p>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <button onclick="downloadInventory()">Download Inventory</button>
            <button onclick="downloadSales()">Download Sales Report</button>
        </div>
    </div>

    <h3><i class="fas fa-box-open"></i> Manage Products</h3>
    <div class="admin-card">
        <input id="pname" placeholder="Product Name">
        <input id="pprice" type="number" placeholder="Price (LKR)">
        <input id="pdiscount" type="number" placeholder="Discount %">
        <input id="pstock" type="number" placeholder="Stock Qty">
        
        <div style="display:flex; gap:10px; margin: 10px 0;">
            <input type="file" id="img1" onchange="previewImg(this, 'prev1')">
            <input type="file" id="img2" onchange="previewImg(this, 'prev2')">
            <input type="file" id="img3" onchange="previewImg(this, 'prev3')">
        </div>
        <div style="display:flex; gap:10px;">
            <img id="prev1" width="50"><img id="prev2" width="50"><img id="prev3" width="50">
        </div>
        <progress id="uploadProgress" value="0" max="100" style="width:100%; height:10px; margin-top:10px;"></progress>
        
        <button onclick="uploadAndAddProduct()" style="background: var(--primary, #007bff); color: white; width: 100%; padding: 10px; margin-top:10px;">Add New Product</button>
    </div>

    <h3><i class="fas fa-shopping-cart"></i> Live Incoming Orders</h3>
    <div class="admin-card" style="overflow-x:auto;">
        <table style="width:100%; border-collapse: collapse;">
            <thead>
                <tr>
                    <th>Order</th><th>Customer</th><th>Phone</th><th>Bill</th><th>Action</th>
                </tr>
            </thead>
            <tbody id="orderList">
                <tr><td colspan="5" style="text-align:center;">Loading...</td></tr>
            </tbody>
        </table>
    </div>

    <h3><i class="fas fa-list"></i> Products List</h3>
    <div class="admin-card" style="overflow-x:auto;">
        <table style="width:100%;">
            <tbody id="productListBody"></tbody>
        </table>
    </div>
</div>

<script type="module" src="admin.js?v=7"></script>
<script>
    function previewImg(input, id) {
        if (input.files && input.files[0]) {
            let reader = new FileReader();
            reader.onload = (e) => document.getElementById(id).src = e.target.result;
            reader.readAsDataURL(input.files[0]);
        }
    }
</script>
</body>
</html>
