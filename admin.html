<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Freshora Admin FIXED</title>

<link rel="stylesheet" href="admin.css">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div id="debug" style="position:fixed;bottom:10px;right:10px;background:black;color:white;padding:6px;z-index:9999">
HTML OK
</div>

<div class="admin-container">

<h2>🟢 Freshora Admin FIX</h2>

<button onclick="logout()">Logout</button>

<hr>

<h3>📦 Add Product</h3>

<input id="pname" placeholder="Name">
<input id="pprice" placeholder="Price">
<input id="pdiscount" placeholder="Discount">
<input id="pcategory" placeholder="Category">
<textarea id="pdesc" placeholder="Description"></textarea>

<input id="pimageFile" type="file">

<button onclick="uploadAndAddProduct()">Save Product</button>

<hr>

<h3>📊 Analytics</h3>

<p>Products: <span id="totalProducts">0</span></p>
<p>Orders: <span id="totalOrders">0</span></p>
<p>Revenue: <span id="totalRevenue">0</span></p>

<canvas id="analyticsChart"></canvas>

<hr>

<h3>🛍 Products</h3>
<div id="productList"></div>

<hr>

<h3>📦 Orders</h3>
<div id="orderList"></div>

</div>

<script type="module" src="admin.js"></script>

</body>
</html>
