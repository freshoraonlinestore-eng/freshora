<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Freshora Admin V6</title>

<link rel="stylesheet" href="admin.css?v=6">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<div class="admin-container">

    <h2>🟢 Freshora Admin V6</h2>

    <button onclick="logout()" class="logout-btn">Logout</button>

    <hr>

    <!-- PRODUCT FORM -->
    <h3>📦 Product Manager</h3>

    <input id="pname" placeholder="Product Name">
    <input id="pprice" type="number" placeholder="Price">
    <input id="pdiscount" type="number" placeholder="Discount %">
    <input id="pcategory" placeholder="Category">
    <textarea id="pdesc" placeholder="Description"></textarea>

    <input id="pimageFile" type="file" multiple>

    <button onclick="uploadAndAddProduct()" class="btn">
        Save Product
    </button>

    <hr>

    <!-- ANALYTICS -->
    <h3>📊 Analytics</h3>

    <div class="box">
        <p>Products: <span id="totalProducts">0</span></p>
        <p>Orders: <span id="totalOrders">0</span></p>
        <p>Revenue: <span id="totalRevenue">0</span></p>
    </div>

    <hr>

    <!-- PRODUCTS -->
    <h3>🛍 Products</h3>
    <div id="productList"></div>

    <hr>

    <!-- ORDERS -->
    <h3>📦 Orders</h3>
    <div id="orderList"></div>

</div>

<script type="module" src="admin.js"></script>

</body>
</html>
