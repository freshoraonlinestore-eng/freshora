<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Freshora Cart</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
.checkout-form{
  background:var(--card);
  margin:16px;
  padding:16px;
  border-radius:16px;
  display:flex;
  flex-direction:column;
  gap:12px;
  box-shadow:var(--shadow);
}

.checkout-form input,
.checkout-form textarea{
  padding:14px;
  border-radius:12px;
  border:1px solid var(--border);
  font-size:14px;
}

.checkout-form textarea{
  min-height:80px;
}

.sticky-checkout{
  position:sticky;
  bottom:0;
  background:var(--card);
  padding:16px;
  border-top:1px solid var(--border);
  display:flex;
  flex-direction:column;
  gap:10px;
  box-shadow:0 -5px 20px rgba(0,0,0,.08);
}

#cartTotal{
  font-size:18px;
  font-weight:800;
  text-align:center;
}

.checkout-btn{
  background:var(--green);
  color:#fff;
  padding:14px;
  border-radius:12px;
  font-weight:700;
  cursor:pointer;
  border:none;
}

.clear-btn{
  background:#f1f1f1;
  padding:14px;
  border-radius:12px;
  font-weight:700;
  cursor:pointer;
  border:none;
}

.empty{
  text-align:center;
  padding:40px;
  color:var(--muted);
}
</style>

</head>

<body>

<header class="header">

  <div class="logo">Freshora</div>

  <div></div>

  <button class="icon-btn" onclick="window.location.href='index.html'">
    <i class="fa fa-arrow-left"></i>
  </button>

</header>

<div id="cartItems" style="padding:16px"></div>

<div class="checkout-form">

  <input id="name" type="text" placeholder="Your Name">
  <input id="phone" type="text" placeholder="Phone Number">
  <input id="district" type="text" placeholder="District">
  <textarea id="address" placeholder="Full Address"></textarea>

</div>

<div class="sticky-checkout">

  <div id="cartTotal">Total: Rs 0</div>

  <button class="checkout-btn" onclick="checkout()">
    Checkout via WhatsApp
  </button>

  <button class="clear-btn" onclick="clearCart()">
    Clear Cart
  </button>

</div>

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

const cartItems = document.getElementById("cartItems");
const cartTotal = document.getElementById("cartTotal");

/* ================= SAFE RENDER ================= */
function renderCart(){

  if(!cartItems) return;

  cartItems.innerHTML = "";

  if(cart.length === 0){
    cartItems.innerHTML = `<p class="empty">Your cart is empty</p>`;
    cartTotal.innerText = "Total: Rs 0";
    return;
  }

  let total = 0;

  cart.forEach((item,index)=>{

    let itemTotal = Number(item.price) * item.qty;
    total += itemTotal;

    cartItems.innerHTML += `
      <div class="cart-item">

        <img src="${item.image}" alt="${item.name}">

        <div class="cart-details">

          <h4>${item.name}</h4>
          <p>Rs ${Number(item.price).toLocaleString()}</p>

          <div class="qty-box">

            <button onclick="decreaseQty(${index})">-</button>
            <span>${item.qty}</span>
            <button onclick="increaseQty(${index})">+</button>

          </div>

        </div>

        <button class="remove-btn" onclick="removeItem(${index})">✕</button>

      </div>
    `;
  });

  cartTotal.innerText = "Total: Rs " + total.toLocaleString();
}

/* ================= CART OPS ================= */
function saveCart(){
  localStorage.setItem("cart", JSON.stringify(cart));
  renderCart();
}

function removeItem(i){
  cart.splice(i,1);
  saveCart();
}

function increaseQty(i){
  cart[i].qty++;
  saveCart();
}

function decreaseQty(i){
  if(cart[i].qty > 1){
    cart[i].qty--;
  } else {
    cart.splice(i,1);
  }
  saveCart();
}

function clearCart(){
  cart = [];
  saveCart();
}

/* ================= CHECKOUT FIXED ================= */
function checkout(){

  if(cart.length === 0){
    alert("Cart is empty!");
    return;
  }

  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const district = document.getElementById("district").value.trim();
  const address = document.getElementById("address").value.trim();

  if(!name || !phone || !district || !address){
    alert("Please fill delivery details!");

    document.querySelector(".checkout-form").scrollIntoView({
      behavior:"smooth"
    });

    return;
  }

  let orderID = "FR-" + Date.now();

  let subtotal = 0;
  let itemsText = "";

  cart.forEach((item,i)=>{
    let itemTotal = item.price * item.qty;
    subtotal += itemTotal;

    itemsText += `${i+1}) ${item.name} x${item.qty} = LKR ${itemTotal}\n`;
  });

  let delivery = 375;
  let total = subtotal + delivery;

  let message = `🟢 FRESHORA ORDER 🟢

Order ID: ${orderID}

Name: ${name}
Phone: ${phone}
District: ${district}
Address: ${address}

ITEMS:
${itemsText}

Subtotal: LKR ${subtotal}
Delivery: LKR ${delivery}
TOTAL: LKR ${total}`;

  const whatsapp = "94752425790";

  window.open(
    `https://wa.me/${whatsapp}?text=${encodeURIComponent(message)}`,
    "_blank"
  );

  cart = [];
  saveCart();
}

/* INIT */
renderCart();

</script>

</body>
</html>
