<!DOCTYPE html>
<html>
<head>
  <title>Cart - Freshora</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Your Cart</h1>
  <a href="index.html">Back</a>
</header>

<div id="cart"></div>

<h2 id="total" style="padding:15px"></h2>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

const cartDiv = document.getElementById("cart");
const totalDiv = document.getElementById("total");

// RENDER CART
function renderCart() {

  cartDiv.innerHTML = "";

  let total = 0;

  if (cart.length === 0) {
    cartDiv.innerHTML = "<p style='padding:15px'>Cart is empty</p>";
    totalDiv.innerHTML = "";
    return;
  }

  cart.forEach((item, index) => {

    let price = Number(item.price);
    total += price * item.qty;

    cartDiv.innerHTML += `
      <div class="card">

        <img src="${item.image}">

        <h3>${item.name}</h3>

        <p>Rs ${price}</p>

        <p>Qty: ${item.qty}</p>

        <button onclick="increaseQty(${index})">+</button>
        <button onclick="decreaseQty(${index})">-</button>

        <button onclick="removeItem(${index})">
          Remove
        </button>

      </div>
    `;
  });

  totalDiv.innerHTML = "Total: Rs " + total;
}

// REMOVE ITEM
function removeItem(index) {
  cart.splice(index, 1);
  saveCart();
}

// INCREASE QTY
function increaseQty(index) {
  cart[index].qty += 1;
  saveCart();
}

// DECREASE QTY
function decreaseQty(index) {
  if (cart[index].qty > 1) {
    cart[index].qty -= 1;
  } else {
    cart.splice(index, 1);
  }
  saveCart();
}

// SAVE CART
function saveCart() {
  localStorage.setItem("cart", JSON.stringify(cart));
  renderCart();
}

renderCart();
</script>

</body>
</html>
