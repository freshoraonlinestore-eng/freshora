<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Freshora Cart</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<!-- HEADER -->
<header class="header">

  <div class="logo">Freshora</div>

  <div></div>

  <button class="icon-btn"
    onclick="window.location.href='index.html'">
    <i class="fa fa-arrow-left"></i>
  </button>

</header>

<!-- CART ITEMS -->
<div id="cartItems" style="padding:16px"></div>

<!-- CHECKOUT AREA -->
<div class="sticky-checkout">

  <!-- DELIVERY FORM -->
  <div class="checkout-form">

    <input type="text"
           id="name"
           placeholder="Full Name">

    <input type="text"
           id="phone"
           placeholder="Phone Number">

    <textarea id="address"
              placeholder="Delivery Address"></textarea>

  </div>

  <!-- TOTAL -->
  <h3 id="cartTotal">Total: Rs 0</h3>

  <!-- BUTTONS -->
  <button class="checkout-btn">
    Checkout via WhatsApp
  </button>

  <button class="clear-btn" onclick="clearCart()">
    Clear Cart
  </button>

</div>

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

const cartItems = document.getElementById("cartItems");
const cartTotal = document.getElementById("cartTotal");

/* =========================
   RENDER CART
========================= */

function renderCart(){

  cartItems.innerHTML = "";

  if(cart.length === 0){

    cartItems.innerHTML = `
      <p class="empty">🛒 Cart is empty</p>
    `;

    cartTotal.innerText = "Total: Rs 0";
    return;
  }

  let total = 0;

  cart.forEach((item,index)=>{

    const price = Number(item.price) || 0;
    const qty = Number(item.qty) || 1;

    total += price * qty;

    cartItems.innerHTML += `
      <div class="cart-item">

        <img src="${item.image}"
             onerror="this.src='placeholder.png'">

        <div class="cart-details">

          <h4>${item.name}</h4>

          <p>Rs ${price.toLocaleString()}</p>

          <div class="qty-box">

            <button onclick="decreaseQty(${index})">-</button>

            <span>${qty}</span>

            <button onclick="increaseQty(${index})">+</button>

          </div>

        </div>

        <button class="remove-btn"
          onclick="removeItem(${index})">
          ✕
        </button>

      </div>
    `;
  });

  cartTotal.innerText = "Total: Rs " + total.toLocaleString();
}

/* =========================
   SAVE CART
========================= */

function saveCart(){
  localStorage.setItem("cart", JSON.stringify(cart));
  renderCart();
}

/* =========================
   CART ACTIONS
========================= */

function removeItem(i){
  cart.splice(i,1);
  saveCart();
}

function increaseQty(i){
  cart[i].qty = (cart[i].qty || 1) + 1;
  saveCart();
}

function decreaseQty(i){
  if(cart[i].qty > 1){
    cart[i].qty--;
  } else {
    cart.splice(i,1);
  }
  saveCart();
}

/* =========================
   CLEAR CART
========================= */

function clearCart(){
  if(!confirm("Clear cart?")) return;
  cart = [];
  saveCart();
}

/* =========================
   CHECKOUT (WITH ADDRESS)
========================= */

document.querySelector(".checkout-btn").onclick = function(){

  if(cart.length === 0){
    alert("Cart is empty");
    return;
  }

  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const address = document.getElementById("address").value.trim();

  if(!name || !phone || !address){
    alert("Please fill delivery details");
    return;
  }

  let message = `🛒 Freshora Order:%0A%0A`;
  message += `👤 Name: ${name}%0A`;
  message += `📞 Phone: ${phone}%0A`;
  message += `📍 Address: ${address}%0A%0A`;

  let total = 0;

  cart.forEach(item=>{
    const price = Number(item.price) || 0;
    const qty = Number(item.qty) || 1;

    total += price * qty;

    message += `• ${item.name} x${qty} = Rs ${price * qty}%0A`;
  });

  message += `%0A💰 Total: Rs ${total}`;

  const shopNumber = "94752425790";

  window.open(
    `https://wa.me/${shopNumber}?text=${message}`,
    "_blank"
  );
};

/* =========================
   INIT
========================= */

renderCart();

</script>

</body>
</html>
