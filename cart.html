<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Freshora Cart</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<!-- HEADER -->
<header class="header">

  <div class="logo">Freshora</div>

  <div></div>

  <button class="icon-btn" onclick="window.location.href='index.html'">
    <i class="fa fa-arrow-left"></i>
  </button>

</header>

<!-- CART ITEMS -->
<div id="cartItems" style="padding:16px"></div>

<!-- DELIVERY FORM + SUMMARY -->
<div class="checkout-form">

  <input id="name" type="text" placeholder="Your Name">
  <input id="phone" type="text" placeholder="Phone Number">
  <input id="district" type="text" placeholder="District">
  <textarea id="address" placeholder="Full Address"></textarea>

</div>

<!-- TOTAL + BUTTONS -->
<div class="sticky-checkout">

  <h3 id="cartTotal">Total: Rs 0</h3>

  <button class="checkout-btn" onclick="checkout()">
    Checkout via WhatsApp
  </button>

  <button class="clear-btn" onclick="clearCart()">
    Clear Cart
  </button>

</div>

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

const cartItems = document.getElementById("cartItems");
const cartTotal = document.getElementById("cartTotal");

/* =========================
   RENDER CART
========================= */
function renderCart() {

  cartItems.innerHTML = "";

  if (cart.length === 0) {
    cartItems.innerHTML = `<p class="empty">Cart Empty</p>`;
    cartTotal.innerText = "Total: Rs 0";
    return;
  }

  let total = 0;

  cart.forEach((item, index) => {

    total += Number(item.price) * item.qty;

    cartItems.innerHTML += `
      <div class="cart-item">

        <img src="${item.image}" alt="${item.name}">

        <div class="cart-details">

          <h4>${item.name}</h4>

          <p>Rs ${Number(item.price).toLocaleString()}</p>

          <div class="qty-box">

            <button onclick="decreaseQty(${index})">-</button>

            <span>${item.qty}</span>

            <button onclick="increaseQty(${index})">+</button>

          </div>

        </div>

        <button class="remove-btn" onclick="removeItem(${index})">✕</button>

      </div>
    `;
  });

  cartTotal.innerText = "Total: Rs " + total.toLocaleString();
}

/* =========================
   CART FUNCTIONS
========================= */
function saveCart() {
  localStorage.setItem("cart", JSON.stringify(cart));
  renderCart();
}

function removeItem(index) {
  cart.splice(index, 1);
  saveCart();
}

function increaseQty(index) {
  cart[index].qty++;
  saveCart();
}

function decreaseQty(index) {
  if (cart[index].qty > 1) {
    cart[index].qty--;
  } else {
    cart.splice(index, 1);
  }
  saveCart();
}

function clearCart() {
  cart = [];
  saveCart();
}

/* =========================
   CHECKOUT (WHATSAPP ORDER)
========================= */
function checkout() {

  if (cart.length === 0) {
    alert("Cart is empty!");
    return;
  }

  let name = document.getElementById("name").value;
  let phone = document.getElementById("phone").value;
  let district = document.getElementById("district").value;
  let address = document.getElementById("address").value;

  if (!name || !phone || !district || !address) {
    alert("Please fill delivery details!");
    return;
  }

  let orderID = "FR-" + Date.now();

  let message = `🟢 FRESHORA NEW ORDER 🟢

📦 Order ID: ${orderID}
📅 Date: ${new Date().toLocaleString()}

👤 CUSTOMER DETAILS
----------------------
Name: ${name}
Phone: ${phone}
District: ${district}
Address: ${address}

🛒 ITEMS
----------------------
`;

  let subtotal = 0;

  cart.forEach((item, i) => {
    let line = `${i + 1}) ${item.name} x${item.qty} = LKR ${Number(item.price) * item.qty}\n`;
    message += line;
    subtotal += Number(item.price) * item.qty;
  });

  let delivery = 375;
  let total = subtotal + delivery;

  message += `
💰 BILL SUMMARY
----------------------
Subtotal: LKR ${subtotal}
Delivery: LKR ${delivery}
----------------------
TOTAL: LKR ${total}

🚚 Payment: Cash on Delivery
📍 Store: Freshora Online Store

🙏 Thank you for your order!
`;

  let whatsappNumber = "94752425790"; // change if needed

  let url =
    "https://wa.me/" +
    whatsappNumber +
    "?text=" +
    encodeURIComponent(message);

  window.open(url, "_blank");

  cart = [];
  saveCart();
}

/* INIT */
renderCart();

</script>

</body>
</html>
