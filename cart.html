<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Freshora Cart</title>

  <link rel="stylesheet" href="style.css">

  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<!-- HEADER -->

<header class="header">

  <div class="logo">
    Freshora
  </div>

  <div></div>

  <button
    class="icon-btn"
    onclick="window.location.href='index.html'"
  >
    <i class="fa fa-arrow-left"></i>
  </button>

</header>

<!-- CART -->

<div
  id="cartItems"
  style="padding:16px"
></div>

<!-- TOTAL -->

<div class="sticky-checkout">

  <h3 id="cartTotal">
    Total: Rs 0
  </h3>

  <button class="checkout-btn">
    Checkout
  </button>

  <button
    class="clear-btn"
    onclick="clearCart()"
  >
    Clear Cart
  </button>

</div>

<script>

let cart =
JSON.parse(localStorage.getItem("cart")) || [];

const cartItems =
document.getElementById("cartItems");

const cartTotal =
document.getElementById("cartTotal");

/* =========================
   RENDER CART
========================= */

function renderCart(){

  cartItems.innerHTML = "";

  if(cart.length === 0){

    cartItems.innerHTML = `
      <p class="empty">
        Cart Empty
      </p>
    `;

    cartTotal.innerText =
    "Total: Rs 0";

    return;
  }

  let total = 0;

  cart.forEach((item,index)=>{

    total +=
    Number(item.price) * item.qty;

    cartItems.innerHTML += `

      <div class="cart-item">

        <img
          src="${item.image}"
          alt="${item.name}"
          onerror="this.src='placeholder.png'"
        >

        <div class="cart-details">

          <h4>
            ${item.name}
          </h4>

          <p>
            Rs ${Number(item.price).toLocaleString()}
          </p>

          <div class="qty-box">

            <button
              onclick="decreaseQty(${index})"
            >
              -
            </button>

            <span>
              ${item.qty}
            </span>

            <button
              onclick="increaseQty(${index})"
            >
              +
            </button>

          </div>

        </div>

        <button
          class="remove-btn"
          onclick="removeItem(${index})"
        >
          ✕
        </button>

      </div>

    `;
  });

  cartTotal.innerText =
  "Total: Rs " +
  total.toLocaleString();
}

/* =========================
   SAVE CART
========================= */

function saveCart(){

  localStorage.setItem(
    "cart",
    JSON.stringify(cart)
  );

  renderCart();
}

/* =========================
   REMOVE ITEM
========================= */

function removeItem(index){

  cart.splice(index,1);

  saveCart();
}

/* =========================
   INCREASE
========================= */

function increaseQty(index){

  cart[index].qty++;

  saveCart();
}

/* =========================
   DECREASE
========================= */

function decreaseQty(index){

  if(cart[index].qty > 1){

    cart[index].qty--;

  } else {

    cart.splice(index,1);
  }

  saveCart();
}

/* =========================
   CLEAR CART
========================= */

function clearCart(){

  cart = [];

  saveCart();
}

/* =========================
   INIT
========================= */

renderCart();

</script>

</body>
</html>
