<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Freshora Cart</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="cart.css">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<!-- HEADER -->
<header class="header">

  <div class="logo">Freshora Cart</div>

  <button class="icon-btn" onclick="window.location.href='index.html'">
    <i class="fa fa-arrow-left"></i>
  </button>

</header>

<!-- CART ITEMS -->
<div id="cartItems"></div>

<!-- DELIVERY FORM -->
<div class="checkout-form">

  <input id="name" type="text" placeholder="Your Name">
  <input id="phone" type="text" placeholder="Phone Number">
  <input id="district" type="text" placeholder="District">
  <textarea id="address" placeholder="Full Address"></textarea>

</div>

<!-- TOTAL + ACTIONS -->
<div class="sticky-checkout">

  <div id="cartTotal">Total: Rs 0</div>

  <button class="checkout-btn" onclick="checkout()">
    Checkout via WhatsApp
  </button>

  <button class="clear-btn" onclick="clearCart()">
    Clear Cart
  </button>

</div>

<script>

/* =========================
   CART DATA
========================= */
let cart = JSON.parse(localStorage.getItem("cart")) || [];

const cartItems = document.getElementById("cartItems");
const cartTotal = document.getElementById("cartTotal");

/* =========================
   SAVE CART
========================= */
function saveCart(){
  localStorage.setItem("cart", JSON.stringify(cart));
  renderCart();
}

/* =========================
   RENDER CART (FIXED)
========================= */
function renderCart(){

  cartItems.innerHTML = "";

  if(cart.length === 0){
    cartItems.innerHTML = `<p class="empty">Cart is empty</p>`;
    cartTotal.innerText = "Total: Rs 0";
    return;
  }

  let total = 0;

  cart.forEach((item,index)=>{

    total += item.price * item.qty;

    cartItems.innerHTML += `
      <div class="cart-item">

        <img src="${item.image}" alt="${item.name}">

        <div class="cart-details">

          <h4>${item.name}</h4>

          <p>Rs ${Number(item.price).toLocaleString()}</p>

          <div class="qty-box">

            <button onclick="decreaseQty(${index})">-</button>
            <span>${item.qty}</span>
            <button onclick="increaseQty(${index})">+</button>

          </div>

        </div>

        <button class="remove-btn" onclick="removeItem(${index})">✕</button>

      </div>
    `;
  });

  cartTotal.innerText = "Total: Rs " + total.toLocaleString();
}

/* =========================
   CART ACTIONS
========================= */
function removeItem(i){
  cart.splice(i,1);
  saveCart();
}

function increaseQty(i){
  cart[i].qty++;
  saveCart();
}

function decreaseQty(i){
  if(cart[i].qty > 1){
    cart[i].qty--;
  } else {
    cart.splice(i,1);
  }
  saveCart();
}

function clearCart(){
  cart = [];
  saveCart();
}

/* =========================
   CHECKOUT (WHATSAPP FIXED)
========================= */
function checkout(){

  if(cart.length === 0){
    alert("Cart is empty!");
    return;
  }

  let name = document.getElementById("name").value.trim();
  let phone = document.getElementById("phone").value.trim();
  let district = document.getElementById("district").value.trim();
  let address = document.getElementById("address").value.trim();

  if(!name || !phone || !district || !address){
    alert("Fill all details!");
    return;
  }

  let orderID = "FR-" + Date.now();

  let itemsText = "";
  let subtotal = 0;

  cart.forEach((item,i)=>{
    let t = item.price * item.qty;
    subtotal += t;
    itemsText += `${i+1}) ${item.name} x${item.qty} = Rs ${t}\n`;
  });

  let delivery = 350;
  let total = subtotal + delivery;

  let message = `🟢 FRESHORA ORDER

Order ID: ${orderID}

Name: ${name}
Phone: ${phone}
District: ${district}
Address: ${address}

ITEMS:
${itemsText}

Subtotal: Rs ${subtotal}
Delivery: Rs ${delivery}
TOTAL: Rs ${total}`;

  let whatsapp = "94752425790";

  window.open(
    `https://wa.me/${whatsapp}?text=${encodeURIComponent(message)}`,
    "_blank"
  );

  cart = [];
  saveCart();
}

/* INIT */
renderCart();

</script>

</body>
</html>
