<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Freshora Admin Login</title>

<link rel="stylesheet" href="login.css">

</head>

<body class="login-body">

  <!-- =========================
       LOGIN CONTAINER
  ========================= -->
  <div class="login-container">

    <!-- LOGO -->
    <div class="login-logo">
      Freshora
    </div>

    <!-- TITLE -->
    <h2>
      Admin Login
    </h2>

    <p class="login-subtitle">
      Secure access to Freshora dashboard
    </p>

    <!-- FORM -->
    <div class="login-form">

      <!-- EMAIL -->
      <input
        type="email"
        id="email"
        placeholder="Admin Email"
        autocomplete="email"
      >

      <!-- PASSWORD -->
      <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
      >

      <!-- LOGIN BUTTON -->
      <button onclick="login()"
              class="login-btn">

        Login

      </button>

      <!-- ERROR -->
      <p id="errorText"
         class="error-text"></p>

    </div>

    <!-- BACK -->
    <a href="index.html"
       class="back-home">

      ← Back to Store

    </a>

  </div>

  <!-- =========================
       LOGIN SCRIPT
  ========================= -->
  <script type="module"
          src="login.js"></script>

</body>
</html>
