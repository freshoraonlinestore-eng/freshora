<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Professional Image Studio</title>

    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0b0b0e;
            color: #e8e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1a20;
        }
        ::-webkit-scrollbar-thumb {
            background: #4a4a5a;
            border-radius: 8px;
        }

        /* ===== TOAST CONTAINER ===== */
        #toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 360px;
            width: 100%;
            pointer-events: none;
        }
        .toast {
            background: #1e1e28;
            border-left: 4px solid #7c7cf8;
            padding: 14px 20px;
            border-radius: 12px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7);
            color: #e8e8f0;
            font-size: 0.9rem;
            backdrop-filter: blur(12px);
            border: 1px solid #2e2e3a;
            animation: slideIn 0.35s ease-out;
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .toast.error {
            border-left-color: #f87c7c;
        }
        .toast.success {
            border-left-color: #7cf8a8;
        }
        .toast.info {
            border-left-color: #7cccf8;
        }
        .toast .toast-icon {
            font-size: 1.3rem;
        }
        .toast .toast-msg {
            flex: 1;
        }
        .toast .toast-close {
            background: none;
            border: none;
            color: #8888aa;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 0 4px;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* ===== HEADER ===== */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 24px;
            background: #0f0f14;
            border-bottom: 1px solid #1e1e28;
            flex-wrap: wrap;
            gap: 10px;
        }
        .app-header h1 {
            font-size: 1.2rem;
            font-weight: 600;
            background: linear-gradient(135deg, #a78bfa, #7c7cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }
        .header-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .header-actions button {
            background: #1a1a24;
            border: 1px solid #2a2a36;
            color: #c8c8e0;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .header-actions button:hover {
            background: #2a2a3a;
            border-color: #4a4a5e;
        }
        .header-actions button:active {
            transform: scale(0.95);
        }

        /* ===== MAIN LAYOUT ===== */
        .app-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 16px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        /* ===== TOOLBAR ===== */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            background: #12121a;
            padding: 10px 16px;
            border-radius: 16px;
            border: 1px solid #1e1e28;
            align-items: center;
            justify-content: center;
        }
        .toolbar .group-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #6a6a82;
            margin-right: 4px;
        }
        .toolbar button,
        .toolbar label {
            background: #1a1a26;
            border: 1px solid #28283a;
            color: #d0d0e8;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }
        .toolbar button:hover,
        .toolbar label:hover {
            background: #2a2a3e;
            border-color: #4a4a62;
        }
        .toolbar button:active {
            transform: scale(0.95);
        }
        .toolbar button.active {
            background: #3a3a5e;
            border-color: #7c7cf8;
            color: #fff;
        }
        .toolbar input[type="range"] {
            width: 80px;
            accent-color: #7c7cf8;
            background: #1a1a26;
            height: 4px;
            border-radius: 4px;
            cursor: pointer;
        }
        .toolbar .range-group {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #0f0f18;
            padding: 4px 10px 4px 6px;
            border-radius: 8px;
            border: 1px solid #1e1e2a;
        }
        .toolbar .range-group span {
            font-size: 0.7rem;
            color: #8a8aaa;
            min-width: 28px;
            text-align: center;
        }
        .toolbar .sep {
            width: 1px;
            height: 28px;
            background: #1e1e2a;
            margin: 0 4px;
        }

        /* ===== CANVAS AREA ===== */
        .canvas-wrapper {
            flex: 1;
            background: #0a0a0e;
            border-radius: 16px;
            border: 1px solid #1a1a24;
            position: relative;
            overflow: hidden;
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .canvas-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            overflow: hidden;
            cursor: grab;
        }
        .canvas-container:active {
            cursor: grabbing;
        }

        #mainCanvas {
            max-width: 100%;
            max-height: 100%;
            display: block;
            image-rendering: auto;
            background: repeating-conic-gradient(#1a1a24 0% 25%, #22222e 0% 50%) 0 0 / 20px 20px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
            border-radius: 4px;
        }

        .drop-overlay {
            position: absolute;
            inset: 0;
            background: rgba(30, 30, 50, 0.85);
            backdrop-filter: blur(6px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 1.4rem;
            color: #aaaac8;
            border: 3px dashed #4a4a6a;
            border-radius: 16px;
            transition: 0.3s;
            pointer-events: none;
            opacity: 0;
        }
        .drop-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .drop-overlay .big-icon {
            font-size: 4rem;
        }

        /* ===== PROGRESS BAR ===== */
        .progress-container {
            width: 100%;
            height: 4px;
            background: #1a1a24;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 6px;
            display: none;
        }
        .progress-container.active {
            display: block;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #7c7cf8, #a78bfa);
            border-radius: 4px;
            transition: width 0.15s ease;
        }

        /* ===== STATUS BAR ===== */
        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #6a6a82;
            padding: 6px 12px;
            background: #0f0f16;
            border-radius: 12px;
            border: 1px solid #181820;
            flex-wrap: wrap;
            gap: 6px;
        }
        .status-bar .status-left {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }
        .status-bar .status-right {
            display: flex;
            gap: 12px;
        }
        .status-bar .badge {
            background: #1a1a28;
            padding: 2px 10px;
            border-radius: 20px;
            color: #9a9aba;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 720px) {
            .app-header h1 {
                font-size: 1rem;
            }
            .toolbar {
                gap: 4px;
                padding: 8px 10px;
            }
            .toolbar button,
            .toolbar label {
                font-size: 0.7rem;
                padding: 4px 8px;
            }
            .toolbar input[type="range"] {
                width: 56px;
            }
            .toolbar .range-group span {
                min-width: 20px;
                font-size: 0.6rem;
            }
            .app-main {
                padding: 8px;
                gap: 10px;
            }
            .canvas-wrapper {
                min-height: 280px;
            }
            .status-bar {
                font-size: 0.65rem;
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
            }
            #toast-container {
                top: 10px;
                right: 10px;
                max-width: 280px;
            }
            .toast {
                font-size: 0.8rem;
                padding: 10px 14px;
            }
            .header-actions button {
                font-size: 0.7rem;
                padding: 4px 10px;
            }
            .drop-overlay .big-icon {
                font-size: 2.8rem;
            }
        }

        @media (max-width: 480px) {
            .app-header {
                padding: 10px 14px;
            }
            .toolbar .group-label {
                display: none;
            }
            .toolbar .sep {
                margin: 0 2px;
            }
        }

        /* ===== HIDDEN FILE INPUT ===== */
        #fileInput,
        #cameraInput {
            display: none;
        }

        /* ===== LOADING SPINNER (inline) ===== */
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #3a3a52;
            border-top-color: #7c7cf8;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== COMPARE SLIDER ===== */
        .compare-container {
            position: relative;
            overflow: hidden;
            border-radius: 4px;
        }
        .compare-container .compare-before,
        .compare-container .compare-after {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .compare-container .compare-after {
            clip-path: inset(0 50% 0 0);
        }
        .compare-handle {
            position: absolute;
            top: 0;
            left: 50%;
            width: 4px;
            height: 100%;
            background: #fff;
            cursor: ew-resize;
            transform: translateX(-50%);
            z-index: 5;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.6);
        }
        .compare-handle::after {
            content: '⟷';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1a1a2a;
            color: #fff;
            border-radius: 50%;
            padding: 4px 6px;
            font-size: 0.8rem;
            border: 1px solid #3a3a5a;
        }
    </style>
</head>
<body>

    <!-- ===== TOAST CONTAINER ===== -->
    <div id="toast-container"></div>

    <!-- ===== HEADER ===== -->
    <header class="app-header">
        <h1>🖼️ Image Studio</h1>
        <div class="header-actions">
            <button id="uploadBtn" title="Upload Image">📤 Upload</button>
            <button id="cameraBtn" title="Take Photo">📷 Camera</button>
            <button id="resetBtn" title="Reset View">🔄 Reset</button>
        </div>
    </header>

    <!-- ===== MAIN ===== -->
    <main class="app-main">

        <!-- Toolbar -->
        <div class="toolbar" id="toolbar">
            <!-- File ops -->
            <button id="savePngBtn">💾 PNG</button>
            <button id="saveJpgBtn">💾 JPG</button>
            <button id="saveWebpBtn">💾 WEBP</button>

            <span class="sep"></span>

            <!-- Undo / Redo -->
            <button id="undoBtn">↩️ Undo</button>
            <button id="redoBtn">↪️ Redo</button>

            <span class="sep"></span>

            <!-- Crop -->
            <button id="cropBtn" title="Crop (drag on canvas)">✂️ Crop</button>

            <!-- Rotate / Flip -->
            <button id="rotateLeftBtn">↺</button>
            <button id="rotateRightBtn">↻</button>
            <button id="flipHBtn">⇔</button>
            <button id="flipVBtn">⇕</button>

            <span class="sep"></span>

            <!-- Compare -->
            <button id="compareBtn" title="Before / After">🔄 Compare</button>

            <!-- AI Actions (simulated) -->
            <button id="bgRemoveBtn" title="Remove Background (AI)">🧹 BG Remove</button>
            <button id="upscaleBtn" title="4K Upscale (AI)">🚀 4K</button>

            <span class="sep"></span>

            <!-- Adjustments -->
            <div class="range-group">
                <span>☀️</span>
                <input type="range" id="brightnessSlider" min="-100" max="100" value="0" />
                <span id="brightnessVal">0</span>
            </div>
            <div class="range-group">
                <span>🔲</span>
                <input type="range" id="contrastSlider" min="-100" max="100" value="0" />
                <span id="contrastVal">0</span>
            </div>
            <div class="range-group">
                <span>🎨</span>
                <input type="range" id="saturationSlider" min="-100" max="100" value="0" />
                <span id="saturationVal">0</span>
            </div>
        </div>

        <!-- Canvas -->
        <div class="canvas-wrapper" id="canvasWrapper">
            <div class="canvas-container" id="canvasContainer">
                <canvas id="mainCanvas"></canvas>
            </div>
            <div class="drop-overlay" id="dropOverlay">
                <span class="big-icon">📂</span>
                <span>Drop your image here</span>
                <span style="font-size:0.9rem;color:#6a6a82;">or click Upload</span>
            </div>
        </div>

        <!-- Progress -->
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <!-- Status -->
        <div class="status-bar">
            <div class="status-left">
                <span id="statusName">No image loaded</span>
                <span class="badge" id="statusSize">-</span>
                <span class="badge" id="statusZoom">100%</span>
            </div>
            <div class="status-right">
                <span id="statusHistory">📜 0 / 0</span>
                <span id="statusCompare" style="display:none;">🔁 Compare mode</span>
            </div>
        </div>
    </main>

    <!-- ===== HIDDEN INPUTS ===== -->
    <input type="file" id="fileInput" accept="image/*" />
    <input type="file" id="cameraInput" accept="image/*" capture="environment" />

    <script>
        (function() {
            'use strict';

            // ============================================================
            //  STATE
            // ============================================================
            const state = {
                originalImage: null, // original loaded image (ImageData or canvas)
                currentCanvas: null, // the main canvas element
                ctx: null,
                history: [], // array of ImageData
                historyIndex: -1,
                maxHistory: 30,

                // zoom / pan
                zoom: 1,
                panX: 0,
                panY: 0,
                isDragging: false,
                dragStartX: 0,
                dragStartY: 0,
                dragPanX: 0,
                dragPanY: 0,

                // crop
                isCropMode: false,
                cropStartX: 0,
                cropStartY: 0,
                cropEndX: 0,
                cropEndY: 0,
                isCropping: false,

                // compare
                compareMode: false,
                compareImage: null, // original image data for before

                // adjustments
                brightness: 0,
                contrast: 0,
                saturation: 0,

                // file
                fileName: 'image',
                fileType: 'png',

                // flags
                hasImage: false,
                isProcessing: false,
            };

            // ============================================================
            //  DOM REFS
            // ============================================================
            const canvas = document.getElementById('mainCanvas');
            const ctx = canvas.getContext('2d');
            state.canvas = canvas;
            state.ctx = ctx;

            const container = document.getElementById('canvasContainer');
            const wrapper = document.getElementById('canvasWrapper');
            const dropOverlay = document.getElementById('dropOverlay');
            const fileInput = document.getElementById('fileInput');
            const cameraInput = document.getElementById('cameraInput');

            // Status
            const statusName = document.getElementById('statusName');
            const statusSize = document.getElementById('statusSize');
            const statusZoom = document.getElementById('statusZoom');
            const statusHistory = document.getElementById('statusHistory');
            const statusCompare = document.getElementById('statusCompare');

            // Progress
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');

            // Sliders
            const brightnessSlider = document.getElementById('brightnessSlider');
            const contrastSlider = document.getElementById('contrastSlider');
            const saturationSlider = document.getElementById('saturationSlider');
            const brightnessVal = document.getElementById('brightnessVal');
            const contrastVal = document.getElementById('contrastVal');
            const saturationVal = document.getElementById('saturationVal');

            // ============================================================
            //  TOAST SYSTEM
            // ============================================================
            function showToast(msg, type = 'info', duration = 3000) {
                const container = document.getElementById('toast-container');
                const icons = { info: 'ℹ️', success: '✅', error: '❌' };
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                toast.innerHTML = `
                    <span class="toast-icon">${icons[type] || 'ℹ️'}</span>
                    <span class="toast-msg">${msg}</span>
                    <button class="toast-close">✕</button>
                `;
                toast.querySelector('.toast-close').addEventListener('click', () => {
                    toast.remove();
                });
                container.appendChild(toast);
                setTimeout(() => {
                    if (toast.parentNode) toast.remove();
                }, duration);
            }

            // ============================================================
            //  PROGRESS
            // ============================================================
            function setProgress(pct) {
                if (pct >= 0 && pct <= 100) {
                    progressContainer.classList.add('active');
                    progressBar.style.width = pct + '%';
                } else {
                    progressContainer.classList.remove('active');
                    progressBar.style.width = '0%';
                }
            }

            // ============================================================
            //  IMAGE LOADING
            // ============================================================
            function loadImageFromFile(file) {
                if (!file || !file.type.startsWith('image/')) {
                    showToast('Please select a valid image file.', 'error');
                    return;
                }
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        initImage(img, file.name);
                    };
                    img.onerror = () => {
                        showToast('Failed to decode image.', 'error');
                    };
                    img.src = e.target.result;
                };
                reader.onerror = () => {
                    showToast('Failed to read file.', 'error');
                };
                reader.readAsDataURL(file);
            }

            function initImage(img, name = 'image') {
                state.fileName = name.replace(/\.[^.]+$/, '') || 'image';
                state.fileType = (name.match(/\.([^.]+)$/) || [])[1]?.toLowerCase() || 'png';

                const w = img.naturalWidth || img.width;
                const h = img.naturalHeight || img.height;

                // Resize canvas to fit viewport
                const maxW = wrapper.clientWidth - 40;
                const maxH = wrapper.clientHeight - 40;
                let displayW = w;
                let displayH = h;
                if (displayW > maxW || displayH > maxH) {
                    const ratio = Math.min(maxW / displayW, maxH / displayH);
                    displayW = Math.round(displayW * ratio);
                    displayH = Math.round(displayH * ratio);
                }

                canvas.width = w;
                canvas.height = h;
                canvas.style.width = displayW + 'px';
                canvas.style.height = displayH + 'px';

                ctx.drawImage(img, 0, 0);

                state.hasImage = true;
                state.originalImage = ctx.getImageData(0, 0, w, h);

                // Reset history
                state.history = [];
                state.historyIndex = -1;
                pushHistory();

                // Reset adjustments
                brightnessSlider.value = 0;
                contrastSlider.value = 0;
                saturationSlider.value = 0;
                brightnessVal.textContent = '0';
                contrastVal.textContent = '0';
                saturationVal.textContent = '0';
                state.brightness = 0;
                state.contrast = 0;
                state.saturation = 0;

                // Reset zoom/pan
                state.zoom = 1;
                state.panX = 0;
                state.panY = 0;
                state.compareMode = false;
                state.compareImage = null;
                statusCompare.style.display = 'none';

                updateStatus();
                applyAdjustments();
                showToast(`Loaded: ${name} (${w}×${h})`, 'success');
                setProgress(-1);
                dropOverlay.classList.remove('show');
            }

            // ============================================================
            //  HISTORY (UNDO / REDO)
            // ============================================================
            function pushHistory() {
                if (!state.hasImage) return;
                const data = ctx.getImageData(0, 0, canvas.width, canvas.height);
                // Remove any future states
                state.history = state.history.slice(0, state.historyIndex + 1);
                state.history.push(data);
                if (state.history.length > state.maxHistory) {
                    state.history.shift();
                }
                state.historyIndex = state.history.length - 1;
                updateStatus();
            }

            function undo() {
                if (state.historyIndex > 0 && state.history.length > 0) {
                    state.historyIndex--;
                    restoreHistory(state.historyIndex);
                    updateStatus();
                    showToast('Undo', 'info');
                } else {
                    showToast('Nothing to undo.', 'info');
                }
            }

            function redo() {
                if (state.historyIndex < state.history.length - 1) {
                    state.historyIndex++;
                    restoreHistory(state.historyIndex);
                    updateStatus();
                    showToast('Redo', 'info');
                } else {
                    showToast('Nothing to redo.', 'info');
                }
            }

            function restoreHistory(index) {
                const data = state.history[index];
                if (!data) return;
                ctx.putImageData(data, 0, 0);
                // update adjustments sliders to match? We'll keep them as is.
                // Better: we store adjustment values in history too? For simplicity, we re-apply.
                // But we want to keep it simple: just restore pixels.
                // We'll re-apply adjustments if any.
                applyAdjustments();
            }

            function updateStatus() {
                if (!state.hasImage) {
                    statusName.textContent = 'No image loaded';
                    statusSize.textContent = '-';
                    statusZoom.textContent = '100%';
                    statusHistory.textContent = '📜 0 / 0';
                    return;
                }
                const w = canvas.width;
                const h = canvas.height;
                statusName.textContent = state.fileName;
                statusSize.textContent = `${w}×${h}`;
                statusZoom.textContent = Math.round(state.zoom * 100) + '%';
                statusHistory.textContent = `📜 ${state.historyIndex + 1} / ${state.history.length}`;
            }

            // ============================================================
            //  ADJUSTMENTS (Brightness, Contrast, Saturation)
            // ============================================================
            function applyAdjustments() {
                if (!state.hasImage) return;
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imageData.data;
                const b = state.brightness / 100; // -1..1
                const c = state.contrast / 100; // -1..1
                const s = state.saturation / 100; // -1..1

                // contrast factor
                const contrastFactor = c >= 0 ? 1 / (1 - c) : 1 + c;

                for (let i = 0; i < data.length; i += 4) {
                    let r = data[i];
                    let g = data[i + 1];
                    let b2 = data[i + 2];

                    // Brightness
                    r = r + b * 128;
                    g = g + b * 128;
                    b2 = b2 + b * 128;

                    // Contrast
                    r = (r - 128) * contrastFactor + 128;
                    g = (g - 128) * contrastFactor + 128;
                    b2 = (b2 - 128) * contrastFactor + 128;

                    // Saturation
                    const gray = 0.299 * r + 0.587 * g + 0.114 * b2;
                    r = gray + (r - gray) * (1 + s);
                    g = gray + (g - gray) * (1 + s);
                    b2 = gray + (b2 - gray) * (1 + s);

                    data[i] = Math.min(255, Math.max(0, r));
                    data[i + 1] = Math.min(255, Math.max(0, g));
                    data[i + 2] = Math.min(255, Math.max(0, b2));
                }
                ctx.putImageData(imageData, 0, 0);
                // Don't push history here - we use a different mechanism.
            }

            function refreshWithAdjustments() {
                if (!state.hasImage) return;
                // Restore from original, then apply adjustments
                const orig = state.history[0];
                if (orig) {
                    ctx.putImageData(orig, 0, 0);
                    applyAdjustments();
                }
            }

            // Slider events
            brightnessSlider.addEventListener('input', () => {
                state.brightness = parseInt(brightnessSlider.value);
                brightnessVal.textContent = state.brightness;
                refreshWithAdjustments();
            });
            contrastSlider.addEventListener('input', () => {
                state.contrast = parseInt(contrastSlider.value);
                contrastVal.textContent = state.contrast;
                refreshWithAdjustments();
            });
            saturationSlider.addEventListener('input', () => {
                state.saturation = parseInt(saturationSlider.value);
                saturationVal.textContent = state.saturation;
                refreshWithAdjustments();
            });

            // ============================================================
            //  ROTATE / FLIP
            // ============================================================
            function rotate(angle) {
                if (!state.hasImage) return;
                const w = canvas.width;
                const h = canvas.height;
                const tempCanvas = document.createElement('canvas');
                const tempCtx = tempCanvas.getContext('2d');
                tempCanvas.width = w;
                tempCanvas.height = h;
                tempCtx.drawImage(canvas, 0, 0);

                canvas.width = h;
                canvas.height = w;
                ctx.translate(h / 2, w / 2);
                ctx.rotate(angle * Math.PI / 180);
                ctx.drawImage(tempCanvas, -w / 2, -h / 2);
                ctx.setTransform(1, 0, 0, 1, 0, 0);

                // Fix canvas display size
                fitCanvasToView();

                pushHistory();
                updateStatus();
                showToast(`Rotated ${angle}°`, 'info');
            }

            function flip(horizontal) {
                if (!state.hasImage) return;
                const tempCanvas = document.createElement('canvas');
                const tempCtx = tempCanvas.getContext('2d');
                tempCanvas.width = canvas.width;
                tempCanvas.height = canvas.height;
                tempCtx.drawImage(canvas, 0, 0);

                ctx.setTransform(1, 0, 0, 1, 0, 0);
                if (horizontal) {
                    ctx.scale(-1, 1);
                    ctx.drawImage(tempCanvas, -canvas.width, 0);
                } else {
                    ctx.scale(1, -1);
                    ctx.drawImage(tempCanvas, 0, -canvas.height);
                }
                ctx.setTransform(1, 0, 0, 1, 0, 0);

                pushHistory();
                updateStatus();
                showToast(horizontal ? 'Flipped Horizontal' : 'Flipped Vertical', 'info');
            }

            function fitCanvasToView() {
                const w = canvas.width;
                const h = canvas.height;
                const maxW = wrapper.clientWidth - 40;
                const maxH = wrapper.clientHeight - 40;
                let displayW = w;
                let displayH = h;
                if (displayW > maxW || displayH > maxH) {
                    const ratio = Math.min(maxW / displayW, maxH / displayH);
                    displayW = Math.round(displayW * ratio);
                    displayH = Math.round(displayH * ratio);
                }
                canvas.style.width = displayW + 'px';
                canvas.style.height = displayH + 'px';
                state.zoom = 1;
                state.panX = 0;
                state.panY = 0;
                updateStatus();
            }

            // ============================================================
            //  CROP (drag on canvas)
            // ============================================================
            let cropMode = false;
            let cropRect = { x1: 0, y1: 0, x2: 0, y2: 0, active: false };

            function enableCropMode() {
                if (!state.hasImage) {
                    showToast('Load an image first.', 'error');
                    return;
                }
                cropMode = !cropMode;
                document.getElementById('cropBtn').classList.toggle('active', cropMode);
                if (cropMode) {
                    canvas.style.cursor = 'crosshair';
                    showToast('Drag on canvas to select crop area.', 'info');
                } else {
                    canvas.style.cursor = 'grab';
                    cropRect.active = false;
                    // redraw
                    refreshWithAdjustments();
                }
            }

            // Mouse / Touch events for crop
            function getCanvasCoords(e) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                let clientX, clientY;
                if (e.touches) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                    e.preventDefault();
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }
                const x = (clientX - rect.left) * scaleX;
                const y = (clientY - rect.top) * scaleY;
                return { x: Math.min(canvas.width, Math.max(0, x)), y: Math.min(canvas.height, Math.max(0, y)) };
            }

            function onPointerDown(e) {
                if (!cropMode) return;
                const pos = getCanvasCoords(e);
                cropRect.x1 = pos.x;
                cropRect.y1 = pos.y;
                cropRect.x2 = pos.x;
                cropRect.y2 = pos.y;
                cropRect.active = true;
                state.isCropping = true;
            }

            function onPointerMove(e) {
                if (!cropMode || !cropRect.active) return;
                const pos = getCanvasCoords(e);
                cropRect.x2 = pos.x;
                cropRect.y2 = pos.y;
                drawCropOverlay();
            }

            function onPointerUp(e) {
                if (!cropMode || !cropRect.active) return;
                cropRect.active = false;
                state.isCropping = false;
                // perform crop
                const x1 = Math.min(cropRect.x1, cropRect.x2);
                const y1 = Math.min(cropRect.y1, cropRect.y2);
                const x2 = Math.max(cropRect.x1, cropRect.x2);
                const y2 = Math.max(cropRect.y1, cropRect.y2);
                const w = x2 - x1;
                const h = y2 - y1;
                if (w > 5 && h > 5) {
                    const imageData = ctx.getImageData(x1, y1, w, h);
                    canvas.width = w;
                    canvas.height = h;
                    ctx.putImageData(imageData, 0, 0);
                    fitCanvasToView();
                    pushHistory();
                    updateStatus();
                    showToast(`Cropped to ${Math.round(w)}×${Math.round(h)}`, 'success');
                } else {
                    showToast('Crop area too small.', 'info');
                }
                cropMode = false;
                document.getElementById('cropBtn').classList.remove('active');
                canvas.style.cursor = 'grab';
                refreshWithAdjustments();
            }

            function drawCropOverlay() {
                if (!cropRect.active) return;
                const x1 = Math.min(cropRect.x1, cropRect.x2);
                const y1 = Math.min(cropRect.y1, cropRect.y2);
                const x2 = Math.max(cropRect.x1, cropRect.x2);
                const y2 = Math.max(cropRect.y1, cropRect.y2);
                // Draw a semi-transparent overlay
                const tempData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.clearRect(x1, y1, x2 - x1, y2 - y1);
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.setLineDash([6, 4]);
                ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
                ctx.setLineDash([]);
                // Restore the image underneath? Actually we want to keep the image visible inside crop area.
                // Better: draw image first then overlay. Simpler: use global composite.
                // We'll just draw a dark overlay with clear rect.
                // To show image inside, we need to draw image data.
                // Let's do it differently: draw image, then overlay.
                // We'll use a temp canvas.
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = canvas.width;
                tempCanvas.height = canvas.height;
                const tCtx = tempCanvas.getContext('2d');
                tCtx.drawImage(canvas, 0, 0);
                // Now draw on main
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(tempCanvas, 0, 0);
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.clearRect(x1, y1, x2 - x1, y2 - y1);
                ctx.drawImage(tempCanvas, x1, y1, x2 - x1, y2 - y1, x1, y1, x2 - x1, y2 - y1);
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.setLineDash([6, 4]);
                ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
                ctx.setLineDash([]);
            }

            // ============================================================
            //  ZOOM & PAN (mouse drag)
            // ============================================================
            function setupZoomPan() {
                let isDragging = false;
                let startX = 0,
                    startY = 0;
                let startPanX = 0,
                    startPanY = 0;

                canvas.addEventListener('mousedown', (e) => {
                    if (cropMode) return;
                    isDragging = true;
                    startX = e.clientX;
                    startY = e.clientY;
                    startPanX = state.panX;
                    startPanY = state.panY;
                    canvas.style.cursor = 'grabbing';
                });

                window.addEventListener('mousemove', (e) => {
                    if (!isDragging || cropMode) return;
                    const dx = e.clientX - startX;
                    const dy = e.clientY - startY;
                    state.panX = startPanX + dx;
                    state.panY = startPanY + dy;
                    applyTransform();
                });

                window.addEventListener('mouseup', () => {
                    if (isDragging) {
                        isDragging = false;
                        canvas.style.cursor = 'grab';
                    }
                });

                // Touch
                let touchStartX = 0,
                    touchStartY = 0;
                let touchPanX = 0,
                    touchPanY = 0;
                let lastTouchDist = 0;

                canvas.addEventListener('touchstart', (e) => {
                    if (cropMode) return;
                    if (e.touches.length === 1) {
                        const t = e.touches[0];
                        touchStartX = t.clientX;
                        touchStartY = t.clientY;
                        touchPanX = state.panX;
                        touchPanY = state.panY;
                        state.isDragging = true;
                    } else if (e.touches.length === 2) {
                        const t1 = e.touches[0];
                        const t2 = e.touches[1];
                        lastTouchDist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
                    }
                    e.preventDefault();
                }, { passive: false });

                canvas.addEventListener('touchmove', (e) => {
                    if (cropMode) return;
                    if (e.touches.length === 1 && state.isDragging) {
                        const t = e.touches[0];
                        const dx = t.clientX - touchStartX;
                        const dy = t.clientY - touchStartY;
                        state.panX = touchPanX + dx;
                        state.panY = touchPanY + dy;
                        applyTransform();
                    } else if (e.touches.length === 2) {
                        const t1 = e.touches[0];
                        const t2 = e.touches[1];
                        const dist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
                        if (lastTouchDist > 0) {
                            const delta = dist / lastTouchDist;
                            state.zoom = Math.min(5, Math.max(0.2, state.zoom * delta));
                            applyTransform();
                            updateStatus();
                        }
                        lastTouchDist = dist;
                    }
                    e.preventDefault();
                }, { passive: false });

                canvas.addEventListener('touchend', (e) => {
                    state.isDragging = false;
                    lastTouchDist = 0;
                });
            }

            function applyTransform() {
                if (!state.hasImage) return;
                const w = canvas.width;
                const h = canvas.height;
                const rect = canvas.getBoundingClientRect();
                const displayW = rect.width;
                const displayH = rect.height;
                const scaleX = displayW / w;
                const scaleY = displayH / h;
                const baseScale = Math.min(scaleX, scaleY);

                // Apply zoom and pan
                const zoomedW = w * state.zoom * baseScale;
                const zoomedH = h * state.zoom * baseScale;
                const offsetX = (displayW - zoomedW) / 2 + state.panX;
                const offsetY = (displayH - zoomedH) / 2 + state.panY;

                canvas.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${state.zoom})`;
                canvas.style.transformOrigin = '0 0';
                updateStatus();
            }

            function resetView() {
                state.zoom = 1;
                state.panX = 0;
                state.panY = 0;
                applyTransform();
                updateStatus();
                showToast('View reset', 'info');
            }

            // ============================================================
            //  COMPARE (Before / After)
            // ============================================================
            function toggleCompare() {
                if (!state.hasImage) {
                    showToast('Load an image first.', 'error');
                    return;
                }
                state.compareMode = !state.compareMode;
                if (state.compareMode) {
                    // Save current state as "before"
                    state.compareImage = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    statusCompare.style.display = 'inline';
                    showToast('Compare mode: drag slider', 'info');
                } else {
                    state.compareImage = null;
                    statusCompare.style.display = 'none';
                    refreshWithAdjustments();
                }
                // Redraw
                drawCompare();
            }

            function drawCompare() {
                if (!state.compareMode || !state.compareImage) {
                    refreshWithAdjustments();
                    return;
                }
                // Draw the "before" image on the canvas, then overlay "after" with clip
                const w = canvas.width;
                const h = canvas.height;
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = w;
                tempCanvas.height = h;
                const tCtx = tempCanvas.getContext('2d');
                tCtx.putImageData(state.compareImage, 0, 0);
                // Draw adjustments on after
                // We need to apply adjustments to current state
                const currentData = ctx.getImageData(0, 0, w, h);
                // We'll draw both
                ctx.clearRect(0, 0, w, h);
                ctx.drawImage(tempCanvas, 0, 0); // before
                // Now draw after on right half
                // We'll use a clip
                ctx.save();
                const midX = w * 0.5;
                ctx.beginPath();
                ctx.rect(midX, 0, w - midX, h);
                ctx.clip();
                ctx.putImageData(currentData, 0, 0);
                ctx.restore();
                // Draw divider
                ctx.beginPath();
                ctx.moveTo(midX, 0);
                ctx.lineTo(midX, h);
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.setLineDash([6, 4]);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // ============================================================
            //  AI FUNCTIONS (Simulated)
            // ============================================================
            function removeBackground() {
                if (!state.hasImage) {
                    showToast('Load an image first.', 'error');
                    return;
                }
                showToast('🧹 AI Background Removal started...', 'info');
                setProgress(10);
                // Simulate processing
                let pct = 10;
                const interval = setInterval(() => {
                    pct += 10;
                    setProgress(Math.min(90, pct));
                    if (pct >= 90) {
                        clearInterval(interval);
                        // Simulate: make a crude "remove background" by making green/blue-ish areas transparent?
                        // For demo, we just desaturate and increase contrast to simulate.
                        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        const data = imageData.data;
                        for (let i = 0; i < data.length; i += 4) {
                            const r = data[i];
                            const g = data[i + 1];
                            const b = data[i + 2];
                            // Simple "chroma key" like: if color is in a range, make transparent
                            // Not real AI, just demo.
                            if (r > 80 && g > 100 && b < 100) {
                                data[i + 3] = 0;
                            }
                        }
                        ctx.putImageData(imageData, 0, 0);
                        pushHistory();
                        setProgress(100);
                        setTimeout(() => setProgress(-1), 500);
                        showToast('✅ Background removed (simulated)', 'success');
                    }
                }, 200);
            }

            function upscale4K() {
                if (!state.hasImage) {
                    showToast('Load an image first.', 'error');
                    return;
                }
                showToast('🚀 AI 4K Upscale started...', 'info');
                setProgress(10);
                let pct = 10;
                const interval = setInterval(() => {
                    pct += 10;
                    setProgress(Math.min(90, pct));
                    if (pct >= 90) {
                        clearInterval(interval);
                        // Simulate upscale: double size using nearest-neighbor (just for demo)
                        const w = canvas.width;
                        const h = canvas.height;
                        const newW = Math.min(w * 2, 4096);
                        const newH = Math.min(h * 2, 4096);
                        const tempCanvas = document.createElement('canvas');
                        tempCanvas.width = newW;
                        tempCanvas.height = newH;
                        const tCtx = tempCanvas.getContext('2d');
                        tCtx.imageSmoothingEnabled = false;
                        tCtx.drawImage(canvas, 0, 0, newW, newH);
                        canvas.width = newW;
                        canvas.height = newH;
                        ctx.drawImage(tempCanvas, 0, 0);
                        fitCanvasToView();
                        pushHistory();
                        setProgress(100);
                        setTimeout(() => setProgress(-1), 500);
                        updateStatus();
                        showToast(`✅ Upscaled to ${newW}×${newH} (simulated)`, 'success');
                    }
                }, 200);
            }

            // ============================================================
            //  DOWNLOAD
            // ============================================================
            function downloadImage(format) {
                if (!state.hasImage) {
                    showToast('Load an image first.', 'error');
                    return;
                }
                const mimeTypes = {
                    png: 'image/png',
                    jpg: 'image/jpeg',
                    webp: 'image/webp'
                };
                const ext = format.toLowerCase();
                const mime = mimeTypes[ext] || 'image/png';
                const quality = ext === 'jpg' ? 0.92 : ext === 'webp' ? 0.85 : undefined;
                const link = document.createElement('a');
                link.download = `${state.fileName}.${ext}`;
                link.href = canvas.toDataURL(mime, quality);
                link.click();
                showToast(`Downloaded as ${ext.toUpperCase()}`, 'success');
            }

            // ============================================================
            //  CAMERA
            // ============================================================
            function openCamera() {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    showToast('Camera not supported on this device.', 'error');
                    return;
                }
                cameraInput.click();
            }

            cameraInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    loadImageFromFile(file);
                }
                cameraInput.value = '';
            });

            // ============================================================
            //  DRAG & DROP
            // ============================================================
            function setupDrop() {
                let counter = 0;

                document.addEventListener('dragover', (e) => {
                    e.preventDefault();
                });
                document.addEventListener('drop', (e) => {
                    e.preventDefault();
                });

                wrapper.addEventListener('dragenter', (e) => {
                    e.preventDefault();
                    counter++;
                    dropOverlay.classList.add('show');
                });

                wrapper.addEventListener('dragover', (e) => {
                    e.preventDefault();
                });

                wrapper.addEventListener('dragleave', (e) => {
                    e.preventDefault();
                    counter--;
                    if (counter <= 0) {
                        counter = 0;
                        dropOverlay.classList.remove('show');
                    }
                });

                wrapper.addEventListener('drop', (e) => {
                    e.preventDefault();
                    counter = 0;
                    dropOverlay.classList.remove('show');
                    const files = e.dataTransfer.files;
                    if (files.length > 0) {
                        loadImageFromFile(files[0]);
                    }
                });
            }

            // ============================================================
            //  WINDOW RESIZE
            // ============================================================
            function handleResize() {
                if (state.hasImage) {
                    fitCanvasToView();
                    applyTransform();
                }
            }

            // ============================================================
            //  INIT
            // ============================================================
            function init() {
                // Upload
                document.getElementById('uploadBtn').addEventListener('click', () => fileInput.click());
                fileInput.addEventListener('change', (e) => {
                    if (e.target.files[0]) {
                        loadImageFromFile(e.target.files[0]);
                    }
                    fileInput.value = '';
                });

                // Camera
                document.getElementById('cameraBtn').addEventListener('click', openCamera);

                // Reset
                document.getElementById('resetBtn').addEventListener('click', resetView);

                // Save
                document.getElementById('savePngBtn').addEventListener('click', () => downloadImage('png'));
                document.getElementById('saveJpgBtn').addEventListener('click', () => downloadImage('jpg'));
                document.getElementById('saveWebpBtn').addEventListener('click', () => downloadImage('webp'));

                // Undo / Redo
                document.getElementById('undoBtn').addEventListener('click', undo);
                document.getElementById('redoBtn').addEventListener('click', redo);

                // Crop
                document.getElementById('cropBtn').addEventListener('click', enableCropMode);

                // Rotate / Flip
                document.getElementById('rotateLeftBtn').addEventListener('click', () => rotate(-90));
                document.getElementById('rotateRightBtn').addEventListener('click', () => rotate(90));
                document.getElementById('flipHBtn').addEventListener('click', () => flip(true));
                document.getElementById('flipVBtn').addEventListener('click', () => flip(false));

                // Compare
                document.getElementById('compareBtn').addEventListener('click', toggleCompare);

                // AI
                document.getElementById('bgRemoveBtn').addEventListener('click', removeBackground);
                document.getElementById('upscaleBtn').addEventListener('click', upscale4K);

                // Drop
                setupDrop();

                // Zoom/Pan
                setupZoomPan();

                // Resize
                window.addEventListener('resize', handleResize);

                // Mouse events for crop
                canvas.addEventListener('mousedown', onPointerDown);
                canvas.addEventListener('mousemove', onPointerMove);
                canvas.addEventListener('mouseup', onPointerUp);
                canvas.addEventListener('mouseleave', onPointerUp);
                canvas.addEventListener('touchstart', onPointerDown, { passive: false });
                canvas.addEventListener('touchmove', onPointerMove, { passive: false });
                canvas.addEventListener('touchend', onPointerUp, { passive: false });

                // Keyboard shortcuts
                document.addEventListener('keydown', (e) => {
                    if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
                        e.preventDefault();
                        if (e.shiftKey) redo();
                        else undo();
                    }
                    if (e.key === 'r' && (e.ctrlKey || e.metaKey)) {
                        e.preventDefault();
                        resetView();
                    }
                });

                // Initial state
                updateStatus();
                showToast('🚀 Image Studio ready! Upload an image to start.', 'info', 4000);

                // Load a default demo image? We'll leave empty.
            }

            // Override pushHistory to also handle compare mode
            const origPush = pushHistory;
            pushHistory = function() {
                origPush();
                if (state.compareMode) {
                    state.compareImage = ctx.getImageData(0, 0, canvas.width, canvas.height);
                }
                updateStatus();
            };

            // Override refreshWithAdjustments to handle compare
            const origRefresh = refreshWithAdjustments;
            refreshWithAdjustments = function() {
                if (state.compareMode) {
                    drawCompare();
                } else {
                    origRefresh();
                }
            };

            // Start
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>

</body>
</html>
