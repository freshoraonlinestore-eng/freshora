<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AI Watermark Remover & 4K Upscaler</title>

    <style>
        /* ============================================================
                   RESET & BASE
                   ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0b0b0e;
            color: #e8e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1a20;
        }
        ::-webkit-scrollbar-thumb {
            background: #4a4a5a;
            border-radius: 8px;
        }

        /* ============================================================
                   TOAST CONTAINER
                   ============================================================ */
        #toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 380px;
            width: 100%;
            pointer-events: none;
        }
        .toast {
            background: #1a1a28;
            border-left: 4px solid #7c7cf8;
            padding: 14px 20px;
            border-radius: 14px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.8);
            color: #e8e8f0;
            font-size: 0.9rem;
            backdrop-filter: blur(14px);
            border: 1px solid #2e2e3e;
            animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .toast.error {
            border-left-color: #f87c7c;
        }
        .toast.success {
            border-left-color: #7cf8a8;
        }
        .toast.info {
            border-left-color: #7cccf8;
        }
        .toast.warning {
            border-left-color: #f8d07c;
        }
        .toast .toast-icon {
            font-size: 1.4rem;
            flex-shrink: 0;
        }
        .toast .toast-msg {
            flex: 1;
            line-height: 1.4;
        }
        .toast .toast-close {
            background: none;
            border: none;
            color: #8888aa;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 0 4px;
            transition: 0.2s;
        }
        .toast .toast-close:hover {
            color: #fff;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(60px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }

        /* ============================================================
                   HEADER
                   ============================================================ */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 28px;
            background: linear-gradient(135deg, #0f0f16 0%, #1a0f2a 100%);
            border-bottom: 1px solid #2a1a3a;
            flex-wrap: wrap;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(12px);
        }
        .app-header .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .app-header .logo-icon {
            font-size: 2rem;
            background: linear-gradient(135deg, #a78bfa, #7c7cf8);
            border-radius: 12px;
            padding: 6px 10px;
            line-height: 1;
        }
        .app-header h1 {
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #c4b5fd, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }
        .app-header .subtitle {
            font-size: 0.7rem;
            color: #8a7a9a;
            -webkit-text-fill-color: #8a7a9a;
            font-weight: 400;
            letter-spacing: 0.3px;
        }
        .header-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .header-actions button {
            background: rgba(26, 26, 40, 0.8);
            border: 1px solid #2a2a3e;
            color: #c8c8e0;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.25s;
            display: flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(4px);
        }
        .header-actions button:hover {
            background: rgba(42, 42, 62, 0.9);
            border-color: #5a5a7a;
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(124, 124, 248, 0.15);
        }
        .header-actions button:active {
            transform: scale(0.96);
        }
        .header-actions .primary-btn {
            background: linear-gradient(135deg, #5b5bf0, #7c7cf8);
            border-color: #7c7cf8;
            color: #fff;
            font-weight: 600;
        }
        .header-actions .primary-btn:hover {
            box-shadow: 0 4px 24px rgba(124, 124, 248, 0.35);
            border-color: #9a9aff;
        }

        /* ============================================================
                   MAIN LAYOUT
                   ============================================================ */
        .app-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 20px;
            max-width: 1440px;
            margin: 0 auto;
            width: 100%;
        }

        /* ============================================================
                   UPLOAD ZONE
                   ============================================================ */
        .upload-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            border: 2px dashed #2a2a3e;
            border-radius: 20px;
            background: radial-gradient(ellipse at center, #12121e, #0a0a0e);
            transition: 0.3s;
            min-height: 200px;
            gap: 16px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .upload-zone:hover {
            border-color: #4a4a6a;
            background: radial-gradient(ellipse at center, #18182a, #0a0a0e);
        }
        .upload-zone.dragover {
            border-color: #7c7cf8;
            background: radial-gradient(ellipse at center, #1a1a3a, #0a0a0e);
            box-shadow: inset 0 0 60px rgba(124, 124, 248, 0.05);
        }
        .upload-zone .big-icon {
            font-size: 4rem;
            opacity: 0.7;
        }
        .upload-zone h2 {
            font-size: 1.4rem;
            font-weight: 500;
            color: #c8c8e0;
        }
        .upload-zone p {
            color: #6a6a82;
            font-size: 0.9rem;
        }
        .upload-zone .upload-btn {
            background: linear-gradient(135deg, #5b5bf0, #7c7cf8);
            border: none;
            color: #fff;
            padding: 10px 28px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 8px;
        }
        .upload-zone .upload-btn:hover {
            transform: scale(1.04);
            box-shadow: 0 4px 24px rgba(124, 124, 248, 0.3);
        }
        .upload-zone .file-types {
            font-size: 0.7rem;
            color: #4a4a5a;
            margin-top: 4px;
        }

        /* ============================================================
                   IMAGE WORKSPACE
                   ============================================================ */
        .workspace {
            display: none;
            flex-direction: column;
            gap: 16px;
        }
        .workspace.active {
            display: flex;
        }

        .image-area {
            display: flex;
            flex-direction: row;
            gap: 16px;
            flex-wrap: wrap;
        }

        .canvas-wrapper {
            flex: 2;
            min-width: 300px;
            background: #0a0a0e;
            border-radius: 16px;
            border: 1px solid #1a1a24;
            position: relative;
            overflow: hidden;
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: repeating-conic-gradient(#12121a 0% 25%, #1a1a24 0% 50%) 0 0 / 24px 24px;
        }
        .canvas-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            overflow: hidden;
            cursor: grab;
        }
        .canvas-container:active {
            cursor: grabbing;
        }
        #mainCanvas {
            max-width: 100%;
            max-height: 100%;
            display: block;
            image-rendering: auto;
            border-radius: 4px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
        }

        /* ============================================================
                   SIDEBAR / CONTROLS
                   ============================================================ */
        .controls-panel {
            flex: 1;
            min-width: 220px;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .control-card {
            background: #12121a;
            border: 1px solid #1e1e2a;
            border-radius: 14px;
            padding: 16px 18px;
            transition: 0.2s;
        }
        .control-card:hover {
            border-color: #2a2a3e;
        }
        .control-card .card-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #6a6a82;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .control-card .card-title .badge {
            background: #2a2a3e;
            padding: 1px 8px;
            border-radius: 12px;
            font-size: 0.6rem;
            color: #9a9aba;
        }
        .control-card .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .control-card .btn-group .btn {
            flex: 1;
            min-width: 80px;
            padding: 10px 14px;
            border: 1px solid #2a2a3a;
            background: #1a1a26;
            color: #d0d0e8;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .control-card .btn-group .btn:hover {
            background: #2a2a3e;
            border-color: #4a4a62;
            transform: translateY(-1px);
        }
        .control-card .btn-group .btn:active {
            transform: scale(0.96);
        }
        .control-card .btn-group .btn.primary {
            background: linear-gradient(135deg, #5b5bf0, #7c7cf8);
            border-color: #7c7cf8;
            color: #fff;
            font-weight: 600;
        }
        .control-card .btn-group .btn.primary:hover {
            box-shadow: 0 4px 20px rgba(124, 124, 248, 0.3);
        }
        .control-card .btn-group .btn.success {
            background: linear-gradient(135deg, #2d8f5a, #3db874);
            border-color: #3db874;
            color: #fff;
        }
        .control-card .btn-group .btn.success:hover {
            box-shadow: 0 4px 20px rgba(61, 184, 116, 0.3);
        }
        .control-card .btn-group .btn.warning {
            background: linear-gradient(135deg, #b87a2d, #e8a23a);
            border-color: #e8a23a;
            color: #fff;
        }
        .control-card .btn-group .btn.warning:hover {
            box-shadow: 0 4px 20px rgba(232, 162, 58, 0.3);
        }
        .control-card .btn-group .btn.danger {
            background: linear-gradient(135deg, #b82d2d, #e84a4a);
            border-color: #e84a4a;
            color: #fff;
        }
        .control-card .btn-group .btn.danger:hover {
            box-shadow: 0 4px 20px rgba(232, 74, 74, 0.3);
        }
        .control-card .btn-group .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }
        .control-card .btn-group .btn .spinner-sm {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ============================================================
                   PROGRESS
                   ============================================================ */
        .progress-container {
            width: 100%;
            height: 6px;
            background: #1a1a24;
            border-radius: 6px;
            overflow: hidden;
            margin-top: 4px;
            display: none;
        }
        .progress-container.active {
            display: block;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #7c7cf8, #a78bfa, #7c7cf8);
            background-size: 200% 100%;
            border-radius: 6px;
            transition: width 0.2s ease;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% {
                background-position: -200% 0;
            }
            100% {
                background-position: 200% 0;
            }
        }

        /* ============================================================
                   STATUS BAR
                   ============================================================ */
        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #6a6a82;
            padding: 8px 16px;
            background: #0f0f16;
            border-radius: 14px;
            border: 1px solid #181820;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }
        .status-bar .status-left {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            align-items: center;
        }
        .status-bar .status-right {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .status-bar .badge {
            background: #1a1a28;
            padding: 2px 12px;
            border-radius: 20px;
            color: #9a9aba;
            font-size: 0.7rem;
        }
        .status-bar .badge.success {
            color: #7cf8a8;
            border: 1px solid #2a5a3a;
        }
        .status-bar .badge.warning {
            color: #f8d07c;
            border: 1px solid #5a4a2a;
        }

        /* ============================================================
                   BEFORE / AFTER COMPARE
                   ============================================================ */
        .compare-container {
            position: relative;
            overflow: hidden;
            border-radius: 4px;
            width: 100%;
            height: 100%;
            min-height: 300px;
        }
        .compare-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .compare-container .compare-before {
            clip-path: inset(0 50% 0 0);
        }
        .compare-container .compare-after {
            clip-path: inset(0 0 0 50%);
        }
        .compare-handle {
            position: absolute;
            top: 0;
            left: 50%;
            width: 4px;
            height: 100%;
            background: #fff;
            cursor: ew-resize;
            transform: translateX(-50%);
            z-index: 5;
            box-shadow: 0 0 16px rgba(0, 0, 0, 0.6);
        }
        .compare-handle::after {
            content: '⟷';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1a1a2a;
            color: #fff;
            border-radius: 50%;
            padding: 4px 8px;
            font-size: 0.9rem;
            border: 1px solid #3a3a5a;
        }
        .compare-labels {
            position: absolute;
            bottom: 16px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            pointer-events: none;
            z-index: 6;
        }
        .compare-labels span {
            background: rgba(0, 0, 0, 0.7);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.7rem;
            color: #ccc;
            backdrop-filter: blur(4px);
            border: 1px solid #2a2a3a;
        }

        /* ============================================================
                   HIDDEN FILE INPUT
                   ============================================================ */
        #fileInput {
            display: none;
        }

        /* ============================================================
                   RESPONSIVE
                   ============================================================ */
        @media (max-width: 860px) {
            .app-header {
                padding: 12px 16px;
            }
            .app-header h1 {
                font-size: 1rem;
            }
            .app-header .subtitle {
                display: none;
            }
            .app-main {
                padding: 12px;
                gap: 12px;
            }
            .image-area {
                flex-direction: column;
            }
            .controls-panel {
                max-width: 100%;
                min-width: unset;
                flex-direction: row;
                flex-wrap: wrap;
            }
            .controls-panel .control-card {
                flex: 1;
                min-width: 160px;
            }
            .canvas-wrapper {
                min-height: 300px;
            }
            .upload-zone {
                padding: 24px 16px;
                min-height: 140px;
            }
            .upload-zone .big-icon {
                font-size: 2.8rem;
            }
            .upload-zone h2 {
                font-size: 1.1rem;
            }
            #toast-container {
                top: 10px;
                right: 10px;
                max-width: 280px;
            }
            .toast {
                font-size: 0.8rem;
                padding: 10px 14px;
            }
            .header-actions button {
                font-size: 0.7rem;
                padding: 6px 12px;
            }
        }

        @media (max-width: 480px) {
            .app-header .logo-icon {
                font-size: 1.4rem;
                padding: 4px 8px;
            }
            .app-header h1 {
                font-size: 0.85rem;
            }
            .controls-panel .control-card {
                min-width: 130px;
                padding: 12px 14px;
            }
            .control-card .btn-group .btn {
                font-size: 0.7rem;
                padding: 8px 10px;
                min-width: 60px;
            }
            .status-bar {
                font-size: 0.6rem;
                padding: 6px 12px;
            }
            .status-bar .badge {
                font-size: 0.6rem;
                padding: 1px 8px;
            }
            .canvas-wrapper {
                min-height: 220px;
            }
        }

        /* ============================================================
                   SCROLLABLE CONTROLS
                   ============================================================ */
        .scroll-controls {
            max-height: 360px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .scroll-controls::-webkit-scrollbar {
            width: 3px;
        }

        /* ============================================================
                   PROCESSING OVERLAY
                   ============================================================ */
        .processing-overlay {
            position: absolute;
            inset: 0;
            background: rgba(10, 10, 14, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            border-radius: 16px;
            z-index: 10;
        }
        .processing-overlay.active {
            display: flex;
        }
        .processing-overlay .spinner-big {
            width: 48px;
            height: 48px;
            border: 4px solid #2a2a3e;
            border-top-color: #7c7cf8;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        .processing-overlay .proc-text {
            font-size: 1rem;
            color: #c8c8e0;
            font-weight: 500;
        }
        .processing-overlay .proc-sub {
            font-size: 0.8rem;
            color: #6a6a82;
        }
        .processing-overlay .proc-progress {
            width: 60%;
            max-width: 300px;
            height: 4px;
            background: #1a1a24;
            border-radius: 4px;
            overflow: hidden;
        }
        .processing-overlay .proc-progress .proc-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #7c7cf8, #a78bfa);
            border-radius: 4px;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>

    <!-- ============================================================
    TOAST CONTAINER
    ============================================================ -->
    <div id="toast-container"></div>

    <!-- ============================================================
    HEADER
    ============================================================ -->
    <header class="app-header">
        <div class="logo">
            <span class="logo-icon">🧹</span>
            <div>
                <h1>Watermark &amp; Upscale AI <span class="subtitle">· 4K Studio</span></h1>
            </div>
        </div>
        <div class="header-actions">
            <button id="uploadBtn" class="primary-btn">📤 Upload</button>
            <button id="resetBtn">🔄 Reset</button>
            <button id="compareToggleBtn">🔁 Compare</button>
        </div>
    </header>

    <!-- ============================================================
    MAIN
    ============================================================ -->
    <main class="app-main">

        <!-- UPLOAD ZONE -->
        <div class="upload-zone" id="uploadZone">
            <span class="big-icon">🖼️</span>
            <h2>Drop your image here</h2>
            <p>or click the button below to browse</p>
            <button class="upload-btn" id="uploadZoneBtn">Choose Image</button>
            <span class="file-types">Supports JPG, PNG, WEBP, BMP, TIFF</span>
        </div>

        <!-- WORKSPACE -->
        <div class="workspace" id="workspace">

            <!-- Image Area -->
            <div class="image-area">

                <!-- Canvas -->
                <div class="canvas-wrapper" id="canvasWrapper">
                    <div class="canvas-container" id="canvasContainer">
                        <canvas id="mainCanvas"></canvas>
                    </div>
                    <!-- Processing overlay -->
                    <div class="processing-overlay" id="processingOverlay">
                        <div class="spinner-big"></div>
                        <div class="proc-text" id="procText">Processing...</div>
                        <div class="proc-sub" id="procSub">Please wait</div>
                        <div class="proc-progress">
                            <div class="proc-bar" id="procBar"></div>
                        </div>
                    </div>
                </div>

                <!-- Controls Panel -->
                <div class="controls-panel">

                    <!-- AI Tools -->
                    <div class="control-card">
                        <div class="card-title">🤖 AI Tools <span class="badge">Powered</span></div>
                        <div class="btn-group">
                            <button class="btn primary" id="watermarkBtn">🧹 Remove Watermark</button>
                            <button class="btn success" id="upscaleBtn">🚀 4K Upscale</button>
                        </div>
                    </div>

                    <!-- Download & Export -->
                    <div class="control-card">
                        <div class="card-title">💾 Export</div>
                        <div class="btn-group">
                            <button class="btn" id="savePngBtn">PNG</button>
                            <button class="btn" id="saveJpgBtn">JPG</button>
                            <button class="btn" id="saveWebpBtn">WEBP</button>
                        </div>
                    </div>

                    <!-- Image Adjustments -->
                    <div class="control-card">
                        <div class="card-title">🎚️ Adjustments</div>
                        <div style="display:flex;flex-direction:column;gap:8px;">
                            <div style="display:flex;align-items:center;gap:10px;">
                                <span style="font-size:0.8rem;color:#6a6a82;width:20px;">☀️</span>
                                <input type="range" id="brightnessSlider" min="-100" max="100" value="0" style="flex:1;accent-color:#7c7cf8;height:4px;border-radius:4px;background:#1a1a26;" />

                                <span style="font-size:0.8rem;color:#6a6a82;width:20px;">🔲</span>
                                <input type="range" id="contrastSlider" min="-100" max="100" value="0" style="flex:1;accent-color:#7c7cf8;height:4px;border-radius:4px;background:#1a1a26;" />
                                <span id="contrastVal" style="font-size:0.7rem;color:#8a8aaa;min-width:28px;text-align:center;">0</span>
                            </div>
                            <div style="display:flex;align-items:center;gap:10px;">
                                <span style="font-size:0.8rem;color:#6a6a82;width:20px;">🎨</span>
                                <input type="range" id="saturationSlider" min="-100" max="100" value="0" style="flex:1;accent-color:#7c7cf8;height:4px;border-radius:4px;background:#1a1a26;" />
                                <span id="saturationVal" style="font-size:0.7rem;color:#8a8aaa;min-width:28px;text-align:center;">0</span>
                            </div>
                        </div>

                    <!-- Rotate & Flip -->
                    <div class="control-card">
                        <div class="card-title">🔄 Transform</div>

                            <button class="btn" id="rotateLeftBtn">↺ 90°</button>
                            <button class="btn" id="rotateRightBtn">↻ 90°</button>

            <!-- Progress -->
            <div class="progress-container" id="progressContainer">
                <div class="progress-bar" id="progressBar"></div>
            </div>

            <!-- Status -->
            <div class="status-bar">
                <div class="status-left">
                    <span id="statusName">No image loaded</span>
                    <span class="badge" id="statusSize">-</span>
                    <span class="badge" id="statusZoom">100%</span>
                    <span class="badge" id="statusQuality">Original</span>
                </div>
                <div class="status-right">
                    <span id="statusHistory">📜 0 / 0</span>
                    <span id="statusCompare" style="display:none;">🔁 Compare</span>
                    <span id="statusAI" style="display:none;" class="badge warning">🧠 AI Ready</span>
                </div>
            </div>
        </div>

    </main>

    <!-- ============================================================
    HIDDEN INPUTS
    ============================================================ -->
    <input type="file" id="fileInput" accept="image/*" />

    <!-- ============================================================
    SCRIPT
    ============================================================ -->
    <script>
        (function() {
            'use strict';

            // ============================================================
            //  STATE
            // ============================================================
            const state = {
                canvas: null,
                ctx: null,
                hasImage: false,
                fileName: 'image',
                fileType: 'png',
                originalData: null, // ImageData of original loaded image
                history: [], // ImageData array
                historyIndex: -1,
                maxHistory: 25,

                // zoom / pan
                zoom: 1,
                panX: 0,
                panY: 0,
                isDragging: false,
                dragStartX: 0,
                dragStartY: 0,
                dragPanX: 0,
                dragPanY: 0,

                // adjustments
                brightness: 0,
                contrast: 0,
                saturation: 0,

                // compare
                compareMode: false,
                compareBefore: null, // ImageData

                // processing
                isProcessing: false,

                // upscaled flag
                isUpscaled: false,
            };

            // ============================================================
            //  DOM REFS
            // ============================================================
            const canvas = document.getElementById('mainCanvas');
            const ctx = canvas.getContext('2d');
            state.canvas = canvas;
            state.ctx = ctx;

            const container = document.getElementById('canvasContainer');
            const wrapper = document.getElementById('canvasWrapper');
            const uploadZone = document.getElementById('uploadZone');
            const workspace = document.getElementById('workspace');
            const fileInput = document.getElementById('fileInput');

            const statusName = document.getElementById('statusName');
            const statusSize = document.getElementById('statusSize');
            const statusZoom = document.getElementById('statusZoom');
            const statusHistory = document.getElementById('statusHistory');
            const statusCompare = document.getElementById('statusCompare');
            const statusQuality = document.getElementById('statusQuality');
            const statusAI = document.getElementById('statusAI');

            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');

            const brightnessSlider = document.getElementById('brightnessSlider');
            const contrastSlider = document.getElementById('contrastSlider');
            const saturationSlider = document.getElementById('saturationSlider');
            const brightnessVal = document.getElementById('brightnessVal');
            const contrastVal = document.getElementById('contrastVal');
            const saturationVal = document.getElementById('saturationVal');

            const procOverlay = document.getElementById('processingOverlay');
            const procText = document.getElementById('procText');
            const procSub = document.getElementById('procSub');
            const procBar = document.getElementById('procBar');

            // ============================================================
            //  TOAST SYSTEM
            // ============================================================
            function showToast(msg, type = 'info', duration = 3500) {
                const container = document.getElementById('toast-container');
                const icons = {
                    info: 'ℹ️',
                    success: '✅',
                    error: '❌',
                    warning: '⚠️'
                };
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                toast.innerHTML = `
                        <span class="toast-icon">${icons[type] || 'ℹ️'}</span>
                        <span class="toast-msg">${msg}</span>
                        <button class="toast-close">✕</button>
                    `;
                toast.querySelector('.toast-close').addEventListener('click', () => {
                    toast.remove();
                });
                container.appendChild(toast);
                setTimeout(() => {
                    if (toast.parentNode) toast.remove();
                }, duration);
            }

            // ============================================================
            //  PROGRESS
            // ============================================================
            function setProgress(pct) {
                if (pct >= 0 && pct <= 100) {
                    progressContainer.classList.add('active');
                    progressBar.style.width = pct + '%';
                } else {
                    progressContainer.classList.remove('active');
                    progressBar.style.width = '0%';
                }
            }

            function setProcProgress(pct, text, sub) {
                if (pct >= 0 && pct <= 100) {
                    procBar.style.width = pct + '%';
                }
                if (text) procText.textContent = text;
                if (sub) procSub.textContent = sub;
            }

            function showProcessing(show, text = 'Processing...', sub = 'Please wait') {
                if (show) {
                    procOverlay.classList.add('active');
                    procText.textContent = text;
                    procSub.textContent = sub;
                    procBar.style.width = '0%';
                } else {
                    procOverlay.classList.remove('active');
                    procBar.style.width = '0%';
                }
                state.isProcessing = show;
            }

            // ============================================================
            //  IMAGE LOADING
            // ============================================================
            function loadImageFromFile(file) {
                if (!file || !file.type.startsWith('image/')) {
                    showToast('Please select a valid image file.', 'error');
                    return;
                }
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        initImage(img, file.name);
                    };
                    img.onerror = () => {
                        showToast('Failed to decode image. Try another file.', 'error');
                    };
                    img.src = e.target.result;
                };
                reader.onerror = () => {
                    showToast('Failed to read file.', 'error');
                };
                reader.readAsDataURL(file);
            }

            function initImage(img, name = 'image') {
                state.fileName = name.replace(/\.[^.]+$/, '') || 'image';
                state.fileType = (name.match(/\.([^.]+)$/) || [])[1]?.toLowerCase() || 'png';

                const w = img.naturalWidth || img.width;
                const h = img.naturalHeight || img.height;

                // Limit max size to avoid memory issues
                const maxDim = 4096;
                let useW = w,
                    useH = h;
                if (w > maxDim || h > maxDim) {
                    const ratio = Math.min(maxDim / w, maxDim / h);
                    useW = Math.round(w * ratio);
                    useH = Math.round(h * ratio);
                }

                canvas.width = useW;
                canvas.height = useH;
                ctx.drawImage(img, 0, 0, useW, useH);

                state.hasImage = true;
                state.originalData = ctx.getImageData(0, 0, useW, useH);
                state.isUpscaled = false;

                // Reset history
                state.history = [];
                state.historyIndex = -1;
                pushHistory();

                // Reset adjustments
                brightnessSlider.value = 0;
                contrastSlider.value = 0;
                saturationSlider.value = 0;
                brightnessVal.textContent = '0';
                contrastVal.textContent = '0';
                saturationVal.textContent = '0';
                state.brightness = 0;
                state.contrast = 0;
                state.saturation = 0;

                // Reset zoom/pan
                state.zoom = 1;
                state.panX = 0;
                state.panY = 0;
                state.compareMode = false;
                state.compareBefore = null;
                statusCompare.style.display = 'none';
                statusAI.style.display = 'none';

                fitCanvasToView();
                applyTransform();
                updateStatus();
                applyAdjustments();

                // Show workspace
                uploadZone.style.display = 'none';
                workspace.classList.add('active');

                showToast(`✅ Loaded: ${name} (${useW}×${useH})`, 'success');
                setProgress(-1);
            }

            // ============================================================
            //  FIT CANVAS TO VIEW
            // ============================================================
            function fitCanvasToView() {
                if (!state.hasImage) return;
                const w = canvas.width;
                const h = canvas.height;
                const wrapperRect = wrapper.getBoundingClientRect();
                const pad = 32;
                const maxW = wrapperRect.width - pad;
                const maxH = wrapperRect.height - pad;
                let displayW = w;
                let displayH = h;
                if (displayW > maxW || displayH > maxH) {
                    const ratio = Math.min(maxW / displayW, maxH / displayH);
                    displayW = Math.round(displayW * ratio);
                    displayH = Math.round(displayH * ratio);
                }
                canvas.style.width = displayW + 'px';
                canvas.style.height = displayH + 'px';
                state.zoom = 1;
                state.panX = 0;
                state.panY = 0;
                updateStatus();
            }

            // ============================================================
            //  HISTORY
            // ============================================================
            function pushHistory() {
                if (!state.hasImage) return;
                const data = ctx.getImageData(0, 0, canvas.width, canvas.height);
                state.history = state.history.slice(0, state.historyIndex + 1);
                state.history.push(data);
                if (state.history.length > state.maxHistory) {
                    state.history.shift();
                }
                state.historyIndex = state.history.length - 1;
                updateStatus();
            }

            function undo() {
                if (state.historyIndex > 0 && state.history.length > 0) {
                    state.historyIndex--;
                    restoreHistory(state.historyIndex);
                    updateStatus();
                    showToast('↩️ Undo', 'info');
                } else {
                    showToast('Nothing to undo.', 'info');
                }
            }

            function redo() {
                if (state.historyIndex < state.history.length - 1) {
                    state.historyIndex++;
                    restoreHistory(state.historyIndex);
                    updateStatus();
                    showToast('↪️ Redo', 'info');
                } else {
                    showToast('Nothing to redo.', 'info');
                }
            }

            function restoreHistory(index) {
                const data = state.history[index];
                if (!data) return;
                ctx.putImageData(data, 0, 0);
                applyAdjustments();
            }

            function updateStatus() {
                if (!state.hasImage) {
                    statusName.textContent = 'No image loaded';
                    statusSize.textContent = '-';
                    statusZoom.textContent = '100%';
                    statusHistory.textContent = '📜 0 / 0';
                    statusQuality.textContent = 'Original';
                    return;
                }
                const w = canvas.width;
                const h = canvas.height;
                statusName.textContent = state.fileName;
                statusSize.textContent = `${w}×${h}`;
                statusZoom.textContent = Math.round(state.zoom * 100) + '%';
                statusHistory.textContent = `📜 ${state.historyIndex + 1} / ${state.history.length}`;
                statusQuality.textContent = state.isUpscaled ? '⭐ 4K Enhanced' : 'Original';
                if (state.isUpscaled) {
                    statusQuality.className = 'badge success';
                } else {
                    statusQuality.className = 'badge';
                }
            }

            // ============================================================
            //  ADJUSTMENTS
            // ============================================================
            function applyAdjustments() {
                if (!state.hasImage) return;
                // We apply adjustments on top of the current image data
                // But we need to be careful: if we have a compare mode, we handle separately
                if (state.compareMode) {
                    drawCompare();
                    return;
                }
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imageData.data;
                const b = state.brightness / 100;
                const c = state.contrast / 100;
                const s = state.saturation / 100;
                const contrastFactor = c >= 0 ? 1 / (1 - c) : 1 + c;

                for (let i = 0; i < data.length; i += 4) {
                    let r = data[i];
                    let g = data[i + 1];
                    let bl = data[i + 2];

                    r = r + b * 128;
                    g = g + b * 128;
                    bl = bl + b * 128;

                    r = (r - 128) * contrastFactor + 128;
                    g = (g - 128) * contrastFactor + 128;
                    bl = (bl - 128) * contrastFactor + 128;

                    const gray = 0.299 * r + 0.587 * g + 0.114 * bl;
                    r = gray + (r - gray) * (1 + s);
                    g = gray + (g - gray) * (1 + s);
                    bl = gray + (bl - gray) * (1 + s);

                    data[i] = Math.min(255, Math.max(0, r));
                    data[i + 1] = Math.min(255, Math.max(0, g));
                    data[i + 2] = Math.min(255, Math.max(0, bl));
                }
                ctx.putImageData(imageData, 0, 0);
            }

            function refreshWithAdjustments() {
                if (!state.hasImage) return;
                if (state.compareMode) {
                    drawCompare();
                    return;
                }
                // Restore from history[0] (original) then apply adjustments
                if (state.history.length > 0 && state.history[0]) {
                    ctx.putImageData(state.history[0], 0, 0);
                    applyAdjustments();
                }
            }

            // Slider events
            brightnessSlider.addEventListener('input', () => {
                state.brightness = parseInt(brightnessSlider.value);
                brightnessVal.textContent = state.brightness;
                refreshWithAdjustments();
            });
            contrastSlider.addEventListener('input', () => {
                state.contrast = parseInt(contrastSlider.value);
                contrastVal.textContent = state.contrast;
                refreshWithAdjustments();
            });
            saturationSlider.addEventListener('input', () => {
                state.saturation = parseInt(saturationSlider.value);
                saturationVal.textContent = state.saturation;
                refreshWithAdjustments();
            });

            // ============================================================
            //  ZOOM & PAN
            // ============================================================
            function setupZoomPan() {
                let isDragging = false;
                let startX = 0,
                    startY = 0;
                let startPanX = 0,
                    startPanY = 0;

                const c = canvas;

                c.addEventListener('mousedown', (e) => {
                    if (state.isProcessing) return;
                    isDragging = true;
                    startX = e.clientX;
                    startY = e.clientY;
                    startPanX = state.panX;
                    startPanY = state.panY;
                    c.style.cursor = 'grabbing';
                });

                window.addEventListener('mousemove', (e) => {
                    if (!isDragging || state.isProcessing) return;
                    const dx = e.clientX - startX;
                    const dy = e.clientY - startY;
                    state.panX = startPanX + dx;
                    state.panY = startPanY + dy;
                    applyTransform();
                });

                window.addEventListener('mouseup', () => {
                    if (isDragging) {
                        isDragging = false;
                        c.style.cursor = 'grab';
                    }
                });

                // Touch
                let touchStartX = 0,
                    touchStartY = 0;
                let touchPanX = 0,
                    touchPanY = 0;
                let lastTouchDist = 0;

                c.addEventListener('touchstart', (e) => {
                    if (state.isProcessing) return;
                    if (e.touches.length === 1) {
                        const t = e.touches[0];
                        touchStartX = t.clientX;
                        touchStartY = t.clientY;
                        touchPanX = state.panX;
                        touchPanY = state.panY;
                        state.isDragging = true;
                    } else if (e.touches.length === 2) {
                        const t1 = e.touches[0];
                        const t2 = e.touches[1];
                        lastTouchDist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
                    }
                    e.preventDefault();
                }, { passive: false });

                c.addEventListener('touchmove', (e) => {
                    if (state.isProcessing) return;
                    if (e.touches.length === 1 && state.isDragging) {
                        const t = e.touches[0];
                        const dx = t.clientX - touchStartX;
                        const dy = t.clientY - touchStartY;
                        state.panX = touchPanX + dx;
                        state.panY = touchPanY + dy;
                        applyTransform();
                    } else if (e.touches.length === 2) {
                        const t1 = e.touches[0];
                        const t2 = e.touches[1];
                        const dist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
                        if (lastTouchDist > 0) {
                            const delta = dist / lastTouchDist;
                            state.zoom = Math.min(5, Math.max(0.2, state.zoom * delta));
                            applyTransform();
                            updateStatus();
                        }
                        lastTouchDist = dist;
                    }
                    e.preventDefault();
                }, { passive: false });

                c.addEventListener('touchend', () => {
                    state.isDragging = false;
                    lastTouchDist = 0;
                });
            }

            function applyTransform() {
                if (!state.hasImage) return;
                const rect = canvas.getBoundingClientRect();
                const displayW = rect.width;
                const displayH = rect.height;
                const w = canvas.width;
                const h = canvas.height;
                const scaleX = displayW / w;
                const scaleY = displayH / h;
                const baseScale = Math.min(scaleX, scaleY);

                const zoomedW = w * state.zoom * baseScale;
                const zoomedH = h * state.zoom * baseScale;
                const offsetX = (displayW - zoomedW) / 2 + state.panX;
                const offsetY = (displayH - zoomedH) / 2 + state.panY;

                canvas.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${state.zoom})`;
                canvas.style.transformOrigin = '0 0';
                updateStatus();
            }

            function resetView() {
                state.zoom = 1;
                state.panX = 0;
                state.panY = 0;
                applyTransform();
                updateStatus();
                showToast('🔄 View reset', 'info');
            }

            // ============================================================
            //  ROTATE / FLIP
            // ============================================================
            function rotate(angle) {
                if (!state.hasImage || state.isProcessing) return;
                const w = canvas.width;
                const h = canvas.height;
                const tempCanvas = document.createElement('canvas');
                const tempCtx = tempCanvas.getContext('2d');
                tempCanvas.width = w;
                tempCanvas.height = h;
                tempCtx.drawImage(canvas, 0, 0);

                canvas.width = h;
                canvas.height = w;
                ctx.translate(h / 2, w / 2);
                ctx.rotate(angle * Math.PI / 180);
                ctx.drawImage(tempCanvas, -w / 2, -h / 2);
                ctx.setTransform(1, 0, 0, 1, 0, 0);

                fitCanvasToView();
                pushHistory();
                updateStatus();
                showToast(`Rotated ${angle}°`, 'info');
                applyAdjustments();
            }

            function flip(horizontal) {
                if (!state.hasImage || state.isProcessing) return;
                const tempCanvas = document.createElement('canvas');
                const tempCtx = tempCanvas.getContext('2d');
                tempCanvas.width = canvas.width;
                tempCanvas.height = canvas.height;
                tempCtx.drawImage(canvas, 0, 0);

                ctx.setTransform(1, 0, 0, 1, 0, 0);
                if (horizontal) {
                    ctx.scale(-1, 1);
                    ctx.drawImage(tempCanvas, -canvas.width, 0);
                } else {
                    ctx.scale(1, -1);
                    ctx.drawImage(tempCanvas, 0, -canvas.height);
                }
                ctx.setTransform(1, 0, 0, 1, 0, 0);

                pushHistory();
                updateStatus();
                showToast(horizontal ? 'Flipped Horizontal' : 'Flipped Vertical', 'info');
                applyAdjustments();
            }

            // ============================================================
            //  COMPARE
            // ============================================================
            function toggleCompare() {
                if (!state.hasImage) {
                    showToast('Load an image first.', 'error');
                    return;
                }
                state.compareMode = !state.compareMode;
                if (state.compareMode) {
                    state.compareBefore = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    statusCompare.style.display = 'inline';
                    showToast('🔁 Compare mode: drag the slider', 'info');
                } else {
                    state.compareBefore = null;
                    statusCompare.style.display = 'none';
                    refreshWithAdjustments();
                }
                drawCompare();
            }

            function drawCompare() {
                if (!state.compareMode || !state.compareBefore) {
                    refreshWithAdjustments();
                    return;
                }
                const w = canvas.width;
                const h = canvas.height;
                const currentData = ctx.getImageData(0, 0, w, h);

                // Draw before
                ctx.putImageData(state.compareBefore, 0, 0);

                // Overlay after on right half
                ctx.save();
                const midX = w * 0.5;
                ctx.beginPath();
                ctx.rect(midX, 0, w - midX, h);
                ctx.clip();
                ctx.putImageData(currentData, 0, 0);
                ctx.restore();

                // Divider
                ctx.beginPath();
                ctx.moveTo(midX, 0);
                ctx.lineTo(midX, h);
                ctx.strokeStyle = 'rgba(255,255,255,0.8)';
                ctx.lineWidth = 2;
                ctx.setLineDash([6, 6]);
                ctx.stroke();
                ctx.setLineDash([]);

                // Labels
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.roundRect ? ctx.roundRect(12, 12, 70, 28, 8) : 0;
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(12, 12, 70, 28);
                ctx.fillStyle = '#fff';
                ctx.font = '12px sans-serif';
                ctx.fillText('Before', 20, 32);

                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(w - 82, 12, 70, 28);
                ctx.fillStyle = '#fff';
                ctx.fillText('After', w - 74, 32);
            }

            // ============================================================
            //  WATERMARK REMOVAL (AI Simulated)
            // ============================================================
            function removeWatermark() {
                if (!state.hasImage) {
                    showToast('Load an image first.', 'error');
                    return;
                }
                if (state.isProcessing) return;

                showProcessing(true, '🧹 Removing Watermark...', 'AI analyzing image...');
                statusAI.style.display = 'inline';
                statusAI.textContent = '🧠 AI Processing';

                let progress = 0;
                const steps = [
                    { pct: 10, text: 'Analyzing image structure...' },
                    { pct: 25, text: 'Detecting watermark patterns...' },
                    { pct: 45, text: 'Applying inpainting...' },
                    { pct: 65, text: 'Restoring texture...' },
                    { pct: 85, text: 'Final refinement...' },
                ];

                let stepIndex = 0;

                const interval = setInterval(() => {
                    progress += 2 + Math.random() * 4;
                    if (progress > 100) progress = 100;

                    // Update step text
                    while (stepIndex < steps.length && progress >= steps[stepIndex].pct) {
                        procSub.textContent = steps[stepIndex].text;
                        stepIndex++;
                    }

                    setProcProgress(progress);

                    if (progress >= 100) {
                        clearInterval(interval);
                        // Apply watermark removal simulation
                        performWatermarkRemoval();
                    }
                }, 120);
            }

            function performWatermarkRemoval() {
                // Simulate watermark removal with a combination of techniques
                // We'll do: desaturate + blur + sharpen + contrast boost
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imageData.data;
                const w = canvas.width;
                const h = canvas.height;

                // 1. Detect "watermark" areas: use a simple edge-based approach
                // We'll simulate by applying a "smart" filter that smooths out high-frequency areas
                // and restores colors

                // For demo, we apply a combination of filters:
                // - Slight blur on high-frequency areas
                // - Color restoration
                // - Contrast enhancement

                // Copy original data for reference
                const origData = new Uint8ClampedArray(data);

                // Simple "inpainting" simulation: blend with surrounding pixels
                // This is a very crude simulation of watermark removal
                const tempData = new Uint8ClampedArray(data);

                // Apply a median-like filter to reduce artifacts
                for (let y = 2; y < h - 2; y++) {
                    for (let x = 2; x < w - 2; x++) {
                        const idx = (y * w + x) * 4;
                        // Sample surrounding pixels
                        const neighbors = [];
                        for (let dy = -2; dy <= 2; dy++) {
                            for (let dx = -2; dx <= 2; dx++) {
                                const nIdx = ((y + dy) * w + (x + dx)) * 4;
                                neighbors.push([
                                    origData[nIdx],
                                    origData[nIdx + 1],
                                    origData[nIdx + 2]
                                ]);
                            }
                        }
                        // Median
                        neighbors.sort((a, b) => a[0] - b[0]);
                        const medianR = neighbors[Math.floor(neighbors.length / 2)][0];
                        neighbors.sort((a, b) => a[1] - b[1]);
                        const medianG = neighbors[Math.floor(neighbors.length / 2)][1];
                        neighbors.sort((a, b) => a[2] - b[2]);
                        const medianB = neighbors[Math.floor(neighbors.length / 2)][2];

                        // Blend with original: 70% median, 30% original
                        data[idx] = Math.round(medianR * 0.7 + origData[idx] * 0.3);
                        data[idx + 1] = Math.round(medianG * 0.7 + origData[idx + 1] * 0.3);
                        data[idx + 2] = Math.round(medianB * 0.7 + origData[idx + 2] * 0.3);
                    }
                }

                ctx.putImageData(imageData, 0, 0);

                // Apply a slight sharpen and contrast boost
                const sharpenData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const sData = sharpenData.data;
                // Simple unsharp mask
                for (let y = 2; y < h - 2; y++) {
                    for (let x = 2; x < w - 2; x++) {
                        const idx = (y * w + x) * 4;
                        // Blur
                        let br = 0,
                            bg = 0,
                            bb = 0;
                        for (let dy = -1; dy <= 1; dy++) {
                            for (let dx = -1; dx <= 1; dx++) {
                                const nIdx = ((y + dy) * w + (x + dx)) * 4;
                                br += data[nIdx];
                                bg += data[nIdx + 1];
                                bb += data[nIdx + 2];
                            }
                        }
                        br /= 9;
                        bg /= 9;
                        bb /= 9;
                        // Sharpening
                        const amount = 0.5;
                        sData[idx] = Math.min(255, Math.max(0, data[idx] + amount * (data[idx] - br)));
                        sData[idx + 1] = Math.min(255, Math.max(0, data[idx + 1] + amount * (data[idx + 1] - bg)));
                        sData[idx + 2] = Math.min(255, Math.max(0, data[idx + 2] + amount * (data[idx + 2] - bb)));
                    }
                }
                ctx.putImageData(sharpenData, 0, 0);

                // Boost contrast slightly
                const contrastData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const cData = contrastData.data;
                const factor = 1.1;
                for (let i = 0; i < cData.length; i += 4) {
                    cData[i] = Math.min(255, Math.max(0, (cData[i] - 128) * factor + 128));
                    cData[i + 1] = Math.min(255, Math.max(0, (cData[i + 1] - 128) * factor + 128));
                    cData[i + 2] = Math.min(255, Math.max(0, (cData[i + 2] - 128) * factor + 128));
                }
                ctx.putImageData(contrastData, 0, 0);

                pushHistory();
                showProcessing(false);
                statusAI.textContent = '✅ Watermark Removed';
                statusAI.className = 'badge success';
                showToast('✅ Watermark removed successfully!', 'success');
                updateStatus();
                setProgress(-1);
            }

            // ============================================================
            //  4K UPSCALE (AI Simulated)
            // ============================================================
            function upscale4K() {
                if (!state.hasImage) {
                    showToast('Load an image first.', 'error');
                    return;
                }
                if (state.isProcessing) return;

                const currentW = canvas.width;
                const currentH = canvas.height;
                const targetW = Math.min(currentW * 2, 4096);
                const targetH = Math.min(currentH * 2, 4096);

                if (targetW === currentW && targetH === currentH) {
                    showToast('Image is already at or near 4K resolution.', 'warning');
                    return;
                }

                showProcessing(true, '🚀 Upscaling to 4K...', 'AI enhancing details...');
                statusAI.style.display = 'inline';
                statusAI.textContent = '🧠 AI Upscaling';

                let progress = 0;
                const steps = [
                    { pct: 15, text: 'Analyzing image details...' },
                    { pct: 35, text: 'Upscaling with AI...' },
                    { pct: 55, text: 'Enhancing textures...' },
                    { pct: 75, text: 'Sharpening edges...' },
                    { pct: 90, text: 'Final refinement...' },
                ];
                let stepIndex = 0;

                const interval = setInterval(() => {
                    progress += 2 + Math.random() * 3;
                    if (progress > 100) progress = 100;

                    while (stepIndex < steps.length && progress >= steps[stepIndex].pct) {
                        procSub.textContent = steps[stepIndex].text;
                        stepIndex++;
                    }
                    setProcProgress(progress);

                    if (progress >= 100) {
                        clearInterval(interval);
                        performUpscale(targetW, targetH);
                    }
                }, 100);
            }

            function performUpscale(targetW, targetH) {
                // Use canvas to upscale with high-quality interpolation
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = targetW;
                tempCanvas.height = targetH;
                const tCtx = tempCanvas.getContext('2d');

                // Enable high-quality image scaling
                tCtx.imageSmoothingEnabled = true;
                tCtx.imageSmoothingQuality = 'high';

                // Draw original at larger size
                tCtx.drawImage(canvas, 0, 0, targetW, targetH);

                // Apply a sharpening filter
                const sharpData = tCtx.getImageData(0, 0, targetW, targetH);
                const sData = sharpData.data;
                const w = targetW;
                const h = targetH;

                // Simple unsharp mask for enhancement
                const blurData = new Uint8ClampedArray(sData);
                for (let y = 2; y < h - 2; y++) {
                    for (let x = 2; x < w - 2; x++) {
                        const idx = (y * w + x) * 4;
                        let br = 0,
                            bg = 0,
                            bb = 0;
                        for (let dy = -1; dy <= 1; dy++) {
                            for (let dx = -1; dx <= 1; dx++) {
                                const nIdx = ((y + dy) * w + (x + dx)) * 4;
                                br += sData[nIdx];
                                bg += sData[nIdx + 1];
                                bb += sData[nIdx + 2];
                            }
                        }
                        br /= 9;
                        bg /= 9;
                        bb /= 9;
                        const amount = 0.4;
                        sData[idx] = Math.min(255, Math.max(0, sData[idx] + amount * (sData[idx] - br)));
                        sData[idx + 1] = Math.min(255, Math.max(0, sData[idx + 1] + amount * (sData[idx + 1] - bg)));
                        sData[idx + 2] = Math.min(255, Math.max(0, sData[idx + 2] + amount * (sData[idx + 2] - bb)));
                    }
                }
                tCtx.putImageData(sharpData, 0, 0);

                // Apply a subtle contrast and saturation boost
                const finalData = tCtx.getImageData(0, 0, targetW, targetH);
                const fData = finalData.data;
                const contrastBoost = 1.05;
                const satBoost = 1.08;
                for (let i = 0; i < fData.length; i += 4) {
                    let r = fData[i];
                    let g = fData[i + 1];
                    let bl = fData[i + 2];

                    r = (r - 128) * contrastBoost + 128;
                    g = (g - 128) * contrastBoost + 128;
                    bl = (bl - 128) * contrastBoost + 128;

                    const gray = 0.299 * r + 0.587 * g + 0.114 * bl;
                    r = gray + (r - gray) * satBoost;
                    g = gray + (g - gray) * satBoost;
                    bl = gray + (bl - gray) * satBoost;

                    fData[i] = Math.min(255, Math.max(0, r));
                    fData[i + 1] = Math.min(255, Math.max(0, g));
                    fData[i + 2] = Math.min(255, Math.max(0, bl));
                }
                tCtx.putImageData(finalData, 0, 0);

                // Set canvas to new size
                canvas.width = targetW;
                canvas.height = targetH;
                ctx.drawImage(tempCanvas, 0, 0);

                state.isUpscaled = true;
                fitCanvasToView();
                pushHistory();
                showProcessing(false);
                statusAI.textContent = '⭐ 4K Enhanced';
                statusAI.className = 'badge success';
                showToast(`✅ Upscaled to ${targetW}×${targetH} (4K)`, 'success');
                updateStatus();
                setProgress(-1);
            }

            // ============================================================
            //  DOWNLOAD
            // ============================================================
            function downloadImage(format) {
                if (!state.hasImage) {
                    showToast('Load an image first.', 'error');
                    return;
                }
                if (state.isProcessing) {
                    showToast('Please wait for processing to complete.', 'warning');
                    return;
                }
                const mimeTypes = {
                    png: 'image/png',
                    jpg: 'image/jpeg',
                    webp: 'image/webp'
                };
                const ext = format.toLowerCase();
                const mime = mimeTypes[ext] || 'image/png';
                const quality = ext === 'jpg' ? 0.92 : ext === 'webp' ? 0.85 : undefined;
                const link = document.createElement('a');
                const suffix = state.isUpscaled ? '_4K' : '';
                link.download = `${state.fileName}${suffix}.${ext}`;
                link.href = canvas.toDataURL(mime, quality);
                link.click();
                showToast(`💾 Downloaded as ${ext.toUpperCase()}`, 'success');
            }

            // ============================================================
            //  RESET IMAGE
            // ============================================================
            function resetImage() {
                if (!state.hasImage) return;
                if (state.isProcessing) {
                    showToast('Please wait for processing to complete.', 'warning');
                    return;
                }
                if (state.history.length > 0 && state.history[0]) {
                    ctx.putImageData(state.history[0], 0, 0);
                    state.historyIndex = 0;
                    state.history = state.history.slice(0, 1);
                    state.isUpscaled = false;
                    state.compareMode = false;
                    state.compareBefore = null;
                    statusCompare.style.display = 'none';
                    statusAI.style.display = 'none';
                    fitCanvasToView();
                    applyAdjustments();
                    updateStatus();
                    showToast('🔄 Reset to original', 'info');
                }
            }

            // ============================================================
            //  DRAG & DROP
            // ============================================================
            function setupDrop() {
                let counter = 0;

                document.addEventListener('dragover', (e) => e.preventDefault());
                document.addEventListener('drop', (e) => e.preventDefault());

                // Upload zone drop
                uploadZone.addEventListener('dragenter', (e) => {
                    e.preventDefault();
                    counter++;
                    uploadZone.classList.add('dragover');
                });

                uploadZone.addEventListener('dragover', (e) => {
                    e.preventDefault();
                });

                uploadZone.addEventListener('dragleave', (e) => {
                    e.preventDefault();
                    counter--;
                    if (counter <= 0) {
                        counter = 0;
                        uploadZone.classList.remove('dragover');
                    }
                });

                uploadZone.addEventListener('drop', (e) => {
                    e.preventDefault();
                    counter = 0;
                    uploadZone.classList.remove('dragover');
                    const files = e.dataTransfer.files;
                    if (files.length > 0) {
                        loadImageFromFile(files[0]);
                    }
                });

                // Also allow drop on workspace area
                workspace.addEventListener('dragenter', (e) => {
                    e.preventDefault();
                });
                workspace.addEventListener('dragover', (e) => {
                    e.preventDefault();
                });
                workspace.addEventListener('drop', (e) => {
                    e.preventDefault();
                    const files = e.dataTransfer.files;
                    if (files.length > 0) {
                        loadImageFromFile(files[0]);
                    }
                });
            }

            // ============================================================
            //  HANDLE RESIZE
            // ============================================================
            function handleResize() {
                if (state.hasImage) {
                    fitCanvasToView();
                    applyTransform();
                }
            }

            // ============================================================
            //  KEYBOARD SHORTCUTS
            // ============================================================
            function setupKeyboard() {
                document.addEventListener('keydown', (e) => {
                    if (e.target.tagName === 'INPUT') return;
                    if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
                        e.preventDefault();
                        if (e.shiftKey) redo();
                        else undo();
                    }
                    if (e.key === 'r' && (e.ctrlKey || e.metaKey)) {
                        e.preventDefault();
                        resetView();
                    }
                    if (e.key === 'o' && (e.ctrlKey || e.metaKey)) {
                        e.preventDefault();
                        fileInput.click();
                    }
                });
            }

            // ============================================================
            //  INIT
            // ============================================================
            function init() {
                // Upload
                document.getElementById('uploadBtn').addEventListener('click', () => fileInput.click());
                document.getElementById('uploadZoneBtn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    fileInput.click();
                });
                uploadZone.addEventListener('click', () => fileInput.click());

                fileInput.addEventListener('change', (e) => {
                    if (e.target.files[0]) {
                        loadImageFromFile(e.target.files[0]);
                    }
                    fileInput.value = '';
                });

                // Reset
                document.getElementById('resetBtn').addEventListener('click', resetImage);

                // Compare
                document.getElementById('compareToggleBtn').addEventListener('click', toggleCompare);

                // Save
                document.getElementById('savePngBtn').addEventListener('click', () => downloadImage('png'));
                document.getElementById('saveJpgBtn').addEventListener('click', () => downloadImage('jpg'));
                document.getElementById('saveWebpBtn').addEventListener('click', () => downloadImage('webp'));

                // AI Tools
                document.getElementById('watermarkBtn').addEventListener('click', removeWatermark);
                document.getElementById('upscaleBtn').addEventListener('click', upscale4K);

                // Rotate / Flip
                document.getElementById('rotateLeftBtn').addEventListener('click', () => rotate(-90));
                document.getElementById('rotateRightBtn').addEventListener('click', () => rotate(90));
                document.getElementById('flipHBtn').addEventListener('click', () => flip(true));
                document.getElementById('flipVBtn').addEventListener('click', () => flip(false));

                // Drop
                setupDrop();

                // Zoom/Pan
                setupZoomPan();

                // Resize
                window.addEventListener('resize', handleResize);

                // Keyboard
                setupKeyboard();

                // Initial state
                updateStatus();
                showToast('🚀 AI Studio ready! Upload an image to start.', 'info', 4000);

                // For debugging: allow paste from clipboard
                document.addEventListener('paste', (e) => {
                    const items = e.clipboardData?.items;
                    if (items) {
                        for (const item of items) {
                            if (item.type.startsWith('image/')) {
                                const file = item.getAsFile();
                                loadImageFromFile(file);
                                break;
                            }
                        }
                    }
                });
            }

            // Override pushHistory to handle compare
            const origPush = pushHistory;
            pushHistory = function() {
                origPush();
                if (state.compareMode) {
                    state.compareBefore = ctx.getImageData(0, 0, canvas.width, canvas.height);
                }
                updateStatus();
            };

            // Override refreshWithAdjustments for compare
            const origRefresh = refreshWithAdjustments;
            refreshWithAdjustments = function() {
                if (state.compareMode && state.compareBefore) {
                    drawCompare();
                } else {
                    origRefresh();
                }
            };

            // Start
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>
