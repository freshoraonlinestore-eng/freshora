<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Background Remover & 4K Upscaler</title>

    <!-- Import Map for @imgly/background-removal -->
    <script type="importmap">
        {
            "imports": {
                "@imgly/background-removal": "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.0/dist/index.esm.js"
            }
        }
    </script>

    <style>
        /* ---------- Reset & Base ---------- */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0b0d15;
            --bg-secondary: #141824;
            --bg-card: rgba(255, 255, 255, 0.04);
            --border-card: rgba(255, 255, 255, 0.08);
            --text-primary: #f0f4ff;
            --text-secondary: #a0b0d0;
            --accent-1: #6c5ce7;
            --accent-2: #00b4d8;
            --accent-gradient: linear-gradient(135deg, #6c5ce7, #00b4d8);
            --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            font-family: var(--font);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px 60px;
            background-image: radial-gradient(ellipse at 20% 50%, rgba(108, 92, 231, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(0, 180, 216, 0.05) 0%, transparent 50%);
        }

        /* ---------- Scrollbar ---------- */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent-1);
            border-radius: 10px;
        }

        /* ---------- Container ---------- */
        .container {
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
        }

        /* ---------- Header ---------- */
        .header {
            text-align: center;
            padding: 32px 0 20px;
        }
        .header h1 {
            font-size: 2.4rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: inline-block;
        }
        .header p {
            font-size: 1.05rem;
            color: var(--text-secondary);
            margin-top: 6px;
            max-width: 560px;
            margin-left: auto;
            margin-right: auto;
        }

        /* ---------- Upload Area ---------- */
        .upload-area {
            background: var(--bg-card);
            border: 2px dashed var(--border-card);
            border-radius: var(--radius);
            padding: 48px 24px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 12px;
            position: relative;
        }
        .upload-area:hover,
        .upload-area.dragover {
            border-color: var(--accent-1);
            background: rgba(108, 92, 231, 0.06);
        }
        .upload-area .icon {
            font-size: 3.4rem;
            margin-bottom: 12px;
            display: block;
        }
        .upload-area h3 {
            font-weight: 500;
            font-size: 1.2rem;
        }
        .upload-area p {
            color: var(--text-secondary);
            font-size: 0.92rem;
            margin-top: 4px;
        }
        .upload-area input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }

        /* ---------- Toolbar ---------- */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 24px;
            justify-content: center;
            align-items: center;
        }
        .toolbar .btn {
            padding: 10px 22px;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition);
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border-card);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font);
        }
        .toolbar .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }
        .toolbar .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }
        .toolbar .btn.primary {
            background: var(--accent-gradient);
            border-color: transparent;
            color: #fff;
        }
        .toolbar .btn.primary:hover:not(:disabled) {
            box-shadow: 0 8px 32px rgba(108, 92, 231, 0.35);
        }
        .toolbar .btn.success {
            background: #10b981;
            border-color: #10b981;
            color: #fff;
        }
        .toolbar .btn.success:hover:not(:disabled) {
            background: #059669;
            box-shadow: 0 8px 32px rgba(16, 185, 129, 0.3);
        }
        .toolbar .btn .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ---------- Preview Grid ---------- */
        .preview-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 28px;
        }
        @media (max-width: 700px) {
            .preview-grid {
                grid-template-columns: 1fr;
            }
        }

        .preview-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: var(--radius);
            overflow: hidden;
            backdrop-filter: blur(8px);
            transition: var(--transition);
        }
        .preview-card .card-header {
            padding: 12px 18px;
            font-weight: 500;
            font-size: 0.85rem;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border-card);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
        }
        .preview-card .card-header .badge {
            font-size: 0.7rem;
            background: rgba(108, 92, 231, 0.2);
            color: var(--accent-1);
            padding: 2px 12px;
            border-radius: 20px;
            border: 1px solid rgba(108, 92, 231, 0.15);
        }
        .preview-card .image-wrapper {
            position: relative;
            background: repeating-conic-gradient(rgba(255, 255, 255, 0.03) 0% 25%, transparent 0% 50%) 0 0 / 20px 20px;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }
        .preview-card .image-wrapper img,
        .preview-card .image-wrapper canvas {
            max-width: 100%;
            max-height: 460px;
            border-radius: 6px;
            display: block;
            object-fit: contain;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        .preview-card .image-wrapper .placeholder-text {
            color: var(--text-secondary);
            font-size: 0.9rem;
            opacity: 0.5;
        }
        .preview-card .image-wrapper .processing-overlay {
            position: absolute;
            inset: 0;
            background: rgba(11, 13, 21, 0.75);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            border-radius: var(--radius);
            opacity: 0;
            pointer-events: none;
            transition: var(--transition);
        }
        .preview-card .image-wrapper .processing-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .preview-card .image-wrapper .processing-overlay .big-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--accent-2);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .preview-card .image-wrapper .processing-overlay span {
            font-weight: 500;
            font-size: 0.95rem;
            color: #fff;
        }
        .preview-card .card-footer {
            padding: 10px 18px;
            border-top: 1px solid var(--border-card);
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            background: rgba(255, 255, 255, 0.01);
        }
        .preview-card .card-footer .btn-sm {
            padding: 4px 14px;
            font-size: 0.75rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-secondary);
            transition: var(--transition);
            font-family: var(--font);
        }
        .preview-card .card-footer .btn-sm:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }

        /* ---------- Info / Status ---------- */
        .status-bar {
            margin-top: 18px;
            display: flex;
            justify-content: center;
            gap: 28px;
            flex-wrap: wrap;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .status-bar .stat {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .status-bar .stat .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot.idle {
            background: #4b5563;
        }
        .dot.done {
            background: #10b981;
        }
        .dot.processing {
            background: #f59e0b;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }

        /* ---------- Responsive tweaks ---------- */
        @media (max-width: 480px) {
            .header h1 {
                font-size: 1.7rem;
            }
            .upload-area {
                padding: 28px 16px;
            }
            .toolbar .btn {
                padding: 8px 14px;
                font-size: 0.8rem;
            }
        }

        /* ---------- Utility ---------- */
        .hidden {
            display: none !important;
        }
        .mt-8 {
            margin-top: 8px;
        }
        .text-center {
            text-align: center;
        }
        .gap-4 {
            gap: 4px;
        }

        /* ---------- Toast ---------- */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 360px;
            width: 100%;
        }
        .toast {
            background: var(--bg-secondary);
            border: 1px solid var(--border-card);
            border-radius: var(--radius-sm);
            padding: 12px 18px;
            color: var(--text-primary);
            font-size: 0.9rem;
            box-shadow: var(--shadow);
            animation: slideUp 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(12px);
        }
        .toast .toast-icon {
            font-size: 1.3rem;
        }
        .toast.error {
            border-color: #ef4444;
        }
        .toast.error .toast-icon {
            color: #ef4444;
        }
        .toast.success {
            border-color: #10b981;
        }
        .toast.success .toast-icon {
            color: #10b981;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- Header -->
        <header class="header">
            <h1>✦ Image Studio</h1>
            <p>Remove backgrounds &amp; upscale to 4K — all in your browser.</p>
        </header>

        <!-- Upload Area -->
        <div class="upload-area" id="uploadArea">
            <span class="icon">🖼️</span>
            <h3>Drop your image here</h3>
            <p>or click to browse · JPG, PNG, WEBP</p>
            <input type="file" id="fileInput" accept="image/*" />
        </div>

        <!-- Toolbar -->
        <div class="toolbar" id="toolbar">
            <button class="btn primary" id="btnRemoveBg" disabled>
                ✦ Remove Background
            </button>
            <button class="btn primary" id="btnUpscale4k" disabled>
                ⬆ Upscale to 4K
            </button>
            <button class="btn success" id="btnDownload" disabled>
                ⬇ Download Result
            </button>
            <button class="btn" id="btnReset" disabled>
                ⟲ Reset
            </button>
        </div>

        <!-- Preview Grid -->
        <div class="preview-grid" id="previewGrid">
            <!-- Original -->
            <div class="preview-card" id="cardOriginal">
                <div class="card-header">
                    <span>📄 Original</span>
                    <span class="badge" id="originalSize">—</span>
                </div>
                <div class="image-wrapper" id="originalWrapper">
                    <span class="placeholder-text">No image loaded</span>
                </div>
                <div class="card-footer">
                    <span style="color:var(--text-secondary);font-size:0.75rem;">source</span>
                </div>
            </div>

            <!-- Result -->
            <div class="preview-card" id="cardResult">
                <div class="card-header">
                    <span>✨ Result</span>
                    <span class="badge" id="resultSize">—</span>
                </div>
                <div class="image-wrapper" id="resultWrapper">
                    <span class="placeholder-text">Awaiting processing…</span>
                    <!-- Processing overlay -->
                    <div class="processing-overlay" id="processingOverlay">
                        <div class="big-spinner"></div>
                        <span id="processingLabel">Processing…</span>
                    </div>
                </div>
                <div class="card-footer">
                    <button class="btn-sm" id="btnViewOriginal">View Original</button>
                    <button class="btn-sm" id="btnViewResult">View Result</button>
                </div>
            </div>
        </div>

        <!-- Status Bar -->
        <div class="status-bar" id="statusBar">
            <span class="stat"><span class="dot idle" id="statusDot"></span> <span id="statusText">Ready</span></span>
            <span class="stat">📐 <span id="dimensionText">—</span></span>
            <span class="stat">📦 <span id="fileSizeText">—</span></span>
        </div>

    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ===================== MAIN SCRIPT ===================== -->
    <script type="module">
        // ----- imports -----
        import { removeBackground } from '@imgly/background-removal';

        // ----- DOM refs -----
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const btnRemoveBg = document.getElementById('btnRemoveBg');
        const btnUpscale4k = document.getElementById('btnUpscale4k');
        const btnDownload = document.getElementById('btnDownload');
        const btnReset = document.getElementById('btnReset');
        const originalWrapper = document.getElementById('originalWrapper');
        const resultWrapper = document.getElementById('resultWrapper');
        const originalSize = document.getElementById('originalSize');
        const resultSize = document.getElementById('resultSize');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const dimensionText = document.getElementById('dimensionText');
        const fileSizeText = document.getElementById('fileSizeText');
        const processingOverlay = document.getElementById('processingOverlay');
        const processingLabel = document.getElementById('processingLabel');
        const btnViewOriginal = document.getElementById('btnViewOriginal');
        const btnViewResult = document.getElementById('btnViewResult');

        // ----- state -----
        const state = {
            originalImage: null, // HTMLImageElement
            originalBlob: null, // Blob
            currentCanvas: null, // Canvas (the current result)
            isProcessing: false,
            hasBgRemoved: false,
            hasUpscaled: false,
            resultBlob: null, // Blob for download
            resultFormat: 'image/png',
        };

        // ----- helpers -----
        function formatFileSize(bytes) {
            if (!bytes) return '—';
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        function formatDimensions(img) {
            if (!img) return '—';
            return `${img.naturalWidth || img.width} × ${img.naturalHeight || img.height}`;
        }

        function setStatus(text, type = 'idle') {
            statusText.textContent = text;
            statusDot.className = `dot ${type}`;
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icon = type === 'error' ? '❌' : type === 'success' ? '✅' : 'ℹ️';
            toast.innerHTML = `<span class="toast-icon">${icon}</span><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0';
                toast.style.transform = 'translateX(40px)';
                setTimeout(() => toast.remove(), 300); }, 4000);
        }

        function loadImageToWrapper(wrapper, source, isCanvas = false) {
            wrapper.innerHTML = '';
            if (!source) {
                wrapper.innerHTML = '<span class="placeholder-text">No image</span>';
                return;
            }
            if (isCanvas) {
                wrapper.appendChild(source);
            } else if (source instanceof HTMLImageElement) {
                wrapper.appendChild(source.cloneNode(true));
            } else if (source instanceof HTMLCanvasElement) {
                wrapper.appendChild(source);
            } else if (source instanceof Blob) {
                const url = URL.createObjectURL(source);
                const img = new Image();
                img.onload = () => { URL.revokeObjectURL(url); };
                img.src = url;
                wrapper.appendChild(img);
            } else {
                wrapper.innerHTML = '<span class="placeholder-text">Unsupported</span>';
            }
        }

        function getImageElement(wrapper) {
            const img = wrapper.querySelector('img');
            if (img) return img;
            const canvas = wrapper.querySelector('canvas');
            if (canvas) return canvas;
            return null;
        }

        // ----- image processing -----

        // Upscale using canvas with high-quality interpolation + sharpen
        function upscaleTo4K(source, targetWidth = 3840, targetHeight = 2160) {
            return new Promise((resolve) => {
                const img = source instanceof HTMLImageElement ? source :
                    (source instanceof HTMLCanvasElement ? source : null);
                if (!img) {
                    // try to get from wrapper
                    const el = getImageElement(source);
                    if (el) return upscaleTo4K(el, targetWidth, targetHeight);
                    throw new Error('Invalid source for upscaling');
                }

                const srcWidth = img.naturalWidth || img.width;
                const srcHeight = img.naturalHeight || img.height;

                // compute target dims maintaining aspect ratio
                let tw, th;
                const ratio = srcWidth / srcHeight;
                if (srcWidth >= targetWidth && srcHeight >= targetHeight) {
                    // already >= 4K, just return a copy
                    const canvas = document.createElement('canvas');
                    canvas.width = srcWidth;
                    canvas.height = srcHeight;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    return resolve(canvas);
                }
                if (ratio > 1) {
                    tw = targetWidth;
                    th = Math.round(targetWidth / ratio);
                } else {
                    th = targetHeight;
                    tw = Math.round(targetHeight * ratio);
                }

                // clamp to minimum 4K area
                if (tw < targetWidth && th < targetHeight) {
                    if (ratio > 1) { tw = targetWidth;
                        th = Math.round(targetWidth / ratio); } else { th = targetHeight;
                        tw = Math.round(targetHeight * ratio); }
                }

                // Multi-pass upscaling for better quality (2x steps)
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';

                let currentWidth = srcWidth;
                let currentHeight = srcHeight;
                let tempCanvas = document.createElement('canvas');
                let tempCtx = tempCanvas.getContext('2d');
                tempCtx.imageSmoothingEnabled = true;
                tempCtx.imageSmoothingQuality = 'high';

                // Draw original onto temp
                tempCanvas.width = srcWidth;
                tempCanvas.height = srcHeight;
                tempCtx.drawImage(img, 0, 0);

                // Step up by 2x until close to target
                while (currentWidth * 2 <= tw && currentHeight * 2 <= th) {
                    const newW = currentWidth * 2;
                    const newH = currentHeight * 2;
                    const nextCanvas = document.createElement('canvas');
                    nextCanvas.width = newW;
                    nextCanvas.height = newH;
                    const nextCtx = nextCanvas.getContext('2d');
                    nextCtx.imageSmoothingEnabled = true;
                    nextCtx.imageSmoothingQuality = 'high';
                    nextCtx.drawImage(tempCanvas, 0, 0, newW, newH);
                    tempCanvas = nextCanvas;
                    tempCtx = nextCtx;
                    currentWidth = newW;
                    currentHeight = newH;
                }

                // Final resize to exact target
                canvas.width = tw;
                canvas.height = th;
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                ctx.drawImage(tempCanvas, 0, 0, tw, th);

                // Apply sharpening
                const imageData = ctx.getImageData(0, 0, tw, th);
                const data = imageData.data;
                const width = tw;
                const height = th;
                const sharpenKernel = [
                    [0, -1, 0],
                    [-1, 5, -1],
                    [0, -1, 0]
                ];
                const kernelSize = 3;
                const half = Math.floor(kernelSize / 2);
                const srcData = new Uint8ClampedArray(data);

                for (let y = half; y < height - half; y++) {
                    for (let x = half; x < width - half; x++) {
                        let r = 0,
                            g = 0,
                            b = 0;
                        for (let ky = 0; ky < kernelSize; ky++) {
                            for (let kx = 0; kx < kernelSize; kx++) {
                                const px = (y + ky - half) * width + (x + kx - half);
                                const weight = sharpenKernel[ky][kx];
                                r += srcData[px * 4] * weight;
                                g += srcData[px * 4 + 1] * weight;
                                b += srcData[px * 4 + 2] * weight;
                            }
                        }
                        const idx = (y * width + x) * 4;
                        data[idx] = Math.min(255, Math.max(0, r));
                        data[idx + 1] = Math.min(255, Math.max(0, g));
                        data[idx + 2] = Math.min(255, Math.max(0, b));
                        // alpha unchanged
                    }
                }
                ctx.putImageData(imageData, 0, 0);

                resolve(canvas);
            });
        }

        // Background removal using @imgly/background-removal
        async function removeBackgroundFromImage(source) {
            let input;
            if (source instanceof HTMLImageElement) {
                // Convert to blob
                const canvas = document.createElement('canvas');
                canvas.width = source.naturalWidth || source.width;
                canvas.height = source.naturalHeight || source.height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(source, 0, 0);
                const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
                input = blob;
            } else if (source instanceof HTMLCanvasElement) {
                const blob = await new Promise(resolve => source.toBlob(resolve, 'image/png'));
                input = blob;
            } else if (source instanceof Blob) {
                input = source;
            } else {
                throw new Error('Unsupported source for background removal');
            }

            try {
                const resultBlob = await removeBackground(input, {
                    output: {
                        format: 'image/png',
                        quality: 0.92,
                    },
                    progress: (p) => {
                        const percent = Math.round(p * 100);
                        processingLabel.textContent = `Removing background… ${percent}%`;
                    },
                });
                return resultBlob;
            } catch (err) {
                console.error('Background removal error:', err);
                throw new Error('Failed to remove background. Please try again.');
            }
        }

        // ----- UI update -----
        function updateUI() {
            const hasImage = !!state.originalImage;
            btnRemoveBg.disabled = !hasImage || state.isProcessing;
            btnUpscale4k.disabled = !hasImage || state.isProcessing;
            btnDownload.disabled = !state.resultBlob || state.isProcessing;
            btnReset.disabled = !hasImage || state.isProcessing;

            // Update original preview
            if (state.originalImage) {
                const wrapper = originalWrapper;
                wrapper.innerHTML = '';
                const clone = state.originalImage.cloneNode(true);
                clone.style.maxWidth = '100%';
                clone.style.maxHeight = '460px';
                clone.style.objectFit = 'contain';
                wrapper.appendChild(clone);
                originalSize.textContent = formatDimensions(state.originalImage);
            } else {
                originalWrapper.innerHTML = '<span class="placeholder-text">No image loaded</span>';
                originalSize.textContent = '—';
            }

            // Update result preview
            if (state.currentCanvas) {
                const wrapper = resultWrapper;
                // Remove any existing canvas/img
                const existing = wrapper.querySelector('canvas, img');
                if (existing) existing.remove();
                // Remove overlay children except processing overlay
                const overlay = wrapper.querySelector('.processing-overlay');
                wrapper.querySelectorAll(':scope > *:not(.processing-overlay)').forEach(el => el.remove());
                const canvasClone = state.currentCanvas.cloneNode(true);
                canvasClone.style.maxWidth = '100%';
                canvasClone.style.maxHeight = '460px';
                canvasClone.style.objectFit = 'contain';
                wrapper.appendChild(canvasClone);
                if (overlay) wrapper.appendChild(overlay);
                resultSize.textContent = `${state.currentCanvas.width} × ${state.currentCanvas.height}`;
            } else if (state.resultBlob) {
                // If we have a blob but no canvas (e.g. bg removal result), create a canvas from it
                const url = URL.createObjectURL(state.resultBlob);
                const img = new Image();
                img.onload = () => {
                    URL.revokeObjectURL(url);
                    const canvas = document.createElement('canvas');
                    canvas.width = img.naturalWidth;
                    canvas.height = img.naturalHeight;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    state.currentCanvas = canvas;
                    updateUI();
                };
                img.src = url;
                // show placeholder while loading
                resultWrapper.innerHTML =
                    '<span class="placeholder-text">Loading result…</span><div class="processing-overlay" id="processingOverlay"><div class="big-spinner"></div><span id="processingLabel">Loading…</span></div>';
                return;
            } else {
                resultWrapper.innerHTML =
                '<span class="placeholder-text">Awaiting processing…</span>';
                resultSize.textContent = '—';
                // re-add overlay
                const overlay = document.getElementById('processingOverlay');
                if (overlay) resultWrapper.appendChild(overlay);
            }

            // Dimensions & size
            if (state.originalImage) {
                dimensionText.textContent = formatDimensions(state.originalImage);
                if (state.originalBlob) {
                    fileSizeText.textContent = formatFileSize(state.originalBlob.size);
                }
            }

            // Re-attach overlay ref
            const overlay = document.getElementById('processingOverlay');
            if (overlay) {
                // Make sure it's in the result wrapper
                if (overlay.parentNode !== resultWrapper) {
                    resultWrapper.appendChild(overlay);
                }
            }
        }

        function setProcessing(active, label = 'Processing…') {
            state.isProcessing = active;
            const overlay = document.getElementById('processingOverlay');
            if (active) {
                overlay.classList.add('active');
                processingLabel.textContent = label;
                setStatus(label, 'processing');
            } else {
                overlay.classList.remove('active');
                setStatus('Ready', 'idle');
            }
            updateUI();
        }

        // ----- main actions -----

        async function handleRemoveBg() {
            if (!state.originalImage || state.isProcessing) return;
            setProcessing(true, 'Removing background…');
            try {
                const source = state.currentCanvas || state.originalImage;
                const resultBlob = await removeBackgroundFromImage(source);

                // Convert blob to canvas
                const url = URL.createObjectURL(resultBlob);
                const img = new Image();
                await new Promise((resolve, reject) => {
                    img.onload = resolve;
                    img.onerror = reject;
                    img.src = url;
                });
                URL.revokeObjectURL(url);
                const canvas = document.createElement('canvas');
                canvas.width = img.naturalWidth;
                canvas.height = img.naturalHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);

                state.currentCanvas = canvas;
                state.resultBlob = resultBlob;
                state.hasBgRemoved = true;
                state.resultFormat = 'image/png';

                setProcessing(false);
                updateUI();
                showToast('Background removed successfully!', 'success');
            } catch (err) {
                setProcessing(false);
                showToast(err.message || 'Background removal failed.', 'error');
                console.error(err);
            }
        }

        async function handleUpscale4k() {
            if (!state.originalImage || state.isProcessing) return;
            setProcessing(true, 'Upscaling to 4K…');
            try {
                const source = state.currentCanvas || state.originalImage;
                const canvas = await upscaleTo4K(source, 3840, 2160);

                state.currentCanvas = canvas;
                state.hasUpscaled = true;

                // Convert to blob for download
                const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
                state.resultBlob = blob;
                state.resultFormat = 'image/png';

                setProcessing(false);
                updateUI();
                showToast(`Upscaled to ${canvas.width} × ${canvas.height}`, 'success');
            } catch (err) {
                setProcessing(false);
                showToast(err.message || 'Upscaling failed.', 'error');
                console.error(err);
            }
        }

        function handleDownload() {
            if (!state.resultBlob) {
                showToast('No result to download.', 'error');
                return;
            }
            const ext = state.resultFormat === 'image/png' ? 'png' : 'jpg';
            const a = document.createElement('a');
            a.href = URL.createObjectURL(state.resultBlob);
            a.download = `processed_image.${ext}`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(a.href), 5000);
            showToast('Download started!', 'success');
        }

        function handleReset() {
            if (!state.originalImage) return;
            state.currentCanvas = null;
            state.resultBlob = null;
            state.hasBgRemoved = false;
            state.hasUpscaled = false;
            state.resultFormat = 'image/png';
            // reset result wrapper
            resultWrapper.innerHTML =
                '<span class="placeholder-text">Awaiting processing…</span><div class="processing-overlay" id="processingOverlay"><div class="big-spinner"></div><span id="processingLabel">Processing…</span></div>';
            updateUI();
            showToast('Reset to original', 'info');
        }

        // ----- file upload -----
        function handleFile(file) {
            if (!file || !file.type.startsWith('image/')) {
                showToast('Please upload a valid image.', 'error');
                return;
            }
            if (state.isProcessing) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    state.originalImage = img;
                    state.originalBlob = file;
                    state.currentCanvas = null;
                    state.resultBlob = null;
                    state.hasBgRemoved = false;
                    state.hasUpscaled = false;
                    state.resultFormat = 'image/png';
                    // reset result view
                    resultWrapper.innerHTML =
                        '<span class="placeholder-text">Awaiting processing…</span><div class="processing-overlay" id="processingOverlay"><div class="big-spinner"></div><span id="processingLabel">Processing…</span></div>';
                    updateUI();
                    setStatus('Image loaded', 'idle');
                    showToast(`Loaded: ${file.name} (${formatFileSize(file.size)})`, 'success');
                };
                img.onerror = () => {
                    showToast('Failed to load image.', 'error');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // ----- event listeners -----
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) {
                handleFile(e.target.files[0]);
            }
            e.target.value = '';
        });

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        btnRemoveBg.addEventListener('click', handleRemoveBg);
        btnUpscale4k.addEventListener('click', handleUpscale4k);
        btnDownload.addEventListener('click', handleDownload);
        btnReset.addEventListener('click', handleReset);

        // View toggle buttons
        btnViewOriginal.addEventListener('click', () => {
            if (state.originalImage) {
                const wrapper = originalWrapper;
                const img = wrapper.querySelector('img');
                if (img) {
                    // scroll to it
                    img.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
        });
        btnViewResult.addEventListener('click', () => {
            if (state.currentCanvas || state.resultBlob) {
                const wrapper = resultWrapper;
                const el = wrapper.querySelector('canvas, img');
                if (el) {
                    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
        });

        // ----- keyboard shortcuts -----
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !state.isProcessing) {
                if (e.target === fileInput) return;
                if (!state.resultBlob && state.originalImage) {
                    // Try bg removal first, then upscale if bg removal not available?
                    if (!state.hasBgRemoved) {
                        btnRemoveBg.click();
                    } else if (!state.hasUpscaled) {
                        btnUpscale4k.click();
                    }
                }
            }
            if (e.key === 'r' && e.ctrlKey) {
                e.preventDefault();
                btnReset.click();
            }
            if (e.key === 'd' && e.ctrlKey) {
                e.preventDefault();
                btnDownload.click();
            }
        });

        // ----- init -----
        setStatus('Ready', 'idle');
        updateUI();

        // ----- handle global errors from the library -----
        window.addEventListener('unhandledrejection', (e) => {
            console.error('Unhandled rejection:', e.reason);
            if (state.isProcessing) {
                setProcessing(false);
                showToast('An error occurred. Please try again.', 'error');
            }
        });

        console.log('✦ Image Studio loaded.');
        console.log('ℹ️ Upload an image, then use the buttons to remove background or upscale to 4K.');
        console.log('⌨️ Shortcuts: Enter = process, Ctrl+R = reset, Ctrl+D = download');
    </script>

</body>
</html>
